---
argument_specs:
  main:
    short_description: Deploy Claude Code as an always-on service that root enters with claude-code
    description:
      - Deploys the image that the entry point image built (ansible/images/claude-code-<version>.tar) to the servers
        as the always-on service claude-code, with aslib.infra.podman_service, as an account of its own whose home is
        /opt/claude-code. Runs from the project's ansible/ directory (see the entry point setup).
      - The container holds Claude Code and its tools, without a port. The project's config/ directory, with
        Claude's instructions CLAUDE.md, is mounted read-only as /etc/claude-code, where Claude Code reads them. Its
        policy managed-settings.json there is the base of aslib.infra.claude_code_settings (which claude_code_vm
        installs too), the part of aslib.infra.claude_code_skills (loop-to-delivery's hooks, when on), the container's
        own part (files/managed-settings.container.json) and the project's config/managed-settings.json, merged in
        that order - later values win, lists combine. How a session starts (permission mode, model, effort, theme,
        agent teams, ultracode) is claude_code_settings' settings, the same names in every target, and so are the
        skills of aslib.infra.claude_code_skills - the qa skill with its five experts (claude_code_skills_qa) and
        loop-to-delivery (claude_code_skills_loop_to_delivery) - whose files the deploy adds to config/.claude/. The
        container's environment variables come from ansible/container.env, Claude's sign-in too
        (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY). With podman_service_shared, Claude also works in the shared
        zone, /opt/containers/shared/.
      - A deploy that still sets a setting of before 0.7.0 (claude_code_bypass_permissions, claude_code_memory, ...)
        stops, naming what replaced it; so does one that sets claude_code_settings_qa, which is now
        claude_code_skills_qa.
      - Installs /usr/local/sbin/claude-code, for root, which runs Claude in the container, with or without a
        terminal; its arguments go to claude.
      - Servers need what aslib.infra.podman_service needs.
    options:
      claude_code_podman_ansible_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description: The project's ansible/ directory, on the Ansible machine. Defaults to the current directory.
      claude_code_podman_memory:
        type: str
        default: 4g
        description:
          - The most memory Claude's container may use (podman_service_memory), its /tmp included, so a runaway build
            cannot starve the server. Past it, the kernel stops a process in the container.
          - Empty sets no limit.
  setup:
    short_description: Write a Claude Code project, ready to build and deploy with aslib.infra
    description:
      - Writes the project into an empty directory, for a git repository of its own, or brings an earlier one up to
        date. Needs nothing in the directory beforehand.
      - The project's files, written once and never touched again - config/managed-settings.json (the project's
        part of the policy, empty to start),
        config/CLAUDE.md (Claude's instructions, a template); in ansible/, inventory.yml, group_vars/all/project.yml
        (every setting at its default) and container.env (git-ignored).
      - aslib.infra's files, brought up to date by every run - the Containerfile (Claude Code on Red Hat UBI 9 from
        Anthropic's signed dnf repository, plus the tools Claude needs), .containerignore and README.md (building and
        running it with plain Podman); in ansible/, ansible.cfg, .gitignore, the guide README.md,
        group_vars/all/defaults.yml, the playbooks image.yml, deploy.yml, build-and-deploy.yml, restart.yml, remove.yml
        and update-playbooks.yml, and the Quadlet template templates/service.container.j2. A file that changes is kept
        as <file>.bak first (one copy), for the project to merge from.
      - Runs on any machine with ansible-core. Needs no network access.
    options:
      claude_code_podman_project:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description: The project's root directory. Defaults to the current directory.
  image:
    short_description: Build a Claude Code project's Containerfile into a versioned image archive
    description:
      - Builds the project's Containerfile, from its ansible/ directory, into ansible/images/claude-code-<version>.tar,
        tagged localhost/claude-code:<version>. Without I(claude_code_podman_version), the version is the newest in
        I(claude_code_podman_repository), which a throwaway container of the base image looks up; a rebuild makes a new
        image only when that version, the base image or the Containerfile changed, so every build is also the update.
      - Keeps only that archive in images/, and only that image of the project on this machine.
      - Needs Podman 4.9 or newer (RHEL 9.6, Ubuntu 24.04) and access to the base image's registry and dnf
        repositories (Red Hat's UBI repositories), Anthropic's repository and GitHub (nvm), or to mirrors of them
        (I(claude_code_podman_base_image) or registries.conf, I(claude_code_podman_rpm_repos), I(claude_code_podman_repository) and
        I(claude_code_podman_key_url), I(claude_code_podman_nvm_url)).
    options:
      claude_code_podman_ansible_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description: The project's ansible/ directory. Defaults to the current directory.
      claude_code_podman_base_image:
        type: str
        default: registry.access.redhat.com/ubi9/ubi
        description: The image the Containerfile builds on (its BASE_IMAGE), which must have dnf and /usr/bin/python3 (the
          Containerfile installs no python3 of its own, and loop-to-delivery's hook runs with it). A mirror for one
          environment belongs in the build machine's registries.conf instead.
      claude_code_podman_repository:
        type: str
        default: https://downloads.claude.ai/claude-code/rpm/stable
        description: Anthropic's dnf repository for Claude Code, or a mirror of it. C(.../rpm/stable) trails
          C(.../rpm/latest) by about a week and skips releases with major regressions.
      claude_code_podman_key_url:
        type: str
        default: https://downloads.claude.ai/keys/claude-code.asc
        description: The repository's signing key, or a mirror of it. The build checks it is Anthropic's release key
          by its fingerprint.
      claude_code_podman_version:
        type: str
        default: ""
        description: The Claude Code version to build, e.g. C(2.1.211). Empty means the repository's newest.
      claude_code_podman_nvm_url:
        type: str
        default: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/nvm.sh
        description:
          - nvm, the Node.js version manager, in the image. One script of a release (the Containerfile's NVM_URL), or a
            mirror of it.
          - A newer release needs I(claude_code_podman_nvm_sha256) changed too; a mirror of the same file keeps it.
      claude_code_podman_nvm_sha256:
        type: str
        default: a64806abf6aab85c456f9ffa2a3be737e35c3a1e6ac99a44ea20c69bdc923467
        description: The SHA-256 of that script (the Containerfile's NVM_SHA256). A mismatch stops the build.
      claude_code_podman_rpm_repos:
        type: str
        default: ""
        description:
          - A directory of dnf repository files (.repo), such as a mirror's, for the packages the Containerfile
            installs. They replace the base image's own repositories while the image builds, rather than adding to
            them, and are never stored in the image. A relative path is taken from the directory ansible-playbook
            runs in.
          - Empty, the default, keeps the base image's own (Red Hat's UBI repositories; on a subscribed RHEL build
            machine, Podman adds the host's subscription).
  restart:
    short_description: Restart Claude Code's service and wait until it runs
    description:
      - Restarts the service with aslib.infra.podman_service (entry point restart), which ends what runs in the
        container; conversations stay. For a restart without a change the deploy would see.
      - Runs from the project's ansible/ directory, as root on the server, like the deploy.
    options:
      claude_code_podman_ansible_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description: The project's ansible/ directory. Defaults to the current directory.
  remove:
    short_description: Remove Claude Code from the servers, keeping its directory unless asked
    description:
      - Removes the service with aslib.infra.podman_service (entry point remove) and the claude-code command. The
        service's directory, /opt/claude-code with Claude's login and what it wrote, stays unless
        podman_service_remove_workdir is true.
      - Runs from the project's ansible/ directory, as root on the server, like the deploy.
    options:
      claude_code_podman_ansible_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description: The project's ansible/ directory. Defaults to the current directory.
