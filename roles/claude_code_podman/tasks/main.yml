---
# Entry point "main": deploys the image in images/ as the always-on service
# claude-code, with aslib.infra.podman_service, and installs the claude-code command
# that enters it. Runs as root on the servers.
- name: Check this is a Claude Code project
  ansible.builtin.import_tasks: project.yml

# images/ holds the one version the build made (on the Ansible machine).
- name: Find the image archive in images/
  ansible.builtin.set_fact:
    __claude_code_podman_found_archives: "{{ query('fileglob', __claude_code_podman_images ~ '/' ~ __claude_code_podman_name ~ '-*.tar') }}"

- name: Check there is one image archive, the environment file and the policy
  ansible.builtin.assert:
    that:
      - __claude_code_podman_found_archives | length == 1
      - (claude_code_podman_ansible_dir ~ '/container.env') is file
      - (__claude_code_podman_root ~ '/config/managed-settings.json') is file
    fail_msg: >-
      The deploy needs one image archive in {{ __claude_code_podman_images }} (build it: ansible-playbook image.yml; found
      {{ __claude_code_podman_found_archives | length }}), {{ claude_code_podman_ansible_dir }}/container.env, which holds the
      container's settings and secrets and is not in git (create it; it may be empty), and the policy,
      {{ __claude_code_podman_root }}/config/managed-settings.json.
    quiet: true

- name: Note the version to deploy
  ansible.builtin.set_fact:
    __claude_code_podman_archive: "{{ __claude_code_podman_found_archives[0] }}"
    __claude_code_podman_version: >-
      {{ __claude_code_podman_found_archives[0] | basename
         | regex_replace('^' ~ __claude_code_podman_name ~ '-', '') | regex_replace('[.]tar$', '') }}

# How a session starts, the same as in claude_code_vm's VM, as facts: the base
# of the policy, the environment of every claude process and Claude Code's own
# .claude.json for a new home.
- name: Compute Claude Code's settings
  ansible.builtin.include_role:
    name: aslib.infra.claude_code_settings

# config/ becomes /etc/claude-code/ in the container: the policy, Claude's
# instructions (CLAUDE.md) and any other file of the project's config/ that
# Claude Code reads there, and claude_code_settings' files in .claude/ (the qa
# skill and its experts, when on). The policy
# Claude Code reads is, in this order: claude_code_settings' base, the
# container's own part (files/managed-settings.container.json) and the project's
# config/managed-settings.json. A later value replaces an earlier one, blocks
# such as env merge key by key and lists combine without duplicates, as Claude
# Code combines its own drop-in files. Reading them also checks they are JSON.
- name: Note the files of /etc/claude-code
  vars:
    __claude_code_podman_policy: >-
      {{ claude_code_settings_policy
         | combine(lookup('ansible.builtin.file', 'managed-settings.container.json') | from_json,
                   lookup('ansible.builtin.file', __claude_code_podman_root ~ '/config/managed-settings.json') | from_json,
                   recursive=True, list_merge='append_rp') }}
  ansible.builtin.set_fact:
    __claude_code_podman_config_files: >-
      {{ query('fileglob', __claude_code_podman_root ~ '/config/*') | reject('search', '/managed-settings[.]json$') | list
         + [{'name': 'managed-settings.json', 'content': __claude_code_podman_policy | to_nice_json(indent=2, sort_keys=False)}]
         + claude_code_settings_files }}
    __claude_code_podman_mode: "{{ __claude_code_podman_policy.permissions.defaultMode | default('default') }}"

# The Quadlet template is the project's (ansible/templates/service.container.j2,
# from the setup, for the project to tune) if it has one, else podman_service's.
- name: Deploy the service
  ansible.builtin.import_role:
    name: aslib.infra.podman_service
  vars:
    __claude_code_podman_template: "{{ claude_code_podman_ansible_dir }}/templates/service.container.j2"
    podman_service_name: "{{ __claude_code_podman_service }}"
    podman_service_dir: "{{ __claude_code_podman_home }}"
    podman_service_port: 0
    podman_service_image: localhost/{{ __claude_code_podman_name }}:{{ __claude_code_podman_version }}
    podman_service_archive: "{{ __claude_code_podman_archive }}"
    podman_service_env_file: "{{ claude_code_podman_ansible_dir }}/container.env"
    podman_service_config_files: "{{ __claude_code_podman_config_files }}"
    podman_service_quadlet_template: "{{ __claude_code_podman_template if __claude_code_podman_template is file else '' }}"
    # Nothing in the container serves, so there is nothing to check its health with.
    podman_service_health_cmd: ""
    podman_service_memory: "{{ claude_code_podman_memory | default('') }}"

# Claude Code reads ~/.bashrc when it starts a session's shell. RHEL's default
# one loads /etc/bashrc and with it /etc/profile.d/, where the image's nvm is.
# Written once, as useradd would from /etc/skel; it is Claude's from then on.
- name: Give Claude's home RHEL's default .bashrc, if it has none
  ansible.builtin.copy:
    content: |
      # .bashrc, as RHEL's /etc/skel has it: loads /etc/bashrc, which loads
      # /etc/profile.d/*.sh (nvm among them). Written once by the deploy; yours to change.
      if [ -f /etc/bashrc ]; then
        . /etc/bashrc
      fi
    dest: "{{ __claude_code_podman_dir }}/.bashrc"
    owner: "{{ __claude_code_podman_user }}"
    group: "{{ __claude_code_podman_user }}"
    mode: "0644"
    force: false

# Claude Code's own file, in its configuration directory (CLAUDE_CONFIG_DIR, see
# files/Containerfile): skips the setup of its first start. Written once; it is
# Claude Code's from then on.
- name: Create Claude Code's configuration directory in Claude's home
  ansible.builtin.file:
    path: "{{ __claude_code_podman_dir }}/.claude"
    state: directory
    owner: "{{ __claude_code_podman_user }}"
    group: "{{ __claude_code_podman_user }}"
    mode: "0700"

- name: Give Claude Code its .claude.json, if it has none
  ansible.builtin.copy:
    content: "{{ claude_code_settings_global_config | to_nice_json(indent=2) }}\n"
    dest: "{{ __claude_code_podman_dir }}/.claude/.claude.json"
    owner: "{{ __claude_code_podman_user }}"
    group: "{{ __claude_code_podman_user }}"
    mode: "0600"
    force: false

- name: Install the command that enters Claude Code, /usr/local/sbin/{{ __claude_code_podman_name }}
  ansible.builtin.template:
    src: claude-code.sh.j2
    dest: /usr/local/sbin/{{ __claude_code_podman_name }}
    owner: root
    group: root
    mode: "0750"

- name: Show how to enter Claude Code
  ansible.builtin.debug:
    msg: >-
      Claude Code {{ __claude_code_podman_version }} runs as the service {{ __claude_code_podman_name }}, starting its
      sessions in {{ __claude_code_podman_mode }} mode. Enter it as root on the server: sudo -i, then
      {{ __claude_code_podman_name }}.
