---
# Shared by the build (image.yml), the deploy (main.yml), the restart and the
# removal: checks they run from a Claude Code project's ansible/ directory.
- name: Check no setting has a name of before 0.7.0
  ansible.builtin.import_tasks: renamed.yml

# 0.8.2 moved the qa skill to claude_code_skills. Not in the setup (a project's
# update-playbooks.yml), which must still rewrite defaults.yml, aslib.infra's
# file: a 0.8.0 setup wrote the old name there and into project.yml.
- name: Stop at claude_code_settings_qa, which is now claude_code_skills_qa
  ansible.builtin.assert:
    that: query('ansible.builtin.varnames', '^claude_code_settings_qa$') | length == 0
    fail_msg: >-
      claude_code_settings_qa is set, which is now claude_code_skills_qa (the qa skill moved to
      aslib.infra.claude_code_skills in 0.8.2). First run update-playbooks.yml, which rewrites
      ansible/group_vars/all/defaults.yml without it; then rename the line in ansible/group_vars/all/project.yml to
      claude_code_skills_qa, or delete it, and likewise wherever else you set it (the inventory or -e). The
      CHANGELOG's upgrade notes for 0.8.2 say more.
    quiet: true

- name: Check this is the ansible/ directory of a Claude Code project
  ansible.builtin.assert:
    that: ((claude_code_podman_ansible_dir | dirname) ~ '/Containerfile') is file
    fail_msg: >-
      No Containerfile in {{ claude_code_podman_ansible_dir | dirname }}. Run this from the Claude Code project's
      ansible/ directory; a new project starts with: ansible-playbook aslib.infra.claude_code_podman_setup
    quiet: true

# Facts, not only role variables: podman_service's handlers do not see this
# role's variables in ansible-core 2.12 and 2.14.
- name: Note the project's directories and the service's names
  ansible.builtin.set_fact:
    __claude_code_podman_root: "{{ claude_code_podman_ansible_dir | dirname }}"
    __claude_code_podman_images: "{{ claude_code_podman_ansible_dir }}/images"
    __claude_code_podman_user: "{{ podman_service_user | default('', true) or __claude_code_podman_name }}"
    __claude_code_podman_service: "{{ __claude_code_podman_name }}"
    __claude_code_podman_home: "{{ __claude_code_podman_dir }}"
