---
- name: Check the project the setup wrote, its image, and that an update keeps the project's own files
  hosts: localhost
  gather_facts: false
  vars_files: [vars/project.yml]
  vars:
    __claude_code_podman_test_dir: "{{ claude_code_podman_test_project }}/ansible"
    __claude_code_podman_test_roles: "{{ playbook_dir }}/../../.."
    __claude_code_podman_test_policy: "{{ lookup('file', claude_code_podman_test_project ~ '/config/managed-settings.json') | from_json }}"
    # What a real image must have: Claude Code and the Containerfile's tools.
    __claude_code_podman_test_tools: [git, ssh, jq, less, which, find, diff, patch, file, ps, ip, vi, tar, gzip, unzip, xz,
                                      zstd, rsync, python3.12, pip3.12, gcc, g++, make, node, npm, sqlite3, mysql, psql]
    __claude_code_podman_test_commands: "{{ ['claude'] + (__claude_code_podman_test_tools if claude_code_podman_test_real | bool else []) }}"
    # claude_code_skills' unit tests and its hook program (test data here; no role reads them at run time).
    __claude_code_podman_test_suite_dir: "{{ (__claude_code_podman_test_roles ~ '/claude_code_skills/molecule/build_machine/tests') | realpath }}"
    __claude_code_podman_test_program_dir: "{{ (__claude_code_podman_test_roles ~ '/claude_code_skills/files/skills/loop-to-delivery') | realpath }}"
  tasks:
    - name: Inspect the environment file
      ansible.builtin.stat:
        path: "{{ __claude_code_podman_test_dir }}/container.env"
      register: __claude_code_podman_test_env

    - name: Check the project's files are there, with their contents
      ansible.builtin.assert:
        that:
          - (claude_code_podman_test_project ~ '/README.md') is file
          - (claude_code_podman_test_project ~ '/.containerignore') is file
          - (claude_code_podman_test_project ~ '/config/CLAUDE.md') is file
          - lookup('file', claude_code_podman_test_project ~ '/Containerfile')
            == lookup('file', __claude_code_podman_test_roles ~ '/claude_code_podman/'
                      ~ ('files' if claude_code_podman_test_real | bool else 'molecule/mock') ~ '/Containerfile')
          - __claude_code_podman_test_policy == {}
          - (lookup('file', __claude_code_podman_test_dir ~ '/inventory.yml') | from_yaml).all.hosts.localhost.ansible_connection == 'local'
          - __claude_code_podman_test_env.stat.mode == '0600'
          # It says how to sign in with a token of claude setup-token.
          - lookup('file', __claude_code_podman_test_dir ~ '/container.env') is search('^# CLAUDE_CODE_OAUTH_TOKEN=$', multiline=True)
        success_msg: >-
          PASSED claude_code_podman wrote the Containerfile, the instructions and the project's policy in config/ (empty: the
          deploy adds aslib.infra's), the guide, the inventory and a private environment file.

    - name: Check aslib.infra's files are there, with their contents
      ansible.builtin.assert:
        that:
          - lookup('file', __claude_code_podman_test_dir ~ '/ansible.cfg') is search('^callbacks_enabled = aslib\.infra\.run_log$', multiline=True)
          - lookup('file', __claude_code_podman_test_dir ~ '/.gitignore').splitlines() is superset(['container.env', '*.bak', 'logs/'])
          - lookup('file', __claude_code_podman_test_dir ~ '/images/.gitignore') == '*'
          - "lookup('file', __claude_code_podman_test_dir ~ '/image.yml') is search('tasks_from: image')"
          - "lookup('file', __claude_code_podman_test_dir ~ '/deploy.yml') is search('name: aslib.infra.claude_code_podman')"
          - "lookup('file', __claude_code_podman_test_dir ~ '/build-and-deploy.yml') is search('import_playbook: deploy.yml')"
          - "lookup('file', __claude_code_podman_test_dir ~ '/remove.yml') is search('tasks_from: remove')"
          - "lookup('file', __claude_code_podman_test_dir ~ '/restart.yml') is search('tasks_from: restart')"
          - "lookup('file', __claude_code_podman_test_dir ~ '/update-playbooks.yml') is search('tasks_from: setup')"
          - lookup('file', __claude_code_podman_test_dir ~ '/README.md') is search('sudo journalctl _SYSTEMD_USER_UNIT=claude-code.service')
          - lookup('file', __claude_code_podman_test_dir ~ '/templates/service.container.j2')
            == lookup('file', __claude_code_podman_test_roles ~ '/podman_service/templates/service.container.j2')
        success_msg: PASSED claude_code_podman wrote ansible/ with its playbooks, guide, Quadlet template and git rules.

    # The options of claude_code_skills, which took claude_code_settings_qa's place after 0.8.0.
    - name: Check both settings files list claude_code_skills' settings at their defaults, and not the old qa name
      vars:
        __claude_code_podman_test_text: "{{ lookup('file', __claude_code_podman_test_dir ~ '/group_vars/all/' ~ item) }}"
        __claude_code_podman_test_settings: "{{ __claude_code_podman_test_text | from_yaml }}"
      ansible.builtin.assert:
        that:
          - __claude_code_podman_test_settings.claude_code_skills_qa is defined
          - __claude_code_podman_test_settings.claude_code_skills_qa is false
          - __claude_code_podman_test_settings.claude_code_skills_loop_to_delivery is defined
          - __claude_code_podman_test_settings.claude_code_skills_loop_to_delivery is false
          - __claude_code_podman_test_settings.claude_code_skills_loop_to_delivery_max_wakes is defined
          - __claude_code_podman_test_settings.claude_code_skills_loop_to_delivery_max_wakes == 100
          - "'claude_code_settings_qa' not in __claude_code_podman_test_settings"
          - __claude_code_podman_test_text is search('aslib[.]infra[.]claude_code_skills')
        fail_msg: "{{ item }}: {{ __claude_code_podman_test_text }}"
        success_msg: >-
          PASSED claude_code_podman: {{ item }} lists claude_code_skills_qa, claude_code_skills_loop_to_delivery and
          its maximum at their defaults, names aslib.infra.claude_code_skills, and has no claude_code_settings_qa.
      loop: [defaults.yml, project.yml]

    # Both settings files must hold exactly the roles' defaults, or they would mislead.
    - name: Check both settings files hold every setting at the roles' default
      vars:
        __claude_code_podman_test_role_defaults: >-
          {{ lookup('file', __claude_code_podman_test_roles ~ '/claude_code_podman/defaults/main.yml') | from_yaml
             | combine(lookup('file', __claude_code_podman_test_roles ~ '/podman_service/defaults/main.yml') | from_yaml,
                       __claude_code_podman_test_settings_defaults) }}
        # Every setting of how a session starts, which claude_code_settings owns,
        # and of the skills, which claude_code_skills owns.
        __claude_code_podman_test_settings_defaults: >-
          {{ lookup('file', __claude_code_podman_test_roles ~ '/claude_code_settings/defaults/main.yml') | from_yaml
             | combine(lookup('file', __claude_code_podman_test_roles ~ '/claude_code_skills/defaults/main.yml') | from_yaml) }}
        __claude_code_podman_test_settings: "{{ lookup('file', __claude_code_podman_test_dir ~ '/group_vars/all/' ~ item) | from_yaml }}"
      ansible.builtin.assert:
        that:
          - __claude_code_podman_test_settings | length > 5
          - __claude_code_podman_test_settings is superset(__claude_code_podman_test_settings_defaults)
          - __claude_code_podman_test_settings | dict2items | rejectattr('key', 'in', __claude_code_podman_test_role_defaults) | list == []
          - __claude_code_podman_test_settings == __claude_code_podman_test_role_defaults | dict2items
            | selectattr('key', 'in', __claude_code_podman_test_settings) | items2dict
        quiet: true
        success_msg: "PASSED claude_code_podman: {{ item }} holds {{ __claude_code_podman_test_settings | length }} settings, each at its default."
      loop: [defaults.yml, project.yml]

    - name: Check the playbooks it wrote are valid
      ansible.builtin.command:
        argv: [ansible-playbook, --syntax-check, "{{ __claude_code_podman_test_dir }}/{{ item }}"]
      loop: [image.yml, deploy.yml, build-and-deploy.yml, restart.yml, remove.yml, update-playbooks.yml]
      changed_when: false

    # The image
    - name: Find the image archive
      ansible.builtin.find:
        paths: "{{ __claude_code_podman_test_dir }}/images"
        patterns: claude-code-*.tar
      register: __claude_code_podman_test_archives

    - name: Note the version built
      ansible.builtin.set_fact:
        __claude_code_podman_test_version: >-
          {{ __claude_code_podman_test_archives.files[0].path | basename | regex_replace('^claude-code-(.*)[.]tar$', '\1') }}
      when: __claude_code_podman_test_archives.files | length == 1

    - name: Run the image's Claude Code
      ansible.builtin.command:
        argv: [podman, run, --rm, "localhost/claude-code:{{ __claude_code_podman_test_version | default('none') }}", claude, --version]
      register: __claude_code_podman_test_claude
      changed_when: false
      failed_when: false

    # What the deploy relies on: user 1001 with its home in /opt/claude-code, and
    # the policy read from /etc/claude-code, which is that home's config/. The
    # command module expands $HOME itself, hence printenv. A real image also has
    # its tools, Node.js 24, nvm in login shells, and the base image's
    # /usr/bin/python3, which loop-to-delivery's hook runs with.
    - name: Look up the image's user, home, policy directory and commands
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - localhost/claude-code:{{ __claude_code_podman_test_version | default('none') }}
          - sh
          - -c
          - >-
            id -u; printenv HOME; readlink /etc/claude-code;
            for c in {{ __claude_code_podman_test_commands | join(' ') }}; do command -v "$c" >/dev/null || echo "missing $c"; done;
            {{ "node --version | grep -q '^v24[.]' || echo 'node is not 24';
                bash -lc 'nvm --version' >/dev/null 2>&1 || echo 'no nvm in a login shell';
                test -x /usr/bin/python3 || echo 'no /usr/bin/python3, which runs loop-to-delivery'"
               if claude_code_podman_test_real | bool else ':' }}
      register: __claude_code_podman_test_image
      changed_when: false
      failed_when: false

    # A real image was built with every update its repositories offer (dnf
    # upgrade), the base image's packages included: dnf check-update exits 100
    # when there are updates, 0 when there are none.
    - name: Look up the updates the image's repositories offer
      ansible.builtin.command:
        argv: [podman, run, --rm, --user=0, "localhost/claude-code:{{ __claude_code_podman_test_version | default('none') }}", dnf, --quiet, check-update]
      register: __claude_code_podman_test_updates
      changed_when: false
      failed_when: false
      when: claude_code_podman_test_real | bool

    - name: Check there is one archive, and the image runs Claude Code as the deploy expects
      ansible.builtin.assert:
        that:
          - __claude_code_podman_test_archives.files | length == 1
          - __claude_code_podman_test_version | default('') is match('^[0-9]+[.][0-9]+[.][0-9]+')
          - __claude_code_podman_test_claude.stdout is match(__claude_code_podman_test_version | default('') | regex_escape ~ ' ')
          - __claude_code_podman_test_image.stdout_lines == ['1001', '/opt/claude-code', '/opt/claude-code/config']
          - __claude_code_podman_test_updates.rc | default(0) == 0
        fail_msg: >-
          Archives: {{ __claude_code_podman_test_archives.files | map(attribute='path') | map('basename') | list }};
          claude --version: {{ __claude_code_podman_test_claude.stdout }} {{ __claude_code_podman_test_claude.stderr }};
          user, home, policy and missing commands: {{ __claude_code_podman_test_image.stdout_lines }} {{ __claude_code_podman_test_image.stderr }};
          dnf check-update (rc {{ __claude_code_podman_test_updates.rc | default('skipped') }}):
          {{ __claude_code_podman_test_updates.stdout_lines | default([]) }} {{ __claude_code_podman_test_updates.stderr | default('') }}
        success_msg: >-
          PASSED images/ holds claude-code-{{ __claude_code_podman_test_version }}.tar; its Claude Code says
          "{{ __claude_code_podman_test_claude.stdout }}" and runs as 1001 in /opt/claude-code with
          {{ __claude_code_podman_test_commands | join(', ') }}{{ ', every package up to date' if claude_code_podman_test_real | bool else '' }}.

    # loop-to-delivery's hook runs with the image's /usr/bin/python3 -I (3.9 on
    # UBI 9), so claude_code_skills' whole unit suite runs there too, from
    # read-only mounts (-B: no __pycache__), finding the program through
    # LOOP_TO_DELIVERY_PROGRAM.
    - name: Look up loop-to-delivery's program in claude_code_skills
      ansible.builtin.stat:
        path: "{{ __claude_code_podman_test_program_dir }}/loop_to_delivery.py"
      register: __claude_code_podman_test_program
      when: claude_code_podman_test_real | bool

    - name: Run claude_code_skills' unit tests in the image, with its Python
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - -v
          - "{{ __claude_code_podman_test_suite_dir }}:/suite:ro"
          - -v
          - "{{ __claude_code_podman_test_program_dir }}:/program:ro"
          - -e
          - LOOP_TO_DELIVERY_PROGRAM=/program/loop_to_delivery.py
          - localhost/claude-code:{{ __claude_code_podman_test_version | default('none') }}
          - /usr/bin/python3
          - -I
          - -B
          - -m
          - unittest
          - discover
          - -s
          - /suite
          - -t
          - /suite
      register: __claude_code_podman_test_unit
      changed_when: false
      failed_when: false
      when: claude_code_podman_test_real | bool and __claude_code_podman_test_program.stat.exists

    - name: Check the unit tests passed with the image's Python
      ansible.builtin.assert:
        that:
          - __claude_code_podman_test_program.stat.exists
          - __claude_code_podman_test_unit.rc == 0
        fail_msg: >-
          {{ 'There is no ' ~ __claude_code_podman_test_program_dir ~ '/loop_to_delivery.py.'
             if not __claude_code_podman_test_program.stat.exists
             else (__claude_code_podman_test_unit.stderr_lines | default(['skipped']))[-60:] | join('\n') }}
        success_msg: >-
          PASSED claude_code_skills' unit tests pass in the image with /usr/bin/python3 -I:
          {{ (__claude_code_podman_test_unit.stderr_lines | default(['skipped']))[-3:] | join(' ') }}
      when: claude_code_podman_test_real | bool

    # The update, as a developer would run it: from the project's ansible/ directory,
    # with its ansible.cfg and, since playbooks find the project through it, PWD.
    - name: Change files of the project's and of aslib.infra's, as time would
      ansible.builtin.copy:
        content: "{{ __claude_code_podman_test_change.content }}"
        dest: "{{ claude_code_podman_test_project }}/{{ __claude_code_podman_test_change.file }}"
        mode: preserve
      loop:
        - file: Containerfile
          content: "{{ lookup('file', claude_code_podman_test_project ~ '/Containerfile') }}\nLABEL org.example.test=changed\n"
        # The stand-in takes a version of its own, so a new one replaces the old.
        - file: ansible/group_vars/all/project.yml
          content: |
            podman_service_uid: 3100
            {% if not claude_code_podman_test_real | bool %}
            claude_code_podman_version: "0.0.2"
            claude_code_podman_base_image: {{ claude_code_podman_test_mock_base }}
            {% endif %}
        - { file: ansible/container.env, content: "ANTHROPIC_API_KEY=kept\n" }
        - { file: config/CLAUDE.md, content: "# changed locally\n" }
        - { file: ansible/deploy.yml, content: "# changed locally\n" }
      loop_control:
        loop_var: __claude_code_podman_test_change
        label: "{{ __claude_code_podman_test_change.file }}"

    - name: Run update-playbooks.yml from the project's ansible/ directory
      ansible.builtin.command:
        argv: [ansible-playbook, update-playbooks.yml]
        chdir: "{{ __claude_code_podman_test_dir }}"
      environment:
        ANSIBLE_CONFIG: "{{ __claude_code_podman_test_dir }}/ansible.cfg"
        PWD: "{{ __claude_code_podman_test_dir }}"
      changed_when: false

    - name: Check the update kept the project's files and restored aslib.infra's, keeping each changed one as .bak
      ansible.builtin.assert:
        that:
          - >-
            lookup('file', claude_code_podman_test_project ~ '/Containerfile')
            == lookup('file', __claude_code_podman_test_roles ~ '/claude_code_podman/files/Containerfile')
          - lookup('file', claude_code_podman_test_project ~ '/Containerfile.bak') is search('LABEL org.example.test=changed$')
          - "lookup('file', __claude_code_podman_test_dir ~ '/group_vars/all/project.yml') is match('podman_service_uid: 3100')"
          - lookup('file', __claude_code_podman_test_dir ~ '/container.env') == 'ANTHROPIC_API_KEY=kept'
          - lookup('file', claude_code_podman_test_project ~ '/config/CLAUDE.md') == '# changed locally'
          - "lookup('file', __claude_code_podman_test_dir ~ '/deploy.yml') is search('name: aslib.infra.claude_code_podman')"
          - lookup('file', __claude_code_podman_test_dir ~ '/deploy.yml.bak') == '# changed locally'
          - (__claude_code_podman_test_dir ~ '/image.yml.bak') is not exists
          - (claude_code_podman_test_project ~ '/README.md.bak') is not exists
        success_msg: >-
          PASSED an update kept the project's settings, environment and config/, restored the Containerfile and
          deploy.yml, and kept each local change as .bak.

    # A project that wants its change keeps it from the .bak, as a developer would.
    - name: Take the Containerfile's change back from Containerfile.bak
      ansible.builtin.command:
        argv: [mv, Containerfile.bak, Containerfile]
        chdir: "{{ claude_code_podman_test_project }}"
      changed_when: true

    - name: Run image.yml from the project's ansible/ directory
      ansible.builtin.command:
        argv: [ansible-playbook, image.yml]
        chdir: "{{ __claude_code_podman_test_dir }}"
      environment:
        ANSIBLE_CONFIG: "{{ __claude_code_podman_test_dir }}/ansible.cfg"
        PWD: "{{ __claude_code_podman_test_dir }}"
      changed_when: false

    - name: Find the image archive after the rebuild
      ansible.builtin.find:
        paths: "{{ __claude_code_podman_test_dir }}/images"
        patterns: claude-code-*.tar
      register: __claude_code_podman_test_rebuilt

    - name: Look up the project's images on this machine
      ansible.builtin.command:
        argv: [podman, images, --quiet, --no-trunc, --filter=label=org.opencontainers.image.title=claude-code]
      register: __claude_code_podman_test_images
      changed_when: false

    - name: Inspect the rebuilt image
      ansible.builtin.command:
        argv: [podman, image, inspect, "{{ __claude_code_podman_test_images.stdout_lines[0] | default('none') }}"]
      register: __claude_code_podman_test_inspect
      changed_when: false
      failed_when: false

    - name: Check the rebuild left one archive and one image, with the project's change
      vars:
        __claude_code_podman_test_new_version: "{{ __claude_code_podman_test_version if claude_code_podman_test_real | bool else '0.0.2' }}"
      ansible.builtin.assert:
        that:
          - __claude_code_podman_test_rebuilt.files | map(attribute='path') | map('basename') | list
            == ['claude-code-' ~ __claude_code_podman_test_new_version ~ '.tar']
          - __claude_code_podman_test_images.stdout_lines | unique | length == 1
          - (__claude_code_podman_test_inspect.stdout | from_json)[0].Labels['org.example.test'] == 'changed'
          - (__claude_code_podman_test_inspect.stdout | from_json)[0].Labels['org.opencontainers.image.version'] == __claude_code_podman_test_new_version
        fail_msg: >-
          Archives: {{ __claude_code_podman_test_rebuilt.files | map(attribute='path') | map('basename') | list }};
          images: {{ __claude_code_podman_test_images.stdout_lines }}
        success_msg: >-
          PASSED image.yml, run from the project, rebuilt the changed Containerfile into
          claude-code-{{ __claude_code_podman_test_new_version }}.tar and left no older image of the project behind.

    # After 0.8.0 claude_code_settings_qa was renamed; a 0.8.0 setup wrote it into both
    # settings files: the update passes and rewrites defaults.yml; a build stops
    # while project.yml still has the old name, naming both steps in order.
    - name: Put the old name into both settings files, as a 0.8.0 project has it
      ansible.builtin.lineinfile:
        path: "{{ __claude_code_podman_test_dir }}/group_vars/all/{{ item }}"
        line: "claude_code_settings_qa: false"
      loop: [defaults.yml, project.yml]

    - name: Run update-playbooks.yml with the old name in both settings files
      ansible.builtin.command:
        argv: [ansible-playbook, update-playbooks.yml]
        chdir: "{{ __claude_code_podman_test_dir }}"
      environment:
        ANSIBLE_CONFIG: "{{ __claude_code_podman_test_dir }}/ansible.cfg"
        PWD: "{{ __claude_code_podman_test_dir }}"
      register: __claude_code_podman_test_old_update
      changed_when: false
      failed_when: false

    - name: Check the update passed and rewrote defaults.yml without the old name
      vars:
        __claude_code_podman_test_defaults: "{{ lookup('file', __claude_code_podman_test_dir ~ '/group_vars/all/defaults.yml') }}"
      ansible.builtin.assert:
        that:
          - __claude_code_podman_test_old_update.rc == 0
          - __claude_code_podman_test_defaults is not search('^claude_code_settings_qa:', multiline=True)
          - (__claude_code_podman_test_defaults | from_yaml).claude_code_skills_qa is false
          - >-
            lookup('file', __claude_code_podman_test_dir ~ '/group_vars/all/project.yml')
            is search('^claude_code_settings_qa: false$', multiline=True)
        fail_msg: >-
          rc {{ __claude_code_podman_test_old_update.rc }}: {{ __claude_code_podman_test_old_update.stdout_lines[-15:] }};
          defaults.yml: {{ __claude_code_podman_test_defaults }}
        success_msg: >-
          PASSED update-playbooks.yml runs despite claude_code_settings_qa and rewrites defaults.yml without it,
          leaving project.yml, the project's own, as it was.

    - name: Run image.yml with the old name still in project.yml
      ansible.builtin.command:
        argv: [ansible-playbook, image.yml]
        chdir: "{{ __claude_code_podman_test_dir }}"
      environment:
        ANSIBLE_CONFIG: "{{ __claude_code_podman_test_dir }}/ansible.cfg"
        PWD: "{{ __claude_code_podman_test_dir }}"
      register: __claude_code_podman_test_old_build
      changed_when: false
      failed_when: false

    - name: Find the image archive after the stopped build
      ansible.builtin.find:
        paths: "{{ __claude_code_podman_test_dir }}/images"
        patterns: claude-code-*.tar
      register: __claude_code_podman_test_after_stop

    - name: Check the build stopped before building, with the message that names both steps in order
      vars:
        __claude_code_podman_test_rename_message: >-
          claude_code_settings_qa is set, which is now claude_code_skills_qa (the qa skill moved to
          aslib.infra.claude_code_skills after 0.8.0). First run update-playbooks.yml, which rewrites
          ansible/group_vars/all/defaults.yml without it; then rename the line in ansible/group_vars/all/project.yml to
          claude_code_skills_qa, or delete it, and likewise wherever else you set it (the inventory or -e). The
          CHANGELOG's notes on upgrading from 0.8.0 say more.
      ansible.builtin.assert:
        that:
          - __claude_code_podman_test_old_build.rc != 0
          - __claude_code_podman_test_rename_message in __claude_code_podman_test_old_build.stdout
          - __claude_code_podman_test_after_stop.files | map(attribute='path') | sort
            == __claude_code_podman_test_rebuilt.files | map(attribute='path') | sort
          - __claude_code_podman_test_after_stop.files | map(attribute='mtime') | sort
            == __claude_code_podman_test_rebuilt.files | map(attribute='mtime') | sort
        fail_msg: >-
          rc {{ __claude_code_podman_test_old_build.rc }}: {{ __claude_code_podman_test_old_build.stdout_lines[-15:] }}
        success_msg: >-
          PASSED image.yml stops before building while project.yml has claude_code_settings_qa, naming
          claude_code_skills_qa, update-playbooks.yml first and then the line in project.yml.

    - name: Rename the line in project.yml, as the message says
      ansible.builtin.lineinfile:
        path: "{{ __claude_code_podman_test_dir }}/group_vars/all/project.yml"
        regexp: "^claude_code_settings_qa:"
        line: "claude_code_skills_qa: false"

- name: Check the family's index names the role to run, instead of running nothing
  hosts: localhost
  gather_facts: false
  tasks:
    # A project's deploy.yml from before 0.7.0 imports aslib.infra.claude_code.
    - name: Run the index, as such a deploy.yml does
      block:
        - name: Run aslib.infra.claude_code
          ansible.builtin.include_role:
            name: aslib.infra.claude_code

        - name: Fail, as the index ran without stopping
          ansible.builtin.fail:
            msg: aslib.infra.claude_code ran without stopping.
      rescue:
        - name: Check it stopped, naming the container's role and how to bring a project up to date
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Name the Claude Code role to run instead'
              - ansible_failed_result.msg is search('aslib[.]infra[.]claude_code_podman[^_]')
              - ansible_failed_result.msg is search('ansible-playbook aslib[.]infra[.]claude_code_podman_setup')
            fail_msg: "{{ ansible_failed_result.msg | default(ansible_failed_result) }}"
            success_msg: PASSED claude_code, the index, stops and names claude_code_podman and how to update a project.
