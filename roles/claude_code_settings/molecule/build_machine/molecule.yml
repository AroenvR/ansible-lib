---
# Checks what claude_code_settings hands its targets: its facts, with its
# defaults (no files for the managed settings directory, qa-budget's folder as
# absent) and with every setting changed, that a value outside the choices
# stops the run, naming the setting, and with qa-budget on its status line, its
# ledger and its guard. Nothing to set up: the role only computes, where
# Ansible runs.
scenario:
  name: build_machine
driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      # The tested ansible-core's own Python, see node_image's build_machine scenario.
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
platforms:
  - name: localhost
