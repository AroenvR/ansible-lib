---
# Checks what claude_code_settings hands its targets, with its defaults and with
# every setting changed, the qa skill's files off and on (their frontmatter and
# what the synchronous design removed), and that a value outside the choices,
# or the qa skill with agent teams, stops the run, naming the setting. Nothing
# to set up: the role only computes, where Ansible runs.
scenario:
  name: build_machine
driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      # The tested ansible-core's own Python, see node_image's build_machine scenario.
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
platforms:
  - name: localhost
