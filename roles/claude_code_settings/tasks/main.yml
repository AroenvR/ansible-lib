---
# Entry point "main": computes what every target installs, as facts for the role
# that includes this one. Changes nothing.
- name: Check the qa skill and agent teams are not both on
  ansible.builtin.assert:
    that: not (claude_code_settings_qa | bool and claude_code_settings_agent_teams | bool)
    fail_msg: >-
      claude_code_settings_qa needs claude_code_settings_agent_teams off: the qa skill runs its experts as
      subagents, one at a time, and with agent teams on, Claude Code starts a subagent that Claude names as a
      teammate instead. Turn one of them off.
    quiet: true

- name: Note Claude Code's settings for the target
  vars:
    __claude_code_settings_names: "{{ __claude_code_settings_qa_files if claude_code_settings_qa | bool else [] }}"
    __claude_code_settings_sources: >-
      {{ [role_path ~ '/files/'] | product(__claude_code_settings_names | map('regex_replace', '^[.]claude/', ''))
         | map('join') | list }}
  ansible.builtin.set_fact:
    # The base of the policy, with the settings' values (reading it also checks it is JSON).
    claude_code_settings_policy: "{{ lookup('ansible.builtin.template', 'managed-settings.json.j2', convert_data=false) | from_json }}"
    # Claude Code checks whether it trusts a folder before it applies a policy's
    # env, so this one must be in the environment of the claude process itself.
    # In the container and the VM, the target itself is the boundary that the
    # trust dialog guards elsewhere, for every folder, git repositories included.
    claude_code_settings_environment:
      CLAUDE_CODE_SANDBOXED: "1"
    # Claude Code's own file, ~/.claude.json (or .claude.json in CLAUDE_CONFIG_DIR):
    # with this, its first start skips the setup it asks for once (the theme, the
    # sign-in), as the policy and the token already answer it.
    claude_code_settings_global_config:
      hasCompletedOnboarding: true
    # The files of the features that are on, for the managed settings directory:
    # its path there (name) and the file on the Ansible machine (src).
    claude_code_settings_files: >-
      {{ dict(__claude_code_settings_names | zip(__claude_code_settings_sources))
         | dict2items(key_name='name', value_name='src') }}
    # What the features that are off would have put there, for a target to
    # remove where an earlier run installed it: a skill's folder, an agent's file.
    claude_code_settings_absent: >-
      {{ [] if claude_code_settings_qa | bool
         else __claude_code_settings_qa_files | select('match', '[.]claude/skills/') | map('dirname') | unique | list
              + __claude_code_settings_qa_files | reject('match', '[.]claude/skills/') | list }}
