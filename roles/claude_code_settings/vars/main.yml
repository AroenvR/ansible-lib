---
# What claude_code_settings ships for Claude Code's managed settings directory
# (/etc/claude-code on Linux), as paths there: each comes from files/ with
# .claude/ left out. A skill is its folder, an agent its file.
__claude_code_settings_qa_files:
  - .claude/skills/qa/SKILL.md
  - .claude/skills/qa/protocol.md
  - .claude/agents/architect.md
  - .claude/agents/tester.md
  - .claude/agents/reviewer.md
  - .claude/agents/developer.md
  - .claude/agents/documenter.md
# qa-budget's status line, token ledger, guard and its rules for agents, in
# /etc/claude-code/qa-budget/.
__claude_code_settings_qa_budget_files:
  - qa-budget/statusline.py
  - qa-budget/ledger.py
  - qa-budget/guard.py
  - qa-budget/budget.md
