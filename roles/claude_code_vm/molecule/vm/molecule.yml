---
# Creates claude-dev on this machine, which needs KVM, and checks it as a person
# would use it: logged in as claude with sudo, with Podman, Python 3.11 and Claude
# Code, reaching the internet but neither a machine on the local network (a
# stand-in in a network namespace) nor the host's own services, except the one
# port and name it is given (as for GitLab on the host). Also checks the host's
# settings file, Claude's token in the VM, that Claude Code starts there ready
# to work, that it finds the qa skill and its experts, and loop-to-delivery
# (whose hook runs, and asks qa-budget's guard), that a scheduled job runs in
# the VM as claude, its timer back after a reset, that a run adjusts the VM's
# memory and vCPUs and restarts it when it must, never forcing it off, and that
# the old name of the qa option stops a run. Not part of `make test`:
# run it with `sudo make test-vm-2.16` on a machine with KVM (claude_code_vm needs
# ansible-core 2.16); CI runs it on GitHub's runners, which have KVM.
scenario:
  name: vm
  test_sequence: [cleanup, syntax, prepare, converge, idempotence, verify, cleanup]
driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: localhost
provisioner:
  name: ansible
  inventory:
    host_vars:
      localhost:
        claude_code_vm_host_ports: [9997]
        claude_code_vm_host_names: [host-service.home.arpa]
        # A stand-in for the token of claude setup-token, which no output may show.
        claude_code_vm_oauth_token: sk-ant-oat01-aslib-test-stand-in-0123456789abcdef
        # On, so that the idempotence step covers its files too. The loop needs
        # qa-budget (its guard keeps the loop's wake-ups inside the budget), and
        # its maximums differ from the defaults (5 and 24), which the hook must enforce.
        claude_code_skills_qa: true
        claude_code_settings_qa_budget: true
        claude_code_skills_loop_to_delivery: true
        claude_code_skills_loop_to_delivery_max_wakes: 7
        claude_code_skills_loop_to_delivery_max_hours: 48
        # A scheduled job, which notes in /tmp who ran it and prints a line.
        claude_code_vm_jobs:
          - name: test-job
            command: "sh -c 'id -un > /tmp/test-job.ran; echo test-job ran'"
            schedule: hourly
