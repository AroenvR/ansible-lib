---
# Entry point "main": on a Linux host with KVM, creates claude-dev, a VM from
# Ubuntu's cloud image on a network of its own, which reaches the internet but
# not the local network, and lets the account claude in with a key of the machine
# that runs the playbook. Then makes the VM reachable as the host claude-dev for
# the entry point "guest" (playbooks/claude_code_vm.yml runs both). Running it again
# changes nothing; a VM that is shut off is started.
# The host and the VM run Ubuntu 24.04, whose Python (3.12) ansible-core 2.14
# does not support on managed machines (its get_url fails there over HTTPS).
- name: Check the ansible-core version
  ansible.builtin.assert:
    that: ansible_version.full is version('2.16', '>=')
    fail_msg: >-
      claude_code_vm needs ansible-core 2.16 or newer (Ubuntu 24.04's), as its host and VM run Ubuntu 24.04 with Python
      3.12; this is {{ ansible_version.full }}.
    quiet: true

# Before 0.7.0 this role was claude_vm, and its settings claude_vm_*.
- name: Stop at settings of before 0.7.0, which have new names
  vars:
    __claude_code_vm_old: "{{ query('ansible.builtin.varnames', '^claude_vm_') | sort }}"
  ansible.builtin.assert:
    that: __claude_code_vm_old | length == 0
    fail_msg: >-
      Settings of before 0.7.0 are set, which are now named claude_code_vm_* instead of claude_vm_*:
      {{ __claude_code_vm_old | join(', ') }}. Rename them where they are set (the inventory or -e).
    quiet: true

# 0.9.0 moved the qa skill to claude_code_skills; settings.yml checks the
# settings file for the old name.
- name: Stop at claude_code_settings_qa, which is now claude_code_skills_qa
  ansible.builtin.assert:
    that: query('ansible.builtin.varnames', '^claude_code_settings_qa$') | length == 0
    fail_msg: >-
      claude_code_settings_qa is now claude_code_skills_qa (the qa skill moved to aslib.infra.claude_code_skills in
      0.9.0): rename it where it is set (the inventory or -e).
    quiet: true

# First: every value below may come from it.
- name: Read the settings file, /etc/claude-vm/settings.yml, or write it
  ansible.builtin.import_tasks: settings.yml

- name: Look up the host's OS and architecture
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", distribution, platform]

- name: Look up KVM
  ansible.builtin.stat:
    path: /dev/kvm
  register: __claude_code_vm_kvm

- name: Check the host can run the VM
  ansible.builtin.assert:
    that:
      - __claude_code_vm_kvm.stat.exists
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version is version('24.04', '>=')
      - ansible_facts.architecture in __claude_code_vm_host_packages
    fail_msg: >-
      {{ inventory_hostname }} needs Ubuntu 24.04 or newer on x86_64 or ARM64 (aarch64), with KVM (/dev/kvm):
      virtualization enabled in the firmware, or nested virtualization when the host is a VM itself. It has
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} on {{ ansible_facts.architecture
      }}{{ '' if __claude_code_vm_kvm.stat.exists else ', without KVM' }}.
    quiet: true

# QEMU reserves all of the VM's memory when it starts; past what the host has,
# it fails with "cannot set up guest memory".
- name: Look up the host's memory
  ansible.builtin.slurp:
    src: /proc/meminfo
  register: __claude_code_vm_meminfo

- name: Check the VM's memory fits in the host's, with 1 GiB left for the host
  vars:
    __claude_code_vm_host_mib: >-
      {{ (((__claude_code_vm_meminfo.content | b64decode).splitlines() | select('match', 'MemTotal:') | first).split()[1] | int / 1024) | int }}
    __claude_code_vm_fits_mib: "{{ [((__claude_code_vm_host_mib | int - 1024) / 256) | int * 256, 0] | max }}"
  ansible.builtin.assert:
    that: claude_code_vm_memory | int <= __claude_code_vm_fits_mib | int
    fail_msg: >-
      The VM's memory, claude_code_vm_memory {{ claude_code_vm_memory }} MiB, does not fit in this host's {{ __claude_code_vm_host_mib }} MiB
      with 1 GiB left for the host itself. Give it at most {{ __claude_code_vm_fits_mib }}: -e claude_code_vm_memory={{ __claude_code_vm_fits_mib }}
      (2048 or more for aslib.infra's tests).
    quiet: true

- name: Look up the installed packages
  ansible.builtin.package_facts:

- name: Install QEMU/KVM, libvirt, virt-install, xorriso and nftables where missing
  ansible.builtin.package:
    name: "{{ __claude_code_vm_missing }}"
    state: present
  vars:
    __claude_code_vm_missing: >-
      {{ __claude_code_vm_host_packages[ansible_facts.architecture] | difference(ansible_facts.packages.keys()) }}
  when: __claude_code_vm_missing | length > 0

- name: Start libvirt, now and at every boot
  ansible.builtin.systemd:
    name: libvirtd.service
    state: started
    enabled: true

# On the machine that runs the playbook, as the person running it.
- name: Create ~/.ssh for the key that logs in to the VM
  ansible.builtin.file:
    path: "{{ __claude_code_vm_key | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Create the key that logs in to the VM, ~/.ssh/{{ __claude_code_vm_name }}
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "{{ __claude_code_vm_name }}", -f, "{{ __claude_code_vm_key }}"]
    creates: "{{ __claude_code_vm_key }}"
  delegate_to: localhost
  become: false
  run_once: true

# The rules go live before the VM's network exists, so the VM never runs without
# them. The settings file created their directory.
- name: Write the rules that keep the VM away from the local network
  ansible.builtin.template:
    src: firewall.nft.j2
    dest: "{{ __claude_code_vm_config_dir }}/firewall.nft"
    owner: root
    group: root
    mode: "0600"
  register: __claude_code_vm_rules

- name: Write the service that loads them, also at boot before libvirt
  ansible.builtin.template:
    src: claude-vm-firewall.service.j2
    dest: /etc/systemd/system/claude-vm-firewall.service
    owner: root
    group: root
    mode: "0644"
  register: __claude_code_vm_unit

- name: Load the rules, now and at every boot
  ansible.builtin.systemd:
    name: claude-vm-firewall.service
    state: "{{ 'restarted' if __claude_code_vm_rules is changed or __claude_code_vm_unit is changed else 'started' }}"
    enabled: true
    daemon_reload: "{{ __claude_code_vm_unit is changed }}"

- name: Look up the VM's network
  ansible.builtin.command:
    argv: "{{ __claude_code_vm_virsh + ['net-info', __claude_code_vm_network] }}"
  register: __claude_code_vm_net
  changed_when: false
  failed_when: false

- name: Define the VM's network
  when: __claude_code_vm_net.rc != 0
  block:
    - name: Write the VM's network
      ansible.builtin.template:
        src: network.xml.j2
        dest: "{{ __claude_code_vm_config_dir }}/network.xml"
        owner: root
        group: root
        mode: "0600"

    - name: Define the VM's network in libvirt
      ansible.builtin.command:
        argv: "{{ __claude_code_vm_virsh + ['net-define', __claude_code_vm_config_dir ~ '/network.xml'] }}"
      changed_when: true

- name: Start the VM's network, now and at every boot
  ansible.builtin.command:
    argv: "{{ __claude_code_vm_virsh + [__claude_code_vm_net_step.command, __claude_code_vm_network] }}"
  loop:
    - { command: net-autostart, done: "Autostart: +yes" }
    - { command: net-start, done: "Active: +yes" }
  loop_control:
    loop_var: __claude_code_vm_net_step
    label: "{{ __claude_code_vm_net_step.command }}"
  when: __claude_code_vm_net.stdout is not search(__claude_code_vm_net_step.done, multiline=True)
  changed_when: true

# Downloaded once: the VM's disk is built on top of it, so it never changes. For a
# newer one, remove the VM, delete this file and run the playbook again.
- name: Look up Ubuntu's cloud image
  ansible.builtin.stat:
    path: "{{ __claude_code_vm_base }}"
  register: __claude_code_vm_base_file

- name: Download Ubuntu's cloud image, checked against its published checksums
  ansible.builtin.get_url:
    url: "{{ __claude_code_vm_image_url }}"
    dest: "{{ __claude_code_vm_base }}"
    checksum: "{{ claude_code_vm_image_checksum }}"
    owner: root
    group: root
    mode: "0644"
  when: not __claude_code_vm_base_file.stat.exists

- name: Look up the VM
  ansible.builtin.command:
    argv: "{{ __claude_code_vm_virsh + ['domstate', __claude_code_vm_name] }}"
  register: __claude_code_vm_state
  changed_when: false
  failed_when: false

- name: Create the VM
  when: __claude_code_vm_state.rc != 0
  block:
    - name: Create the VM's disk, on top of the cloud image
      ansible.builtin.command:
        argv: [qemu-img, create, -q, -f, qcow2, -F, qcow2, -b, "{{ __claude_code_vm_base }}", "{{ __claude_code_vm_disk }}", "{{ claude_code_vm_disk_size }}"]
        creates: "{{ __claude_code_vm_disk }}"

    - name: Write what cloud-init sets up at the VM's first boot
      ansible.builtin.template:
        src: "{{ __claude_code_vm_seed }}.j2"
        dest: "{{ __claude_code_vm_config_dir }}/{{ __claude_code_vm_seed }}"
        owner: root
        group: root
        mode: "0600"
      loop: [user-data, meta-data]
      loop_control:
        loop_var: __claude_code_vm_seed

    # Not virt-install's --cloud-init: that runs the first boot with on_reboot=destroy
    # and drops the seed afterwards, so a reboot then (UEFI's first boot, on ARM64)
    # leaves the VM shut off without its account. This CD stays attached; cloud-init
    # reads it once, at the first boot that reaches Linux.
    - name: Put it on the CD cloud-init reads it from, labelled cidata
      ansible.builtin.command:
        argv:
          - xorriso
          - -as
          - mkisofs
          - -quiet
          - -output
          - "{{ __claude_code_vm_seed_iso }}"
          - -volid
          - cidata
          - -joliet
          - -rock
          - "{{ __claude_code_vm_config_dir }}/user-data"
          - "{{ __claude_code_vm_config_dir }}/meta-data"
      changed_when: true

    - name: Create and start the VM
      ansible.builtin.command:
        argv:
          - virt-install
          - --connect=qemu:///system
          - --name={{ __claude_code_vm_name }}
          - --memory={{ claude_code_vm_memory }}
          - --vcpus={{ claude_code_vm_vcpus }}
          - --virt-type=kvm
          - --import
          - --disk=path={{ __claude_code_vm_disk }},format=qcow2,bus=virtio
          - --network=network={{ __claude_code_vm_network }},model=virtio,mac={{ __claude_code_vm_mac }}
          - --osinfo=ubuntu24.04
          - --disk=path={{ __claude_code_vm_seed_iso }},device=cdrom
          # cloud-init looks for its data very early in the boot, before an ARM64
          # VM's CD may show up; this tells it the data is there (as virt-install's
          # --cloud-init does).
          - --sysinfo=system.serial=ds=nocloud
          - --boot={{ __claude_code_vm_boot[ansible_facts.architecture] }}
          - --graphics=none
          - --noautoconsole
      changed_when: true

    - name: Start the VM at every boot
      ansible.builtin.command:
        argv: "{{ __claude_code_vm_virsh + ['autostart', __claude_code_vm_name] }}"
      changed_when: true
  rescue:
    # virt-install leaves a VM that would not start defined, with the settings it
    # failed with; the next run would only start it again.
    - name: Remove the VM that did not start, so that the next run creates it again
      ansible.builtin.command:
        argv: "{{ __claude_code_vm_virsh + ['undefine', '--nvram', __claude_code_vm_name] }}"
      changed_when: true
      failed_when: false

    - name: Stop, as the VM did not start
      ansible.builtin.fail:
        msg: >-
          The VM did not start, and is removed again - {{ (ansible_failed_result.stderr_lines | default([]) | select('search', 'ERROR') | list
          + ansible_failed_result.stderr_lines | default([]) + [ansible_failed_result.msg | default('')]) | select | first }} -
          change what it names (claude_code_vm_memory, claude_code_vm_vcpus) and run the playbook again.

# claude_code_vm_memory and claude_code_vm_vcpus apply to a VM that exists too:
# its definition for the next start takes them while the VM is shut off, and the
# start below applies them. A VM that does not shut down is never forced off.
- name: Look up the VM's memory and vCPUs for its next start
  ansible.builtin.command:
    argv: "{{ __claude_code_vm_virsh + ['dumpxml', '--inactive', __claude_code_vm_name] }}"
  register: __claude_code_vm_definition
  changed_when: false
  when: __claude_code_vm_state.rc == 0

- name: Note them, the VM's state, and whether the settings change them
  vars:
    __claude_code_vm_xml: "{{ __claude_code_vm_definition.stdout }}"
    __claude_code_vm_vcpus_now: "{{ __claude_code_vm_xml | regex_findall(__claude_code_vm_xml_patterns.vcpus) | first | default('') }}"
  ansible.builtin.set_fact:
    __claude_code_vm_had:
      state: "{{ __claude_code_vm_state.stdout | trim }}"
      memory_kib: "{{ __claude_code_vm_xml | regex_findall(__claude_code_vm_xml_patterns.memory) | first | default('') }}"
      current_memory_kib: >-
        {{ __claude_code_vm_xml | regex_findall(__claude_code_vm_xml_patterns.current_memory) | first | default('') }}
      vcpus: "{{ __claude_code_vm_vcpus_now }}"
      current_vcpus: >-
        {{ __claude_code_vm_xml | regex_findall(__claude_code_vm_xml_patterns.current_vcpus) | first
           | default(__claude_code_vm_vcpus_now) }}
  when: __claude_code_vm_state.rc == 0

- name: Check the VM's definition gives its memory in KiB and its vCPUs
  ansible.builtin.assert:
    that:
      - __claude_code_vm_had.memory_kib | string | length > 0
      - __claude_code_vm_had.current_memory_kib | string | length > 0
      - __claude_code_vm_had.vcpus | string | length > 0
    fail_msg: >-
      virsh dumpxml --inactive {{ __claude_code_vm_name }} gives no memory in KiB or no vCPUs, so the run cannot
      compare them with claude_code_vm_memory and claude_code_vm_vcpus; nothing was changed. Look at it with
      ansible-playbook aslib.infra.claude_code_vm_overview.
    quiet: true
  when: __claude_code_vm_state.rc == 0

- name: Note whether the settings change the VM's memory or vCPUs
  ansible.builtin.set_fact:
    __claude_code_vm_resize: >-
      {{ __claude_code_vm_state.rc == 0
         and ([__claude_code_vm_had.memory_kib, __claude_code_vm_had.current_memory_kib] | map('int') | list
              != [claude_code_vm_memory | int * 1024] * 2
              or [__claude_code_vm_had.vcpus, __claude_code_vm_had.current_vcpus] | map('int') | list
              != [claude_code_vm_vcpus | int] * 2) }}

- name: Stop, as the VM is neither running nor shut off
  ansible.builtin.fail:
    msg: >-
      {{ __claude_code_vm_name }} is {{ __claude_code_vm_had.state }}, so its new memory and vCPUs cannot be given to
      it; nothing was changed. Start it (virsh start) or shut it down from inside (sudo poweroff), then run the
      playbook again.
  when: __claude_code_vm_resize | bool and __claude_code_vm_had.state not in ['running', 'shut off']

- name: Shut down the VM, so that it starts with its new memory and vCPUs
  when: __claude_code_vm_resize | bool and __claude_code_vm_had.state == 'running'
  block:
    - name: Ask the VM to shut down, as its power button would
      ansible.builtin.command:
        argv: "{{ __claude_code_vm_virsh + ['shutdown', __claude_code_vm_name] }}"
      changed_when: true

    - name: Wait until the VM is shut off
      ansible.builtin.command:
        argv: "{{ __claude_code_vm_virsh + ['domstate', __claude_code_vm_name] }}"
      register: __claude_code_vm_stopping
      changed_when: false
      until: __claude_code_vm_stopping.stdout is search('shut off')
      retries: "{{ (__claude_code_vm_shutdown_timeout | int / 5) | round(0, 'ceil') | int }}"
      delay: 5
  rescue:
    - name: Stop, as the VM did not shut down
      ansible.builtin.fail:
        msg: >-
          {{ __claude_code_vm_name }} did not shut down within {{ __claude_code_vm_shutdown_timeout | int }} seconds,
          so it is still running with its old memory and vCPUs ({{ __claude_code_vm_had.current_memory_kib | int // 1024 }}
          MiB, {{ __claude_code_vm_had.current_vcpus }} vCPUs); nothing was changed. Shut it down from inside (sudo
          poweroff), or end what keeps it busy, then run the playbook again. It is never forced off.

# Current never above the maximum: growing sets the maximum first, shrinking last.
- name: Give the VM its new memory and vCPUs, for its next start
  vars:
    __claude_code_vm_kib: "{{ claude_code_vm_memory | int * 1024 }}"
    __claude_code_vm_memory_steps:
      - [setmaxmem, "{{ __claude_code_vm_name }}", "{{ __claude_code_vm_kib }}", --config]
      - [setmem, "{{ __claude_code_vm_name }}", "{{ __claude_code_vm_kib }}", --config]
    __claude_code_vm_vcpu_steps:
      - [setvcpus, "{{ __claude_code_vm_name }}", "{{ claude_code_vm_vcpus | int }}", --maximum, --config]
      - [setvcpus, "{{ __claude_code_vm_name }}", "{{ claude_code_vm_vcpus | int }}", --config]
  ansible.builtin.command:
    argv: "{{ __claude_code_vm_virsh + __claude_code_vm_step }}"
  loop: >-
    {{ (__claude_code_vm_memory_steps if __claude_code_vm_kib | int >= __claude_code_vm_had.memory_kib | int
        else __claude_code_vm_memory_steps | reverse | list)
       + (__claude_code_vm_vcpu_steps if claude_code_vm_vcpus | int >= __claude_code_vm_had.vcpus | int
          else __claude_code_vm_vcpu_steps | reverse | list) }}
  loop_control:
    loop_var: __claude_code_vm_step
    label: "{{ __claude_code_vm_step | join(' ') }}"
  changed_when: true
  when: __claude_code_vm_resize | bool

# Every run: the state may have changed since the first lookup.
- name: Look up the VM's state again
  ansible.builtin.command:
    argv: "{{ __claude_code_vm_virsh + ['domstate', __claude_code_vm_name] }}"
  register: __claude_code_vm_state_now
  changed_when: false

- name: Start the VM, which is shut off
  when: __claude_code_vm_state_now.stdout is search('shut off')
  block:
    - name: Start the VM
      ansible.builtin.command:
        argv: "{{ __claude_code_vm_virsh + ['start', __claude_code_vm_name] }}"
      changed_when: true
  rescue:
    - name: Stop, as the VM did not start
      ansible.builtin.fail:
        msg: >-
          {{ __claude_code_vm_name }} did not start - {{ (ansible_failed_result.stderr_lines | default([])
          + [ansible_failed_result.msg | default('')]) | select | first }} - with claude_code_vm_memory {{
          claude_code_vm_memory }} MiB and claude_code_vm_vcpus {{ claude_code_vm_vcpus }}: the host may have less
          free memory than that. Lower them in {{ __claude_code_vm_settings_file }} and run the playbook again.

- name: Wait until the VM answers on SSH
  ansible.builtin.wait_for:
    host: "{{ __claude_code_vm_ip }}"
    port: 22
    timeout: 600

# The VM's own settings come along, so that the inventory and the settings file
# can set them for the host; the token among them, hence no_log.
- name: Reach the VM for its setup, as the host {{ __claude_code_vm_name }}
  no_log: true
  ansible.builtin.add_host:
    name: "{{ __claude_code_vm_name }}"
    groups: [claude_code_vm]
    ansible_host: "{{ __claude_code_vm_ip }}"
    ansible_user: claude
    ansible_ssh_private_key_file: "{{ __claude_code_vm_key }}"
    ansible_ssh_common_args: "{{ __claude_code_vm_ssh_args }}"
    claude_code_vm_authorized_keys: "{{ claude_code_vm_authorized_keys }}"
    claude_code_vm_host_names: "{{ claude_code_vm_host_names }}"
    claude_code_vm_network_prefix: "{{ claude_code_vm_network_prefix }}"
    claude_code_vm_python_repository: "{{ claude_code_vm_python_repository }}"
    claude_code_vm_python_key_url: "{{ claude_code_vm_python_key_url }}"
    claude_code_vm_claude_code_repository: "{{ claude_code_vm_claude_code_repository }}"
    claude_code_vm_claude_code_key_url: "{{ claude_code_vm_claude_code_key_url }}"
    claude_code_vm_oauth_token: "{{ claude_code_vm_oauth_token }}"
    claude_code_settings_permission_mode: "{{ claude_code_settings_permission_mode }}"
    claude_code_settings_model: "{{ claude_code_settings_model }}"
    claude_code_settings_effort: "{{ claude_code_settings_effort }}"
    claude_code_settings_theme: "{{ claude_code_settings_theme }}"
    claude_code_settings_agent_teams: "{{ claude_code_settings_agent_teams }}"
    claude_code_settings_ultracode: "{{ claude_code_settings_ultracode }}"
    claude_code_skills_qa: "{{ claude_code_skills_qa }}"
    claude_code_skills_loop_to_delivery: "{{ claude_code_skills_loop_to_delivery }}"
    claude_code_skills_loop_to_delivery_max_wakes: "{{ claude_code_skills_loop_to_delivery_max_wakes }}"
  changed_when: false
