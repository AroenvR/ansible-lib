---
# Shared by the entry points overview and boot_trial; only looks things up. Sets
# __claude_code_vm_description, report lines on what the VM is made of, and
# __claude_code_vm_console, the lines of its console log without terminal codes.
- name: Look up the VM's state, definition and disks, and its network's DHCP leases
  ansible.builtin.command:
    argv: "{{ __claude_code_vm_virsh + __claude_code_vm_describe_command }}"
  loop:
    - [domstate, --reason, "{{ __claude_code_vm_name }}"]
    - [dumpxml, --inactive, "{{ __claude_code_vm_name }}"]
    - [domblklist, --details, "{{ __claude_code_vm_name }}"]
    - [net-dhcp-leases, "{{ __claude_code_vm_network }}"]
  loop_control:
    loop_var: __claude_code_vm_describe_command
    label: "{{ __claude_code_vm_describe_command[0] }}"
  register: __claude_code_vm_describe
  changed_when: false
  failed_when: false

- name: Look up the VM's cloud-init CD
  ansible.builtin.stat:
    path: "{{ __claude_code_vm_seed_iso }}"
  register: __claude_code_vm_describe_seed

- name: Read the VM's console log and libvirt's log of it
  ansible.builtin.slurp:
    src: "{{ __claude_code_vm_describe_log }}"
  loop:
    - "{{ __claude_code_vm_console_log }}"
    - /var/log/libvirt/qemu/{{ __claude_code_vm_name }}.log
  loop_control:
    loop_var: __claude_code_vm_describe_log
  register: __claude_code_vm_describe_logs
  failed_when: false

# The console log holds what the firmware and Linux print, terminal codes
# included. virsh prints tables under a header of two lines.
- name: Describe the VM
  vars:
    __claude_code_vm_xml: "{{ __claude_code_vm_describe.results[1].stdout }}"
    __claude_code_vm_feature: "<feature enabled='yes' name='%s'/>"
    __claude_code_vm_firmware: >-
      {{ ('%s (Secure Boot %s, Microsoft keys %s), variables from %s' | format(
            __claude_code_vm_xml | regex_search('<loader[^>]*>([^<]*)<', '\1') | first,
            'on' if __claude_code_vm_xml is search(__claude_code_vm_feature | format('secure-boot')) else 'off',
            'enrolled' if __claude_code_vm_xml is search(__claude_code_vm_feature | format('enrolled-keys')) else 'none',
            __claude_code_vm_xml | regex_search("<nvram template='([^']*)'", '\1') | default(['?'], true) | first))
         if __claude_code_vm_xml is search('<loader') else 'BIOS' }}
    __claude_code_vm_leases: "{{ __claude_code_vm_describe.results[3].stdout_lines[2:] | map('trim') | select | list }}"
  ansible.builtin.set_fact:
    __claude_code_vm_description: >-
      {{ (['VM: not defined'] if __claude_code_vm_describe.results[0].rc != 0 else
          ['VM: ' ~ __claude_code_vm_describe.results[0].stdout | trim,
           'Firmware: ' ~ __claude_code_vm_firmware,
           'TPM: ' ~ ('yes' if __claude_code_vm_xml is search('<tpm ') else 'no'),
           'Disks (type, device, target, source):']
          + __claude_code_vm_describe.results[2].stdout_lines[2:] | map('trim') | select | map('regex_replace', '^', '  ') | list)
         + ['Cloud-init CD: ' ~ (__claude_code_vm_seed_iso if __claude_code_vm_describe_seed.stat.exists else 'none'),
            'DHCP leases: ' ~ (__claude_code_vm_leases | join('; ') or 'none'),
            "Last lines of libvirt's log of the VM:"]
         + ((__claude_code_vm_describe_logs.results[1].content | default('') | b64decode).splitlines()[-3:]
            | map('regex_replace', '^', '  ') | list) }}
    __claude_code_vm_console: >-
      {{ (__claude_code_vm_describe_logs.results[0].content | default('') | b64decode
          | regex_replace('\x1b.[0-9;=?]*[A-Za-z]', '') | regex_replace('[^ -~\n]', '')).splitlines()
         | map('trim') | select | list }}
