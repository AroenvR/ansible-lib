---
# The VM's size. Molecule's test servers and images need a few GB of each.
claude_code_vm_memory: 4096
claude_code_vm_vcpus: 2
claude_code_vm_disk_size: 40G

# The VM's own network on the host: <prefix>.1 is the host, <prefix>.10 the VM.
claude_code_vm_network_prefix: "192.168.123"

# Keeps the VM away from the local network and the host's own services, while
# it still reaches the internet.
claude_code_vm_lan_block: true

# Ports of the host's own the VM may reach all the same, at <prefix>.1, such as
# GitLab's (aslib.infra.gitlab: [8929, 2224]), and names that lead there from
# inside the VM, such as GitLab's (gitlab.home.arpa).
claude_code_vm_host_ports: []
claude_code_vm_host_names: []

# Public keys that may also log in as claude, such as your workstation's. The
# machine that runs the playbook always may (with ~/.ssh/claude-dev).
claude_code_vm_authorized_keys: []

# Claude's sign-in in the VM: the one-year token that `claude setup-token`
# prints. A secret: set it from Ansible Vault. Empty: claude signs in by hand.
claude_code_vm_oauth_token: ""

# Commands that run in the VM on a schedule, as claude: each a list item with
# name, command, schedule and state, see meta/argument_specs.yml.
claude_code_vm_jobs: []

# Ubuntu 24.04's cloud image, checked against its published checksums. Empty:
# the one for the host's architecture (amd64 or arm64).
claude_code_vm_image_url: ""
claude_code_vm_image_checksum: sha256:https://cloud-images.ubuntu.com/releases/noble/release/SHA256SUMS

# In the VM: Python 3.11 for the ansible-core 2.14 venvs of aslib.infra's
# tests, from the deadsnakes PPA (Ubuntu 24.04 ships 3.12 only)...
claude_code_vm_python_repository: https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu
claude_code_vm_python_key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776

# ... and Claude Code from Anthropic's signed apt repository. The URL's last part
# is the channel: stable, or latest.
claude_code_vm_claude_code_repository: https://downloads.claude.ai/claude-code/apt/stable
claude_code_vm_claude_code_key_url: https://downloads.claude.ai/keys/claude-code.asc

# Debugging. The entry point overview shows this many of the console's last
# lines; boot_trial boots the VM once, with these changes (see ansible-doc).
claude_code_vm_overview_console_lines: 20
claude_code_vm_trial_firmware: ""
claude_code_vm_trial_tpm: true
claude_code_vm_trial_cdrom: true
claude_code_vm_trial_reset_nvram: true
claude_code_vm_trial_seconds: 300
