---
argument_specs:
  main:
    short_description: Create claude-dev, a VM for Claude Code with sudo, on a Linux host with KVM
    description:
      - Creates the VM claude-dev from Ubuntu 24.04's cloud image, on a NAT network of its own, where it always has
        the address <claude_code_vm_network_prefix>.10, and starts it now and at every boot. Its account claude may use
        sudo and logs in with the key ~/.ssh/claude-dev of the machine that runs the playbook, created when missing.
      - A VM that exists takes the memory and vCPUs of the settings, higher or lower, at the next run. A run where they
        differ shuts it down cleanly (never forced; one that does not shut down within 5 minutes stops the run, which
        says so), gives it the new values and starts it. The disk size and the network are for a new VM.
      - Firewall rules on the host (nftables, a table of their own, loaded by claude-vm-firewall.service) keep the
        VM away from the local network and from the host's own services; it still reaches the internet.
      - Then adds the VM to the inventory as the host claude-dev (group claude_code_vm), for the entry point guest. The
        playbook aslib.infra.claude_code_vm runs both; one host per run.
      - The settings a person chooses live on the host in /etc/claude-vm/settings.yml (root's, 0600, as it may hold
        the token) - the VM's size, network, keys, host ports and names, the token, and how Claude Code's sessions
        start and its skills (claude_code_settings_*, see aslib.infra.claude_code_settings, and claude_code_skills_*, see
        aslib.infra.claude_code_skills). A run without the file writes it, every
        setting at the value the run uses, each with a comment; a later run adds the settings it lacks the same way and
        never changes a line that is there. Every run then takes its values from the file, over the inventory's, and
        checks them as options; -e still wins for that run. The download sources and the debugging options stay
        outside it, as aslib.infra's. The entry point remove keeps it.
      - A run that still sets a setting of before 0.7.0 (claude_vm_*) stops, naming it.
      - The host needs Ubuntu 24.04 or newer on x86_64 or ARM64 (aarch64, such as a Raspberry Pi 4) with KVM, and the
        internet for its packages and the cloud image. Runs with ansible-core 2.16 or newer, as the host and the VM
        have Python 3.12, which 2.14 does not support on managed machines. The VM has the host's architecture; an ARM64 VM boots with
        UEFI firmware without Secure Boot.
    options:
      claude_code_vm_memory:
        type: int
        default: 4096
        description:
          - The VM's memory, in MiB, all taken from the host when the VM starts. It must leave the host 1 GiB; the
            playbook stops otherwise, naming what fits, before it touches the VM. aslib.infra's tests want 2048 or
            more.
          - Applies to a VM that exists too, higher or lower; a run where it differs restarts the VM (see above).
      claude_code_vm_vcpus:
        type: int
        default: 2
        description: The VM's virtual CPUs. Applies to a VM that exists too, like the memory.
      claude_code_vm_disk_size:
        type: str
        default: 40G
        description: The size of the VM's disk, as qemu-img takes it, for a new VM. Only space the VM uses takes room
          on the host.
      claude_code_vm_network_prefix:
        type: str
        default: "192.168.123"
        description:
          - The first three numbers of the VM's network, a /24 that the host does not use otherwise. The host is
            <prefix>.1, the VM <prefix>.10.
          - Changing it needs a new VM (aslib.infra.claude_code_vm_remove first).
      claude_code_vm_lan_block:
        type: bool
        default: true
        description: Keep the VM away from the private address ranges (the local network) and from the host's own
          services, apart from its network's DHCP and DNS. False lets it reach them.
      claude_code_vm_host_ports:
        type: list
        elements: int
        default: []
        description:
          - TCP ports of the host's own services that the VM may reach all the same, at <prefix>.1, such as those of
            aslib.infra.gitlab on the host (C([8929, 2224])). Only those ports, and only at that address.
      claude_code_vm_host_names:
        type: list
        elements: str
        default: []
        description: Names that lead to the host (<prefix>.1) from inside the VM, in its /etc/hosts, such as GitLab's
          (C([gitlab.home.arpa])). Passed on to the entry point guest.
      claude_code_vm_authorized_keys:
        type: list
        elements: str
        default: []
        description: Public keys that may also log in as claude, such as your workstation's, besides the key of the
          machine that runs the playbook. Applied by the entry point guest.
      claude_code_vm_oauth_token:
        type: str
        default: ""
        no_log: true
        description:
          - Claude's sign-in in the VM, the one-year token that C(claude setup-token) prints for a Pro, Max, Team or
            Enterprise subscription; it signs Claude Code in as that account, with its usage limits. A secret - set it
            from Ansible Vault. Empty, the default, leaves the sign-in to the user, by hand.
          - The run hides it from its output and its run log (no_log). On the host it is kept only where it comes from
            and in the settings file (root's, 0600), never in the VM's cloud-init data. In the VM it is
            /etc/claude-vm/oauth-token, readable by root and claude, changeable only with sudo, and never in the
            policy, which everyone may read. The VM's claude command passes it on to Claude Code. Emptying it removes
            it from the VM at the next run; a new token replaces the old one there.
      claude_code_vm_image_url:
        type: str
        default: ""
        description:
          - Ubuntu's cloud image, downloaded once into /var/lib/libvirt/images/. A mirror works too.
          - Empty, the default, takes Ubuntu 24.04's for the host's architecture,
            https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-<amd64 or arm64>.img.
      claude_code_vm_image_checksum:
        type: str
        default: sha256:https://cloud-images.ubuntu.com/releases/noble/release/SHA256SUMS
        description: The image's checksum as get_url takes it, here the URL of Ubuntu's published checksums.
      claude_code_vm_python_repository:
        type: str
        default: https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu
        description: Passed on to the entry point guest, see there.
      claude_code_vm_python_key_url:
        type: str
        default: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776
        description: Passed on to the entry point guest, see there.
      claude_code_vm_claude_code_repository:
        type: str
        default: https://downloads.claude.ai/claude-code/apt/stable
        description: Passed on to the entry point guest, see there.
      claude_code_vm_claude_code_key_url:
        type: str
        default: https://downloads.claude.ai/keys/claude-code.asc
        description: Passed on to the entry point guest, see there.
  guest:
    short_description: Set up claude-dev for Claude Code and aslib.infra's tests
    description:
      - Runs in the VM, as claude with sudo, after the entry point main. Writes claude's authorized_keys, adds the
        apt repositories below (each key checked against its known fingerprint) and installs Podman, git, make,
        Python 3.11 next to Ubuntu's 3.12 (aslib.infra's test venvs run ansible-core 2.14 on it, as RHEL 9.6 does) and
        Claude Code, with the policy of aslib.infra.claude_code_settings (what Claude Code's container starts from
        too, with the hooks of loop-to-delivery where it is on) as /etc/claude-code/managed-settings.json and the
        files of aslib.infra.claude_code_skills in /etc/claude-code/.claude/ (the qa skill and its experts, with
        claude_code_skills_qa; loop-to-delivery, with claude_code_skills_loop_to_delivery), Claude's token and the
        claude command (/usr/local/bin/claude), which starts Claude Code with it, and a .claude.json for claude, where
        missing, so that its first start asks nothing.
      - Every run brings all the VM's packages up to date from its repositories (apt upgrade, with new dependencies
        such as a new kernel; nothing is removed), and restarts the VM cleanly when Ubuntu says it needs a restart
        (/var/run/reboot-required, whoever left it), which ends the sessions in it; one that does not come back
        within 15 minutes stops the run. A run with nothing to upgrade and no restart pending changes nothing.
      - Needs the internet, or mirrors of the repositories below and Ubuntu's.
    options:
      claude_code_vm_authorized_keys:
        type: list
        elements: str
        default: []
        description: Public keys that may log in as claude besides the key of the machine that runs the playbook.
      claude_code_vm_oauth_token:
        type: str
        default: ""
        no_log: true
        description: Claude's sign-in, the token of C(claude setup-token), installed as /etc/claude-vm/oauth-token;
          empty removes it.
      claude_code_vm_host_names:
        type: list
        elements: str
        default: []
        description: Names that lead to the host from inside the VM, in its /etc/hosts.
      claude_code_vm_network_prefix:
        type: str
        default: "192.168.123"
        description: The first three numbers of the VM's network; the host is <prefix>.1.
      claude_code_vm_python_repository:
        type: str
        default: https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu
        description: The apt repository with Python 3.11 for Ubuntu 24.04, the deadsnakes PPA by default.
      claude_code_vm_python_key_url:
        type: str
        default: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776
        description: Its signing key, which must be F23C5A6CF475977595C89F51BA6932366A755776.
      claude_code_vm_claude_code_repository:
        type: str
        default: https://downloads.claude.ai/claude-code/apt/stable
        description: Anthropic's apt repository for Claude Code. The last part of the URL is the channel, stable or
          latest. Claude Code then updates with apt, not by itself.
      claude_code_vm_claude_code_key_url:
        type: str
        default: https://downloads.claude.ai/keys/claude-code.asc
        description: Its signing key, which must be 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE.
  overview:
    short_description: Show the host and claude-dev, for finding out why the VM does not come up
    description:
      - Shows the host's model, system, KVM, memory and virtualization packages, and the VM's state, firmware
        (Secure Boot, Microsoft keys), TPM, disks (whether the CD drive holds the cloud-init CD), DHCP
        leases, the last lines of libvirt's log of it, and its console's last lines once a boot trial has recorded
        them. Changes nothing. The playbook aslib.infra.claude_code_vm_overview runs it.
    options:
      claude_code_vm_overview_console_lines:
        type: int
        default: 20
        description: How many of the console's last lines to show; 0 shows none.
  boot_trial:
    short_description: Boot claude-dev once in a changed form and show how far it gets (a debugging tool)
    description:
      - Stops the VM, changes it as the options below say, records its console in
        /var/log/libvirt/qemu/claude-dev-console.log, boots it and waits for a login prompt or a crash. Then shows
        the result in one line, what the VM is made of, and the console lines that tell how far the boot got
        (firmware, shim, Linux, cloud-init, login). The playbook aslib.infra.claude_code_vm_boot_trial runs it.
      - It changes the VM, and the changes stay for the next trial; it only swaps the firmware or takes things away.
        aslib.infra.claude_code_vm_remove, then aslib.infra.claude_code_vm, bring back the VM as the entry point main makes it.
    options:
      claude_code_vm_trial_firmware:
        type: str
        default: ""
        choices: ["", secure-ms, secure-nokeys, plain]
        description:
          - The UEFI firmware to boot with, from Ubuntu's qemu-efi-aarch64 (an ARM64 VM; an x86_64 VM boots with
            BIOS). Empty keeps the VM's own.
          - C(secure-ms), libvirt's default for a new ARM64 VM, Secure Boot with Microsoft's keys enrolled, so
            enforced (on a Raspberry Pi 4, Ubuntu's boot loader crashes with it).
            C(secure-nokeys), the same firmware without keys, so nothing enforced. C(plain), firmware without
            Secure Boot.
      claude_code_vm_trial_tpm:
        type: bool
        default: true
        description: False removes the VM's TPM.
      claude_code_vm_trial_cdrom:
        type: bool
        default: true
        description: False removes the VM's CD drive, with the cloud-init CD if it holds it.
      claude_code_vm_trial_reset_nvram:
        type: bool
        default: true
        description: Boot from fresh UEFI variables (NVRAM), as a new VM does. False keeps those of earlier boots.
      claude_code_vm_trial_seconds:
        type: int
        default: 300
        description: How long to wait for a login prompt or a crash.
  remove:
    short_description: Remove claude-dev from the host
    description:
      - Removes the VM with its disk and cloud-init CD, its network, the firewall rules and their service, and the VM's host key on
        the machine that runs the playbook. Ubuntu's cloud image, the key ~/.ssh/claude-dev and the settings file
        /etc/claude-vm/settings.yml stay for the next VM; delete the file (sudo rm /etc/claude-vm/settings.yml) to
        start the next one from the defaults again.
    options: {}
