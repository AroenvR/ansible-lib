---
- name: Check the deployed service works, and comes back by itself when the server restarts
  hosts: all
  gather_facts: false
  tasks:
    - name: Query the service
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_before

    - name: Inspect the service's account, directory and files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/deploy-test-app/starts
        - /etc/containers/systemd/users/3001/deploy-test-app.env
        - /etc/containers/systemd/users/3001/deploy-test-app.container
      register: __node_deploy_test_files

    - name: Restart the test server, as a reboot would
      ansible.builtin.command:
        argv: [podman, restart, "{{ inventory_hostname }}"]
      delegate_to: localhost
      changed_when: false

    - name: Query the service again once the server is back, showing its log if it does not answer
      block:
        - name: Query the service again once the server is back
          ansible.builtin.uri:
            url: http://127.0.0.1:3009/
          register: __node_deploy_test_after
          until: __node_deploy_test_after is succeeded
          retries: 60
          delay: 2
      rescue:
        - name: Show the service's log
          ansible.builtin.command: journalctl --no-pager --lines=50 _SYSTEMD_USER_UNIT=deploy-test-app.service
          changed_when: false
          failed_when: true

    - name: Check the service's settings, its data, its files and its start at boot
      ansible.builtin.assert:
        that:
          - __node_deploy_test_before.json.greeting == 'hello from container.env'
          - __node_deploy_test_files.results[0].stat.pw_name == 'deploy-test-app'
          - __node_deploy_test_files.results[0].stat.uid == 3001
          - __node_deploy_test_files.results[1].stat.mode == '0640'
          - __node_deploy_test_files.results[1].stat.gr_name == 'deploy-test-app'
          - __node_deploy_test_files.results[2].stat.exists
          - __node_deploy_test_after.json.starts > __node_deploy_test_before.json.starts
        success_msg: >-
          PASSED node_deploy: the service answers on 127.0.0.1:3009 with the setting from container.env,
          writes /opt/deploy-test-app as its own account (UID 3001), keeps its Quadlet and environment files
          in /etc/containers/systemd/users/3001/, and started by itself when the server restarted, with its
          data (start count {{ __node_deploy_test_before.json.starts }}, then {{ __node_deploy_test_after.json.starts }}).
