---
- name: Check the deployed service works, and comes back by itself when the server restarts
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Query the service
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_before

    - name: Inspect the service's account, directory and files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/deploy-test-app/data/starts
        - /opt/deploy-test-app/app.state
        - /etc/containers/systemd/users/3001/deploy-test-app.env
        - /etc/containers/systemd/users/3001/deploy-test-app.container
      register: __node_deploy_test_files

    - name: Restart the test server, as a reboot would
      ansible.builtin.command:
        argv: [podman, restart, "{{ inventory_hostname }}"]
      delegate_to: localhost
      changed_when: false

    - name: Query the service again once the server is back, showing its log if it does not answer
      block:
        - name: Query the service again once the server is back
          ansible.builtin.uri:
            url: http://127.0.0.1:3009/
          register: __node_deploy_test_after
          until: __node_deploy_test_after is succeeded
          retries: 60
          delay: 2
      rescue:
        - name: Show the service's log
          ansible.builtin.command: journalctl --no-pager --lines=50 _SYSTEMD_USER_UNIT=deploy-test-app.service
          changed_when: false
          failed_when: true

    - name: Check the service's settings, its working directory, its files and its start at boot
      ansible.builtin.assert:
        that:
          - __node_deploy_test_before.json.version == '1.0.0'
          - __node_deploy_test_before.json.greeting == 'hello from .env.production'
          - __node_deploy_test_before.json.config == 'config/production'
          - __node_deploy_test_before.json.tuned == 'yes'
          - __node_deploy_test_before.json.cwd == '/opt/deploy-test-app'
          - __node_deploy_test_before.json.tmpBytes == 512 * 1024 * 1024
          - __node_deploy_test_files.results[0].stat.uid == 3001
          - __node_deploy_test_files.results[1].stat.pw_name == 'deploy-test-app'
          - __node_deploy_test_files.results[2].stat.mode == '0640'
          - __node_deploy_test_files.results[2].stat.gr_name == 'deploy-test-app'
          - __node_deploy_test_files.results[3].stat.exists
          - __node_deploy_test_after.json.starts > __node_deploy_test_before.json.starts
        success_msg: >-
          PASSED node_deploy: the service answers on 127.0.0.1:3009 with the setting from .env.production,
          its production config and the line added to the project's Quadlet template. It runs in
          /opt/deploy-test-app, writes data/ and app.state there as its own account (UID 3001), has a 512 MB /tmp,
          and started by itself when the server restarted, with its data (start count
          {{ __node_deploy_test_before.json.starts }}, then {{ __node_deploy_test_after.json.starts }}).

- name: Check Claude Code runs next to the Node.js service, each as an account of its own, sharing the shared zone
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Look up the accounts
      ansible.builtin.getent:
        database: passwd

    - name: Read the subordinate UID ranges
      ansible.builtin.slurp:
        src: /etc/subuid
      register: __node_deploy_test_subuid

    - name: Note the accounts' UIDs and subordinate UID ranges (name:first:count)
      vars:
        __node_deploy_test_lines: "{{ (__node_deploy_test_subuid.content | b64decode).splitlines() }}"
      ansible.builtin.set_fact:
        __node_deploy_test_uid: "{{ ansible_facts.getent_passwd['deploy-test-app'][1] }}"
        __node_deploy_test_claude_uid: "{{ ansible_facts.getent_passwd['claude-code'][1] }}"
        __node_deploy_test_range: "{{ (__node_deploy_test_lines | select('match', '^deploy-test-app:') | first).split(':') }}"
        __node_deploy_test_claude_range: "{{ (__node_deploy_test_lines | select('match', '^claude-code:') | first).split(':') }}"

    - name: Look up whether both services run, after the restart of the server
      ansible.builtin.command:
        argv:
          - runuser
          - --user={{ item.account }}
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ item.uid }}
          - systemctl
          - --user
          - is-active
          - "{{ item.account }}.service"
        chdir: /
      loop:
        - { account: deploy-test-app, uid: "{{ __node_deploy_test_uid }}" }
        - { account: claude-code, uid: "{{ __node_deploy_test_claude_uid }}" }
      register: __node_deploy_test_both
      changed_when: false
      failed_when: false

    - name: Write into the shared zone from the Node.js service's container
      ansible.builtin.command:
        argv:
          - runuser
          - --user=deploy-test-app
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_uid }}
          - podman
          - exec
          - deploy-test-app
          - sh
          - -c
          - echo from deploy-test-app > /opt/containers/shared/test.txt && mkdir -p /opt/containers/shared/from-node
        chdir: /
      changed_when: true

    - name: Read it from Claude Code's container, and add to it
      ansible.builtin.command:
        argv:
          - runuser
          - --user=claude-code
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_claude_uid }}
          - podman
          - exec
          - claude-code
          - sh
          - -c
          - >-
            cat /opt/containers/shared/test.txt && echo from claude-code >> /opt/containers/shared/test.txt
            && touch /opt/containers/shared/from-node/claude.txt
        chdir: /
      register: __node_deploy_test_claude_read
      changed_when: true

    - name: Read it back from the Node.js service's container
      ansible.builtin.command:
        argv:
          - runuser
          - --user=deploy-test-app
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_uid }}
          - podman
          - exec
          - deploy-test-app
          - cat
          - /opt/containers/shared/test.txt
        chdir: /
      register: __node_deploy_test_node_read
      changed_when: false

    - name: Inspect the shared file on the server
      ansible.builtin.stat:
        path: /opt/containers/shared/test.txt
      register: __node_deploy_test_shared_file

    # Open to every account, also those outside the shared zone's group.
    - name: Inspect /opt/containers
      ansible.builtin.stat:
        path: /opt/containers
      register: __node_deploy_test_containers_dir

    - name: Look up the command that enters Claude Code
      ansible.builtin.stat:
        path: /usr/local/sbin/claude-code
      register: __node_deploy_test_command

    # Each runs claude-code in a terminal of its own, a tmux session, as a root
    # user at a keyboard would.
    - name: Enter Claude Code as two root users
      ansible.builtin.command:
        argv: [tmux, new-session, -d, -s, "enter-{{ item }}", env, -u, TMUX, "SUDO_USER={{ item }}", /usr/local/sbin/claude-code, --test-arg]
      loop: [alice, bob]
      changed_when: true

    - name: Wait until both users' sessions run the stand-in for Claude Code
      ansible.builtin.command:
        argv: [tmux, capture-pane, -p, -t, "claude-{{ item }}"]
      loop: [alice, bob]
      register: __node_deploy_test_panes
      until: __node_deploy_test_panes.stdout is search('policy readable')
      retries: 15
      delay: 2
      changed_when: false

    - name: Detach both users, closing their terminals
      ansible.builtin.command:
        argv: [tmux, kill-session, -t, "enter-{{ item }}"]
      loop: [alice, bob]
      changed_when: true

    - name: List the sessions left
      ansible.builtin.command:
        argv: [tmux, list-sessions, -F, "#{session_name}"]
      register: __node_deploy_test_sessions
      changed_when: false

    - name: Check both services run as accounts of their own, share the shared zone, and each user has a session
      ansible.builtin.assert:
        that:
          - __node_deploy_test_both.results | map(attribute='stdout') | list == ['active', 'active']
          - __node_deploy_test_uid != __node_deploy_test_claude_uid
          - >-
            (__node_deploy_test_range[1] | int) + (__node_deploy_test_range[2] | int) <= (__node_deploy_test_claude_range[1] | int)
            or (__node_deploy_test_claude_range[1] | int) + (__node_deploy_test_claude_range[2] | int) <= (__node_deploy_test_range[1] | int)
          - __node_deploy_test_claude_read.stdout == 'from deploy-test-app'
          - __node_deploy_test_node_read.stdout_lines == ['from deploy-test-app', 'from claude-code']
          - __node_deploy_test_shared_file.stat.gr_name == 'containers-shared'
          - __node_deploy_test_shared_file.stat.wgrp
          - __node_deploy_test_containers_dir.stat.mode == '0755'
          - __node_deploy_test_command.stat.mode == '0750'
          - __node_deploy_test_command.stat.pw_name == 'root'
          - __node_deploy_test_panes.results[0].stdout is search('mock claude as 1001 in /opt/claude-code with: --test-arg')
          - __node_deploy_test_panes.results[1].stdout is search('mock claude as 1001 in /opt/claude-code with: --test-arg')
          - __node_deploy_test_sessions.stdout_lines | sort == ['claude-alice', 'claude-bob']
        success_msg: >-
          PASSED claude_code next to node_deploy: both came back after the restart, as accounts with UIDs
          {{ __node_deploy_test_uid }} and {{ __node_deploy_test_claude_uid }} and separate subordinate UID ranges;
          a file one wrote to the shared zone the other read and changed; claude-code gave alice and bob a session
          each, running Claude as 1001 in /opt/claude-code with the policy, which stayed when they detached.

- name: Check the overview shows both services, and the log of a service that does not run
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  vars:
    __node_deploy_test_systemctl: [runuser, --user=deploy-test-app, --, env, XDG_RUNTIME_DIR=/run/user/3001, systemctl, --user]
  tasks:
    - name: Run podman_overview
      ansible.builtin.include_role:
        name: aslib.infra.podman_overview

    - name: Note the overview of the running service
      ansible.builtin.set_fact:
        __node_deploy_test_running: "{{ podman_overview_services }}"

    - name: Stop the service
      ansible.builtin.command:
        argv: "{{ __node_deploy_test_systemctl + ['stop', 'deploy-test-app.service'] }}"
        chdir: /
      changed_when: true

    - name: Run podman_overview with the service stopped
      ansible.builtin.include_role:
        name: aslib.infra.podman_overview

    - name: Start the service again
      ansible.builtin.command:
        argv: "{{ __node_deploy_test_systemctl + ['start', 'deploy-test-app.service'] }}"
        chdir: /
      changed_when: true

    - name: Wait until the service answers again
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_back
      until: __node_deploy_test_back is succeeded
      retries: 30
      delay: 2

    - name: Check the overview showed both services, then the Node.js one's state and log once stopped
      vars:
        __node_deploy_test_node: "{{ __node_deploy_test_running | selectattr('name', 'equalto', 'deploy-test-app') | first }}"
        __node_deploy_test_claude: "{{ __node_deploy_test_running | selectattr('name', 'equalto', 'claude-code') | first }}"
        __node_deploy_test_stopped: "{{ podman_overview_services | selectattr('name', 'equalto', 'deploy-test-app') | first }}"
        __node_deploy_test_still: "{{ podman_overview_services | selectattr('name', 'equalto', 'claude-code') | first }}"
      ansible.builtin.assert:
        that:
          - __node_deploy_test_running | map(attribute='name') | sort == ['claude-code', 'deploy-test-app']
          - __node_deploy_test_node.account == 'deploy-test-app'
          - __node_deploy_test_node.uid == '3001'
          - __node_deploy_test_node.state == 'active'
          - __node_deploy_test_node.substate == 'running'
          - __node_deploy_test_node.image == 'localhost/deploy-test-app:1.0.0'
          - __node_deploy_test_node.ports == ['127.0.0.1:3009:3000']
          - __node_deploy_test_node.log == []
          - __node_deploy_test_claude.account == 'claude-code'
          - __node_deploy_test_claude.state == 'active'
          - __node_deploy_test_claude.image == 'localhost/claude-code:0.0.1'
          - __node_deploy_test_claude.ports == []
          - __node_deploy_test_stopped.state != 'active'
          - __node_deploy_test_stopped.log is search('deploy-test-app 1.0.0 listens')
          - __node_deploy_test_still.state == 'active'
        success_msg: >-
          PASSED podman_overview: it showed deploy-test-app running as its account (UID 3001), with its image
          and port, and claude-code without a port; then deploy-test-app {{ __node_deploy_test_stopped.state }} once
          stopped, with the app's log lines, and claude-code still running.

- name: Build a new version of the test project, as a developer would
  hosts: localhost
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Raise the version in package.json to 1.0.1
      ansible.builtin.replace:
        path: "{{ node_deploy_test_project }}/package.json"
        regexp: '"version": "1\.0\.0"'
        replace: '"version": "1.0.1"'

    - name: Change a config file
      ansible.builtin.copy:
        content: '{ "source": "config/production, changed" }'
        dest: "{{ node_deploy_test_project }}/config/production/app.json"
        mode: "0644"

    - name: Remove a config file
      ansible.builtin.file:
        path: "{{ node_deploy_test_project }}/config/production/old.json"
        state: absent

    - name: Run node_image
      ansible.builtin.include_role:
        name: aslib.infra.node_image
      vars:
        node_image_source: "{{ node_deploy_test_project }}"
        node_image_output_dir: "{{ node_deploy_test_project }}/ansible/images"
        node_image_npmrc: ""

    - name: List the project's images on the build machine
      ansible.builtin.command:
        argv: [podman, images, --filter=label=org.opencontainers.image.title=deploy-test-app, "--format={% raw %}{{.Repository}}:{{.Tag}}{% endraw %}"]
      register: __node_deploy_test_built
      changed_when: false

    - name: Check the build machine keeps only the new image and its build stage
      ansible.builtin.assert:
        that: __node_deploy_test_built.stdout_lines | sort == ['localhost/deploy-test-app:1.0.1', 'localhost/deploy-test-app:build']
        success_msg: PASSED node_image keeps deploy-test-app:1.0.1 and its build stage, and removed the images of 1.0.0.

- name: Check a deploy of the new version replaces the old one and keeps the data
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Query the service before the update
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_old

    - name: Run node_deploy with the new version
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy

    - name: Query the updated service
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_new

    - name: Find the service's image archives
      ansible.builtin.find:
        paths: /opt/containers/images/deploy-test-app
      register: __node_deploy_test_archives

    - name: Find the service's config files
      ansible.builtin.find:
        paths: /opt/deploy-test-app/config
      register: __node_deploy_test_config

    - name: List the account's images
      ansible.builtin.command:
        argv:
          - runuser
          - --user=deploy-test-app
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/3001
          - podman
          - images
          - --format={% raw %}{{.Repository}}:{{.Tag}}{% endraw %}
        chdir: /
      register: __node_deploy_test_images
      changed_when: false

    - name: List the Claude Code sessions, which the Node.js update must leave alone
      ansible.builtin.command:
        argv: [tmux, list-sessions, -F, "#{session_name}"]
      register: __node_deploy_test_sessions_after
      changed_when: false

    - name: Check the new version runs with the old data and the new config, and only the new version is left
      ansible.builtin.assert:
        that:
          - __node_deploy_test_sessions_after.stdout_lines | sort == ['claude-alice', 'claude-bob']
          - __node_deploy_test_new.json.version == '1.0.1'
          - __node_deploy_test_new.json.config == 'config/production, changed'
          - __node_deploy_test_config.files | map(attribute='path') | list == ['/opt/deploy-test-app/config/app.json']
          - __node_deploy_test_new.json.starts > __node_deploy_test_old.json.starts
          - __node_deploy_test_archives.files | map(attribute='path') | list == ['/opt/containers/images/deploy-test-app/deploy-test-app-1.0.1.tar']
          - __node_deploy_test_images.stdout_lines == ['localhost/deploy-test-app:1.0.1']
        success_msg: >-
          PASSED node_deploy update: version 1.0.1 answers with the data of 1.0.0 (start count
          {{ __node_deploy_test_new.json.starts }}) and the changed config file; the removed config file,
          the archive and the image of 1.0.0 are gone; the Claude Code sessions kept running.

- name: Check the removal takes away the service and keeps its data
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Remove the service
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
        tasks_from: remove

    - name: Remove it again, which must work on a clean server too
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
        tasks_from: remove

    - name: Run podman_overview after the removal
      ansible.builtin.include_role:
        name: aslib.infra.podman_overview

    - name: Look up the service's account
      ansible.builtin.getent:
        database: passwd
        key: deploy-test-app
        fail_key: false

    - name: Look for what the deploy created
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/containers/systemd/users/3001
        - /opt/containers/images/deploy-test-app
        - /opt/deploy-test-app/config
        - /home/deploy-test-app
        - /var/lib/systemd/linger/deploy-test-app
      register: __node_deploy_test_leftovers

    - name: Look for the app's data
      ansible.builtin.stat:
        path: /opt/deploy-test-app/data/starts
      register: __node_deploy_test_kept

    - name: Query the service's port
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_gone
      failed_when: false

    - name: Check the account, the files and the service are gone, and the data is not
      ansible.builtin.assert:
        that:
          - podman_overview_services | map(attribute='name') | list == ['claude-code']
          - (podman_overview_services | first).state == 'active'
          - ansible_facts.getent_passwd['deploy-test-app'] is none
          - __node_deploy_test_leftovers.results | selectattr('stat.exists') | map(attribute='item') | list == []
          - __node_deploy_test_kept.stat.exists
          - __node_deploy_test_gone.status == -1
        success_msg: >-
          PASSED node_deploy remove: the account, its home directory, Quadlet directory, image archive,
          config files and lingering are gone, nothing answers on port 3009 and podman_overview lists only
          claude-code, still running; the app's data is still there, and a second run works.

- name: Check a new deploy, as an account with another UID, takes over the data
  # Not 3002: claude-code, created after the account with 3001, took that one.
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    # Without the shared zone first, as a service deployed before it existed.
    - name: Run node_deploy with UID 3005, without the shared zone
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
      vars:
        podman_service_uid: "3005"
        podman_service_shared: false

    - name: Run node_deploy again with the shared zone, as an update would
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
      vars:
        podman_service_uid: "3005"

    - name: Query the service
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_again
      until: __node_deploy_test_again is succeeded
      retries: 30
      delay: 2

    - name: Write into the shared zone from the service's container
      ansible.builtin.command:
        argv:
          - runuser
          - --user=deploy-test-app
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/3005
          - podman
          - exec
          - deploy-test-app
          - touch
          - /opt/containers/shared/from-node/later.txt
        chdir: /
      changed_when: true

    - name: Inspect the data the earlier account wrote
      ansible.builtin.stat:
        path: /opt/deploy-test-app/data/starts
      register: __node_deploy_test_taken

    - name: Check the service continues with the data, now owned by the new account
      ansible.builtin.assert:
        that:
          - __node_deploy_test_again.json.starts > __node_deploy_test_new.json.starts
          - __node_deploy_test_taken.stat.uid == 3005
        success_msg: >-
          PASSED node_deploy took over the data of the removed account as UID 3005 (start count
          {{ __node_deploy_test_again.json.starts }}), and a running service that got the shared zone later can
          write to it.

- name: Check the removal with podman_service_remove_data takes the data as well
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Remove the service and its data
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
        tasks_from: remove
      vars:
        podman_service_remove_data: "true"   # as -e podman_service_remove_data=true passes it

    - name: Look for the service's directory
      ansible.builtin.stat:
        path: /opt/deploy-test-app
      register: __node_deploy_test_dir

    - name: Check the service's directory is gone
      ansible.builtin.assert:
        that: not __node_deploy_test_dir.stat.exists
        success_msg: PASSED node_deploy remove with podman_service_remove_data=true removed /opt/deploy-test-app too.

- name: Check the deploy stops when the project still uses a setting's name from before 0.1.0
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Deploy with node_deploy_port, the earlier name of podman_service_port
      block:
        - name: Run node_deploy with node_deploy_port
          ansible.builtin.include_role:
            name: aslib.infra.node_deploy
          vars:
            node_deploy_port: 3009

        - name: Fail, as node_deploy accepted the earlier name
          ansible.builtin.fail:
            msg: node_deploy accepted node_deploy_port
      rescue:
        - name: Check it stopped and named the new setting
          ansible.builtin.assert:
            that: ansible_failed_result.msg is search('rename node_deploy_port to podman_service_port')
            success_msg: PASSED node_deploy stopped at node_deploy_port and named podman_service_port instead.

- name: Check the overview playbook shows this machine without an inventory, and every server with one
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create a directory for the inventories
      ansible.builtin.tempfile:
        state: directory
      register: __node_deploy_test_inventories

    - name: Write an empty inventory, as on a server without one, and one with two servers
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ __node_deploy_test_inventories.path }}/{{ item.name }}"
        mode: "0644"
      loop:
        - { name: empty.yml, content: "" }
        - { name: servers.yml, content: "all:\n  hosts:\n    web1:\n    web2:\n" }
      loop_control:
        label: "{{ item.name }}"

    - name: List the hosts the overview playbook runs on
      ansible.builtin.command:
        argv: [ansible-playbook, aslib.infra.podman_overview, --list-hosts, "--inventory={{ __node_deploy_test_inventories.path }}/{{ item }}"]
      loop: [empty.yml, servers.yml]
      register: __node_deploy_test_overview_hosts
      changed_when: false

    - name: Remove the inventories
      ansible.builtin.file:
        path: "{{ __node_deploy_test_inventories.path }}"
        state: absent

    - name: Check the overview runs on this machine without servers, and on the servers otherwise
      vars:
        __node_deploy_test_without: "{{ __node_deploy_test_overview_hosts.results[0].stdout_lines | map('trim') | list }}"
        __node_deploy_test_with: "{{ __node_deploy_test_overview_hosts.results[1].stdout_lines | map('trim') | list }}"
      ansible.builtin.assert:
        that:
          - __node_deploy_test_without is superset(['hosts (1):', 'localhost'])
          - __node_deploy_test_with is superset(['hosts (2):', 'web1', 'web2'])
          - "'localhost' not in __node_deploy_test_with"
        success_msg: PASSED podman_overview's playbook shows this machine without an inventory, and only the servers with one.

- name: Check the removal of Claude Code takes its service, account and command, and keeps its directory and the shared zone
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Remove Claude Code
      ansible.builtin.include_role:
        name: aslib.infra.claude_code
        tasks_from: remove

    - name: Look up Claude Code's account
      ansible.builtin.getent:
        database: passwd
        key: claude-code
        fail_key: false

    - name: Look for what the deploy created, and what must stay
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/sbin/claude-code
        - /opt/containers/images/claude-code
        - /opt/claude-code/config
        - /opt/claude-code
        - /opt/containers/shared/test.txt
      register: __node_deploy_test_claude_left

    # The sessions' panes ran Claude in the container, which is gone.
    - name: Wait until the Claude Code sessions are gone
      ansible.builtin.command:
        argv: [tmux, list-sessions, -F, "#{session_name}"]
      register: __node_deploy_test_sessions_gone
      until: __node_deploy_test_sessions_gone.stdout_lines | select('match', '^claude-') | list == []
      retries: 15
      delay: 2
      changed_when: false
      failed_when: false  # tmux exits with 1 once its last session is gone

    - name: Check the service, account, archive, policy and command are gone, and the data and the shared zone stay
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd['claude-code'] is none
          - __node_deploy_test_claude_left.results | map(attribute='stat.exists') | list == [false, false, false, true, true]
        success_msg: >-
          PASSED claude_code remove: the service, its account, archive, policy, command and the users' sessions
          are gone; /opt/claude-code and the shared zone's files stay.
