---
- name: Check the deployed service works, and comes back by itself when the server restarts
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Query the service
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_before

    - name: Inspect the service's account, directory and files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/deploy-test-app/data/starts
        - /opt/deploy-test-app/app.state
        - /etc/containers/systemd/users/3001/deploy-test-app.env
        - /etc/containers/systemd/users/3001/deploy-test-app.container
      register: __node_deploy_test_files

    - name: Restart the test server, as a reboot would
      ansible.builtin.command:
        argv: [podman, restart, "{{ inventory_hostname }}"]
      delegate_to: localhost
      changed_when: false

    - name: Drop the SSH connection the restart broke
      ansible.builtin.meta: reset_connection

    - name: Wait until the test server lets Ansible in again
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Query the service again once the server is back, showing its log if it does not answer
      block:
        - name: Query the service again once the server is back
          ansible.builtin.uri:
            url: http://127.0.0.1:3009/
          register: __node_deploy_test_after
          until: __node_deploy_test_after is succeeded
          retries: 60
          delay: 2
      rescue:
        - name: Show the service's log
          ansible.builtin.command: journalctl --no-pager --lines=50 _SYSTEMD_USER_UNIT=deploy-test-app.service
          changed_when: false
          failed_when: true

    - name: Check the service's settings, its working directory, its files and its start at boot
      ansible.builtin.assert:
        that:
          - __node_deploy_test_before.json.version == '1.0.0'
          - __node_deploy_test_before.json.greeting == 'hello from .env.production'
          - __node_deploy_test_before.json.config == 'config/production'
          - __node_deploy_test_before.json.tuned == 'yes'
          - __node_deploy_test_before.json.cwd == '/opt/deploy-test-app'
          - __node_deploy_test_before.json.tmpBytes == 512 * 1024 * 1024
          - __node_deploy_test_files.results[0].stat.uid == 3001
          - __node_deploy_test_files.results[1].stat.pw_name == 'deploy-test-app'
          - __node_deploy_test_files.results[2].stat.mode == '0640'
          - __node_deploy_test_files.results[2].stat.gr_name == 'deploy-test-app'
          - __node_deploy_test_files.results[3].stat.exists
          - __node_deploy_test_after.json.starts > __node_deploy_test_before.json.starts
        success_msg: >-
          PASSED node_deploy: the service answers on 127.0.0.1:3009 with the setting from .env.production,
          its production config and the line added to the project's Quadlet template. It runs in
          /opt/deploy-test-app, writes data/ and app.state there as its own account (UID 3001), has a 512 MB /tmp,
          and started by itself when the server restarted, with its data (start count
          {{ __node_deploy_test_before.json.starts }}, then {{ __node_deploy_test_after.json.starts }}).

- name: Check Claude Code runs next to the Node.js service, each as an account of its own, sharing the shared zone
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Look up the accounts
      ansible.builtin.getent:
        database: passwd

    - name: Read the subordinate UID ranges
      ansible.builtin.slurp:
        src: /etc/subuid
      register: __node_deploy_test_subuid

    - name: Note the accounts' UIDs and subordinate UID ranges (name:first:count)
      vars:
        __node_deploy_test_lines: "{{ (__node_deploy_test_subuid.content | b64decode).splitlines() }}"
      ansible.builtin.set_fact:
        __node_deploy_test_uid: "{{ ansible_facts.getent_passwd['deploy-test-app'][1] }}"
        __node_deploy_test_claude_uid: "{{ ansible_facts.getent_passwd['claude-code'][1] }}"
        __node_deploy_test_range: "{{ (__node_deploy_test_lines | select('match', '^deploy-test-app:') | first).split(':') }}"
        __node_deploy_test_claude_range: "{{ (__node_deploy_test_lines | select('match', '^claude-code:') | first).split(':') }}"

    - name: Look up whether both services run, after the restart of the server
      ansible.builtin.command:
        argv:
          - runuser
          - --user={{ item.account }}
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ item.uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ item.uid }}/bus
          - systemctl
          - --user
          - is-active
          - "{{ item.account }}.service"
        chdir: /
      loop:
        - { account: deploy-test-app, uid: "{{ __node_deploy_test_uid }}" }
        - { account: claude-code, uid: "{{ __node_deploy_test_claude_uid }}" }
      register: __node_deploy_test_both
      changed_when: false
      failed_when: false

    - name: Write into the shared zone from the Node.js service's container
      ansible.builtin.command:
        argv:
          - runuser
          - --user=deploy-test-app
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_uid }}/bus
          - podman
          - exec
          - deploy-test-app
          - sh
          - -c
          - echo from deploy-test-app > /opt/containers/shared/test.txt && mkdir -p /opt/containers/shared/from-node
        chdir: /
      changed_when: true

    - name: Read it from Claude Code's container, and add to it
      ansible.builtin.command:
        argv:
          - runuser
          - --user=claude-code
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_claude_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_claude_uid }}/bus
          - podman
          - exec
          - claude-code
          - sh
          - -c
          - >-
            cat /opt/containers/shared/test.txt && echo from claude-code >> /opt/containers/shared/test.txt
            && touch /opt/containers/shared/from-node/claude.txt
        chdir: /
      register: __node_deploy_test_claude_read
      changed_when: true

    - name: Read it back from the Node.js service's container
      ansible.builtin.command:
        argv:
          - runuser
          - --user=deploy-test-app
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_uid }}/bus
          - podman
          - exec
          - deploy-test-app
          - cat
          - /opt/containers/shared/test.txt
        chdir: /
      register: __node_deploy_test_node_read
      changed_when: false

    # The README is root's: no service may change it, though all are in the zone's group.
    - name: Try to change the zone's README from Claude Code's container
      ansible.builtin.command:
        argv:
          - runuser
          - --user=claude-code
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_claude_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_claude_uid }}/bus
          - podman
          - exec
          - claude-code
          - sh
          - -c
          - >-
            (echo changed >> /opt/containers/shared/README.md) 2>/dev/null && echo changed;
            head -n 1 /opt/containers/shared/README.md
        chdir: /
      register: __node_deploy_test_readme_tries
      changed_when: false

    # Both with the private mode Python's tempfile asks for (0600); one then given
    # the group's access before the rename, as the zone's README says.
    - name: Write a private file into the shared zone from the Node.js service's container, and one given the group's access
      ansible.builtin.command:
        argv:
          - runuser
          - --user=deploy-test-app
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_uid }}/bus
          - podman
          - exec
          - deploy-test-app
          - node
          - --eval
          - >-
            const fs = require('fs'); const dir = '/opt/containers/shared/from-node/';
            for (const [name, mode] of [['private', 0o600], ['shared', 0o660]]) {
            fs.writeFileSync(dir + name + '.tmp', name + '\n', { mode: 0o600 }); fs.chmodSync(dir + name + '.tmp', mode);
            fs.renameSync(dir + name + '.tmp', dir + name + '.txt'); }
        chdir: /
      changed_when: true

    - name: Read both from Claude Code's container, and check the zone's README against its checksum
      ansible.builtin.command:
        argv:
          - runuser
          - --user=claude-code
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_claude_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_claude_uid }}/bus
          - podman
          - exec
          - claude-code
          - sh
          - -c
          - >-
            cat /opt/containers/shared/from-node/shared.txt;
            cat /opt/containers/shared/from-node/private.txt 2>/dev/null || echo unreadable;
            sha256sum --check /opt/containers/shared-checksums/README.md.sha256;
            touch /opt/containers/shared-checksums/new 2>/dev/null || echo read-only
        chdir: /
      register: __node_deploy_test_claude_checks
      changed_when: false

    - name: Inspect the shared zone and its README on the server
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/opt/containers/shared, /opt/containers/shared/README.md]
      register: __node_deploy_test_zone

    - name: Inspect the shared file on the server
      ansible.builtin.stat:
        path: /opt/containers/shared/test.txt
      register: __node_deploy_test_shared_file

    # Open to every account, also those outside the shared zone's group.
    - name: Inspect /opt/containers
      ansible.builtin.stat:
        path: /opt/containers
      register: __node_deploy_test_containers_dir

    - name: Look up the command that enters Claude Code
      ansible.builtin.stat:
        path: /usr/local/sbin/claude-code
      register: __node_deploy_test_command

    - name: Look up the .bashrc the deploy gave Claude's home
      ansible.builtin.stat:
        path: /opt/claude-code/.bashrc
      register: __node_deploy_test_bashrc

    - name: Look up Claude Code's own file the deploy gave Claude's home
      ansible.builtin.stat:
        path: /opt/claude-code/.claude/.claude.json
      register: __node_deploy_test_claude_json

    - name: Read it
      ansible.builtin.slurp:
        src: /opt/claude-code/.claude/.claude.json
      register: __node_deploy_test_claude_json_content
      failed_when: false

    # As a script would, without a terminal; the stand-in reports and exits. From
    # a root shell that still carries another user's D-Bus address, as after su.
    - name: Run Claude Code with claude-code, as root
      ansible.builtin.command:
        argv: [/usr/local/sbin/claude-code, --test-arg]
      environment:
        DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/0/bus
      register: __node_deploy_test_entered
      changed_when: false

    - name: Check both services run as accounts of their own, share the shared zone, and root can run Claude Code
      vars:
        __node_deploy_test_claude_says:
          - "mock claude as 1001 in /opt/claude-code with: --test-arg"
          - CLAUDE_CODE_SANDBOXED=1
          - policy readable
          - instructions readable
          - policy read-only
      ansible.builtin.assert:
        that:
          - __node_deploy_test_both.results | map(attribute='stdout') | list == ['active', 'active']
          - __node_deploy_test_uid != __node_deploy_test_claude_uid
          - >-
            (__node_deploy_test_range[1] | int) + (__node_deploy_test_range[2] | int) <= (__node_deploy_test_claude_range[1] | int)
            or (__node_deploy_test_claude_range[1] | int) + (__node_deploy_test_claude_range[2] | int) <= (__node_deploy_test_range[1] | int)
          - __node_deploy_test_claude_read.stdout == 'from deploy-test-app'
          - __node_deploy_test_node_read.stdout_lines == ['from deploy-test-app', 'from claude-code']
          - __node_deploy_test_shared_file.stat.gr_name == 'containers-shared'
          - __node_deploy_test_shared_file.stat.wgrp
          - __node_deploy_test_containers_dir.stat.mode == '0755'
          - __node_deploy_test_zone.results[0].stat.mode == '2770'
          - __node_deploy_test_zone.results[1].stat.pw_name == 'root'
          - __node_deploy_test_zone.results[1].stat.mode == '0644'
          - "__node_deploy_test_readme_tries.stdout_lines == ['# /opt/containers/shared: the shared zone']"
          - __node_deploy_test_command.stat.mode == '0750'
          - __node_deploy_test_command.stat.pw_name == 'root'
          - __node_deploy_test_bashrc.stat.pw_name == 'claude-code'
          # The first start skips Claude Code's setup.
          - __node_deploy_test_claude_json.stat.pw_name == 'claude-code'
          - __node_deploy_test_claude_json.stat.mode == '0600'
          - >-
            (__node_deploy_test_claude_json_content.content | default('') | b64decode | default('{}', true) | from_json)
            == {'hasCompletedOnboarding': true}
          - __node_deploy_test_entered.stdout_lines == __node_deploy_test_claude_says
        success_msg: >-
          PASSED claude_code_podman next to node_deploy: both came back after the restart, as accounts with UIDs
          {{ __node_deploy_test_uid }} and {{ __node_deploy_test_claude_uid }} and separate subordinate UID ranges;
          a file one wrote to the shared zone the other read and changed, while the zone's README stayed root's
          and unchangeable; claude-code ran Claude as 1001 in /opt/claude-code, despite a foreign D-Bus address,
          with every folder trusted (CLAUDE_CODE_SANDBOXED) and the first-run setup done, and Claude found its
          policy and instructions in /etc/claude-code and could not change them.

    # converge.yml deploys Claude Code with both skills on and a maximum of 7 wake-ups.
    - name: Compute what claude_code_skills hands every target with both skills on, as the deploy had them
      ansible.builtin.include_role:
        name: aslib.infra.claude_code_skills
      vars:
        claude_code_skills_qa: true
        claude_code_skills_loop_to_delivery: true
        claude_code_skills_loop_to_delivery_max_wakes: 7

    - name: Check claude_code_skills handed over its files and its policy
      ansible.builtin.assert:
        that:
          - claude_code_skills_files is defined
          - claude_code_skills_policy is defined
        fail_msg: aslib.infra.claude_code_skills handed over no files or no policy.
        quiet: true

    - name: Note the files and the policy of claude_code_skills
      ansible.builtin.set_fact:
        __node_deploy_test_skill_files: "{{ claude_code_skills_files }}"
        __node_deploy_test_skills_policy: "{{ claude_code_skills_policy }}"

    - name: Look up the collection's files
      ansible.builtin.stat:
        path: "{{ item.src }}"
      loop: "{{ __node_deploy_test_skill_files }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      register: __node_deploy_test_skill_sources

    - name: Find everything in config/, which the container has as /etc/claude-code
      ansible.builtin.find:
        paths: /opt/claude-code/config
        file_type: any
        recurse: true
        hidden: true
      register: __node_deploy_test_config

    - name: List /etc/claude-code's files in Claude Code's container, with their checksums
      ansible.builtin.command:
        argv:
          - runuser
          - --user=claude-code
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_claude_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_claude_uid }}/bus
          - podman
          - exec
          - --workdir=/etc/claude-code/
          - claude-code
          - sh
          - -c
          - find . -type f | sort | xargs sha1sum
        chdir: /
      register: __node_deploy_test_skills_inside
      changed_when: false

    - name: Check config/ holds exactly the policy, the instructions and both skills' files, as the policy is owned and moded
      vars:
        __node_deploy_test_found: >-
          {{ __node_deploy_test_config.files | map(attribute='path') | map('relpath', '/opt/claude-code/config') | list }}
        __node_deploy_test_names: "{{ __node_deploy_test_skill_files | map(attribute='name') | list }}"
        __node_deploy_test_policy_file: >-
          {{ __node_deploy_test_config.files | selectattr('path', 'eq', '/opt/claude-code/config/managed-settings.json') | first }}
        __node_deploy_test_installed: >-
          {{ __node_deploy_test_config.files | selectattr('path', 'search', '/config/[.]claude/.+[.](md|py)$') | list }}
        __node_deploy_test_folders: "{{ __node_deploy_test_config.files | selectattr('isdir') | list }}"
        __node_deploy_test_inside: >-
          {{ __node_deploy_test_skills_inside.stdout_lines | map('split') | map('reverse') | map('join', ' ') | list }}
        __node_deploy_test_expected_inside: >-
          {{ (__node_deploy_test_names | map('regex_replace', '^', './') | list)
             | zip(__node_deploy_test_skill_sources.results | map(attribute='stat.checksum'))
             | map('join', ' ') | list }}
      ansible.builtin.assert:
        that:
          - __node_deploy_test_names | length == 9
          - >-
            __node_deploy_test_found | sort
            == (['CLAUDE.md', 'managed-settings.json', '.claude', '.claude/agents', '.claude/skills', '.claude/skills/qa',
                 '.claude/skills/loop-to-delivery'] + __node_deploy_test_names) | sort
          - __node_deploy_test_installed | length == 9
          - __node_deploy_test_installed | map(attribute='pw_name') | unique == [__node_deploy_test_policy_file.pw_name]
          - __node_deploy_test_installed | map(attribute='mode') | unique == [__node_deploy_test_policy_file.mode]
          - __node_deploy_test_folders | map(attribute='pw_name') | unique == ['claude-code']
          - __node_deploy_test_inside is superset(__node_deploy_test_expected_inside)
          - __node_deploy_test_inside | length == __node_deploy_test_expected_inside | length + 2
        fail_msg: >-
          config/: {{ __node_deploy_test_config.files | map(attribute='path') | list }};
          in the container: {{ __node_deploy_test_skills_inside.stdout_lines }}
        success_msg: >-
          PASSED claude_code_podman installed claude_code_skills' qa skill (SKILL.md, protocol.md), its five experts and
          loop-to-delivery (SKILL.md, loop_to_delivery.py) in config/.claude/, {{ __node_deploy_test_policy_file.pw_name }}'s
          and {{ __node_deploy_test_policy_file.mode }} like the policy, in folders of the account; the container finds
          exactly these, the policy and the instructions in /etc/claude-code, each the same as the collection's.

    - name: Read the policy the deploy with both skills installed
      ansible.builtin.slurp:
        src: /opt/claude-code/config/managed-settings.json
      register: __node_deploy_test_policy_on

    # Neither the container's part nor this project's has hooks: the policy's
    # hooks are exactly claude_code_skills'.
    - name: Check the installed policy runs loop-to-delivery's program at each of its three events, with the deploy's maximum
      vars:
        __node_deploy_test_installed_on: "{{ __node_deploy_test_policy_on.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - __node_deploy_test_installed_on.hooks is defined
          - __node_deploy_test_installed_on.hooks == __node_deploy_test_skills_policy.hooks
          - __node_deploy_test_installed_on.hooks.keys() | sort == ['Stop', 'StopFailure', 'UserPromptSubmit']
          - >-
            __node_deploy_test_installed_on.hooks.values() | map('first') | map(attribute='hooks') | map('first')
            | map(attribute='command') | select('search', ' hook --max-wakes 7$') | list | length == 3
          # Claude could edit it with Bash anyway: a deny it can route around is no boundary.
          - "'Edit(//etc/claude-code/**)' not in __node_deploy_test_installed_on.permissions.deny"
        fail_msg: "The installed policy: {{ __node_deploy_test_installed_on | to_json }}"
        success_msg: >-
          PASSED the installed policy merges claude_code_skills' hooks: UserPromptSubmit, Stop and StopFailure run
          loop_to_delivery.py with the deploy's maximum of 7, and no deny rule for /etc/claude-code, which Claude could
          route around.

    # The installed program and hook command, outside the container: the policy's
    # /etc/claude-code is /opt/claude-code/config on the server, whose python3
    # (RHEL 9: 3.9) is the image's too. State goes to a temporary home.
    - name: Make a home for loop-to-delivery's state
      ansible.builtin.tempfile:
        state: directory
        prefix: node_deploy_test_loop_
      register: __node_deploy_test_loop_home

    - name: Write the notes of a loop
      ansible.builtin.copy:
        content: "# Goal\nDone when the test passes.\n"
        dest: "{{ __node_deploy_test_loop_home.path }}/notes.md"
        mode: "0600"

    - name: Note the installed program and the installed hook command, as the server reaches them
      ansible.builtin.set_fact:
        __node_deploy_test_loop_program: /opt/claude-code/config/.claude/skills/loop-to-delivery/loop_to_delivery.py
        __node_deploy_test_loop_session: cccccccc-3333-4333-8333-333333333333
        __node_deploy_test_loop_command: >-
          {{ ((__node_deploy_test_policy_on.content | b64decode | from_json).hooks.UserPromptSubmit[0].hooks[0].command
              | default('false'))
             | replace('/etc/claude-code/', '/opt/claude-code/config/') }}

    - name: Run the installed hook command for a prompt of a conversation without a loop
      ansible.builtin.command:
        argv: [sh, -c, "{{ __node_deploy_test_loop_command }}"]
        stdin: >-
          {{ {'session_id': __node_deploy_test_loop_session, 'prompt_id': 'p-1', 'hook_event_name': 'UserPromptSubmit',
              'prompt': 'Hello'} | to_json }}
        chdir: /
      environment:
        HOME: "{{ __node_deploy_test_loop_home.path }}"
      register: __node_deploy_test_loop_unknown
      changed_when: false
      failed_when: false

    - name: Start a loop with the installed program, as Claude does in that conversation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - "{{ __node_deploy_test_loop_program }}"
          - start
          - --session
          - "{{ __node_deploy_test_loop_session }}"
          - --notes
          - "{{ __node_deploy_test_loop_home.path }}/notes.md"
        chdir: /
      environment:
        HOME: "{{ __node_deploy_test_loop_home.path }}"
      register: __node_deploy_test_loop_start
      changed_when: false
      failed_when: false

    - name: Run the installed hook command for the wake-up job start printed, in that conversation
      ansible.builtin.command:
        argv: [sh, -c, "{{ __node_deploy_test_loop_command }}"]
        stdin: >-
          {{ {'session_id': __node_deploy_test_loop_session, 'prompt_id': 'p-2', 'hook_event_name': 'UserPromptSubmit',
              'prompt': (__node_deploy_test_loop_start.stdout_lines[-1] | regex_replace('^CronCreate ', '') | from_json).prompt}
             | to_json }}
        chdir: /
      environment:
        HOME: "{{ __node_deploy_test_loop_home.path }}"
      register: __node_deploy_test_loop_wake
      changed_when: false
      failed_when: false
      when: __node_deploy_test_loop_start.rc == 0 and __node_deploy_test_loop_start.stdout_lines[-1] is match('CronCreate [{]')

    - name: Look up the test server's python3
      ansible.builtin.command:
        argv: [/usr/bin/python3, --version]
      register: __node_deploy_test_loop_python
      changed_when: false

    - name: Remove loop-to-delivery's home
      ansible.builtin.file:
        path: "{{ __node_deploy_test_loop_home.path }}"
        state: absent

    - name: Check the installed program passed the prompt and let the wake-up through as wake-up 1 of the deploy's maximum
      vars:
        __node_deploy_test_loop_context: >-
          {{ (__node_deploy_test_loop_wake.stdout | from_json).hookSpecificOutput.additionalContext
             if __node_deploy_test_loop_wake.stdout | default('') is match('[{]') else '' }}
      ansible.builtin.assert:
        that:
          - __node_deploy_test_loop_unknown.rc == 0
          - __node_deploy_test_loop_unknown.stdout == ''
          - __node_deploy_test_loop_start.rc == 0
          - __node_deploy_test_loop_wake.rc | default(1) == 0
          - >-
            __node_deploy_test_loop_context is match('loop-to-delivery: wake-up 1 of 7 of loop [0-9a-f]{8}')
        fail_msg: >-
          A prompt: rc {{ __node_deploy_test_loop_unknown.rc }} {{ __node_deploy_test_loop_unknown.stdout }}
          {{ __node_deploy_test_loop_unknown.stderr }}; start: rc {{ __node_deploy_test_loop_start.rc }}
          {{ __node_deploy_test_loop_start.stdout }} {{ __node_deploy_test_loop_start.stderr }}; the wake-up:
          {{ __node_deploy_test_loop_wake.stdout | default('not run') }} {{ __node_deploy_test_loop_wake.stderr | default('') }}
        success_msg: >-
          PASSED with the test server's {{ __node_deploy_test_loop_python.stdout }}, the installed hook command passed
          a prompt of a conversation without a loop with no output, and let the job's wake-up of a loop started in
          that conversation through as "{{ __node_deploy_test_loop_context[:60] }}".

    - name: Check a file reaches the group only with the group's access, and the README matches its read-only checksum
      ansible.builtin.assert:
        that:
          - >-
            __node_deploy_test_claude_checks.stdout_lines
            == ['shared', 'unreadable', '/opt/containers/shared/README.md: OK', 'read-only']
        fail_msg: "Claude Code's container: {{ __node_deploy_test_claude_checks.stdout_lines }} {{ __node_deploy_test_claude_checks.stderr }}"
        success_msg: >-
          PASSED shared zone: Claude Code could not read a file the Node.js service wrote with a private mode (0600), and
          read the one it gave the group's access before the rename; the zone's README matched the checksum in
          /opt/containers/shared-checksums, which the container could not change.

    # The zone is the group's, so a service can rename its own file over the README.
    - name: Replace the zone's README from the Node.js service's container
      ansible.builtin.command:
        argv:
          - runuser
          - --user=deploy-test-app
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_uid }}/bus
          - podman
          - exec
          - deploy-test-app
          - sh
          - -c
          - >-
            printf '# Other rules\n' > /opt/containers/shared/from-node/README.tmp
            && mv /opt/containers/shared/from-node/README.tmp /opt/containers/shared/README.md
        chdir: /
      changed_when: true

    - name: Check the README against its checksum from Claude Code's container
      ansible.builtin.command:
        argv:
          - runuser
          - --user=claude-code
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_claude_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_claude_uid }}/bus
          - podman
          - exec
          - claude-code
          - sh
          - -c
          - sha256sum --check --status /opt/containers/shared-checksums/README.md.sha256 && echo intact || echo replaced
        chdir: /
      register: __node_deploy_test_replaced
      changed_when: false

    - name: Run podman_service's verify for Claude Code, which must report the replaced README
      block:
        - name: Run podman_service's verify for Claude Code
          ansible.builtin.include_role:
            name: aslib.infra.podman_service
            tasks_from: verify
          vars:
            podman_service_name: claude-code
            podman_service_port: 0

        - name: Note that verify passed
          ansible.builtin.set_fact:
            __node_deploy_test_verify_said: passed
      rescue:
        - name: Note what verify reported
          ansible.builtin.set_fact:
            __node_deploy_test_verify_said: "{{ ansible_failed_result.msg | default('') }}"

    # claude_code_settings_permission_mode replaced it in 0.7.0.
    - name: Deploy Claude Code with claude_code_bypass_permissions, as a project from before 0.7.0 does
      block:
        - name: Deploy Claude Code with claude_code_bypass_permissions
          ansible.builtin.include_role:
            name: aslib.infra.claude_code_podman
          vars:
            claude_code_bypass_permissions: true

        - name: Fail, as the deploy went ahead
          ansible.builtin.fail:
            msg: claude_code_podman deployed with claude_code_bypass_permissions set.
      rescue:
        - name: Check the deploy stopped, naming the setting that replaced it
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name is search('Stop at settings of before 0[.]7[.]0')
              - ansible_failed_result.msg is search('claude_code_bypass_permissions')
              - ansible_failed_result.msg is search('claude_code_settings_permission_mode')
            fail_msg: "{{ ansible_failed_result.msg | default(ansible_failed_result) }}"
            success_msg: >-
              PASSED claude_code_podman stops a deploy that sets claude_code_bypass_permissions, naming
              claude_code_settings_permission_mode.

    # claude_code_skills_qa replaced it after 0.8.0; a 0.8.0 project's settings
    # have it, false by default, which stops a deploy too.
    - name: Look up the installed policy before a deploy that sets claude_code_settings_qa
      ansible.builtin.stat:
        path: /opt/claude-code/config/managed-settings.json
      register: __node_deploy_test_before_rename

    - name: Deploy Claude Code with claude_code_settings_qa, as a 0.8.0 project does
      block:
        - name: Deploy Claude Code with claude_code_settings_qa
          ansible.builtin.include_role:
            name: aslib.infra.claude_code_podman
          vars:
            podman_service_uid: ""
            claude_code_settings_qa: false

        - name: Fail, as the deploy went ahead
          ansible.builtin.fail:
            msg: claude_code_podman deployed with claude_code_settings_qa set.
      rescue:
        - name: Note what stopped the deploy
          ansible.builtin.set_fact:
            __node_deploy_test_rename_task: "{{ ansible_failed_task.name }}"
            __node_deploy_test_rename_msg: "{{ ansible_failed_result.msg | default(ansible_failed_result) }}"

        - name: Look up the installed policy after the stopped deploy
          ansible.builtin.stat:
            path: /opt/claude-code/config/managed-settings.json
          register: __node_deploy_test_after_rename

        - name: Check the deploy stopped before changing anything, naming the new name and the steps in order
          ansible.builtin.assert:
            that:
              - __node_deploy_test_rename_task != 'Fail, as the deploy went ahead'
              - __node_deploy_test_rename_msg is search('claude_code_skills_qa')
              - __node_deploy_test_rename_msg is search('update-playbooks[.]yml.*project[.]yml')
              - __node_deploy_test_after_rename.stat.checksum == __node_deploy_test_before_rename.stat.checksum
            fail_msg: "{{ __node_deploy_test_rename_task }}: {{ __node_deploy_test_rename_msg }}"
            success_msg: >-
              PASSED claude_code_podman stops a deploy that sets claude_code_settings_qa before changing the policy,
              naming claude_code_skills_qa, update-playbooks.yml and then project.yml.

    # Every deploy writes the README again, as this one does.
    - name: Deploy Claude Code again, with every setting of claude_code_settings changed and both skills off
      ansible.builtin.include_role:
        name: aslib.infra.claude_code_podman
      vars: &node_deploy_test_settings
        podman_service_uid: ""
        claude_code_settings_permission_mode: acceptEdits
        claude_code_settings_model: sonnet
        claude_code_settings_effort: high
        claude_code_settings_theme: light
        claude_code_settings_agent_teams: "true"   # as -e passes it
        claude_code_settings_ultracode: true
        claude_code_skills_qa: false
        claude_code_skills_loop_to_delivery: false

    - name: Check the README against its checksum again
      ansible.builtin.command:
        argv:
          - runuser
          - --user=claude-code
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_claude_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_claude_uid }}/bus
          - podman
          - exec
          - claude-code
          - sh
          - -c
          - sha256sum --check --status /opt/containers/shared-checksums/README.md.sha256 && echo intact || echo replaced
        chdir: /
      register: __node_deploy_test_restored
      changed_when: false

    - name: Check the replaced README was caught, and the deploy put it back
      ansible.builtin.assert:
        that:
          - __node_deploy_test_replaced.stdout == 'replaced'
          - __node_deploy_test_verify_said is search('README[.]md in the shared zone was changed or replaced')
          - __node_deploy_test_restored.stdout == 'intact'
        fail_msg: >-
          After the replacement, Claude Code's check: {{ __node_deploy_test_replaced.stdout }}, podman_service's
          verify: {{ __node_deploy_test_verify_said }}; after the deploy: {{ __node_deploy_test_restored.stdout }}.
        success_msg: >-
          PASSED shared zone: once a service replaced the README, Claude Code's check against the checksum failed and
          podman_service's verify reported it; the next deploy wrote it again, and the check passed.

    - name: Read the policy the deploy installed
      ansible.builtin.slurp:
        src: /opt/claude-code/config/managed-settings.json
      register: __node_deploy_test_policy

    - name: Find everything in config/ after the deploy without the skills
      ansible.builtin.find:
        paths: /opt/claude-code/config
        file_type: any
        recurse: true
        hidden: true
      register: __node_deploy_test_config_after

    - name: Check that deploy took both skills, the experts, their folders and the hooks out
      ansible.builtin.assert:
        that:
          - >-
            __node_deploy_test_config_after.files | map(attribute='path') | map('basename') | sort
            == ['CLAUDE.md', 'managed-settings.json']
          - "'hooks' not in (__node_deploy_test_policy.content | b64decode | from_json)"
        fail_msg: >-
          config/: {{ __node_deploy_test_config_after.files | map(attribute='path') | list }};
          policy: {{ __node_deploy_test_policy.content | b64decode }}
        success_msg: >-
          PASSED a deploy with both skills off removed the qa skill, its five experts, loop-to-delivery and their
          folders from config/, and the hooks from the policy, leaving the policy and the instructions.

    - name: Compute what claude_code_settings hands every target, with the same settings
      ansible.builtin.include_role:
        name: aslib.infra.claude_code_settings
      vars: *node_deploy_test_settings

    # claude_code_settings' base, then the container's own part, then the
    # project's (which wins): lists combine without duplicates.
    - name: Check the installed policy holds each setting, and merges the base, the container's part and the project's
      vars:
        __node_deploy_test_installed: "{{ __node_deploy_test_policy.content | b64decode | from_json }}"
        __node_deploy_test_roles: "{{ playbook_dir }}/../../.."
        __node_deploy_test_base: "{{ claude_code_settings_policy }}"
        __node_deploy_test_container: >-
          {{ lookup('file', __node_deploy_test_roles ~ '/claude_code_podman/files/managed-settings.container.json') | from_json }}
        __node_deploy_test_base_rest: >-
          {{ __node_deploy_test_base | dict2items | rejectattr('key', 'in', ['permissions', 'plansDirectory']) | items2dict }}
        __node_deploy_test_deny: "{{ __node_deploy_test_installed.permissions.deny }}"
      ansible.builtin.assert:
        that:
          - __node_deploy_test_installed.permissions.defaultMode == 'acceptEdits'
          - __node_deploy_test_installed.model == 'sonnet'
          - __node_deploy_test_installed.effortLevel == 'high'
          - __node_deploy_test_installed.theme == 'light'
          - __node_deploy_test_installed.env.CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS == '1'
          - __node_deploy_test_installed.ultracode is true
          - __node_deploy_test_installed.skipDangerousModePermissionPrompt is true
          - __node_deploy_test_installed | combine(__node_deploy_test_base_rest) == __node_deploy_test_installed
          - __node_deploy_test_installed.permissions.defaultMode == __node_deploy_test_base.permissions.defaultMode
          - __node_deploy_test_installed.permissions.additionalDirectories == ['/']
          - __node_deploy_test_installed.plansDirectory == './project-plans'
          - __node_deploy_test_installed.autoMemoryDirectory == __node_deploy_test_container.autoMemoryDirectory
          - >-
            __node_deploy_test_deny is superset(__node_deploy_test_base.permissions.deny
            + __node_deploy_test_container.permissions.deny + ['Read(//opt/claude-code/data/private/**)'])
          - __node_deploy_test_deny | length == __node_deploy_test_deny | unique | length
        fail_msg: "The installed policy: {{ __node_deploy_test_installed | to_json }}"
        success_msg: >-
          PASSED claude_code_podman installed each setting of claude_code_settings (acceptEdits, sonnet, high
          effort, the light theme, agent teams and ultracode on) as claude_code_settings hands them to every target,
          with the container's part and the project's ({{ __node_deploy_test_deny | length }} deny rules, none
          twice; the project's plansDirectory over the base's).

- name: Check the overview shows both services, and the log of a service that does not run
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  vars:
    __node_deploy_test_systemctl:
      - runuser
      - --user=deploy-test-app
      - --
      - env
      - XDG_RUNTIME_DIR=/run/user/3001
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/3001/bus
      - systemctl
      - --user
  tasks:
    - name: Run podman_overview
      ansible.builtin.include_role:
        name: aslib.infra.podman_overview

    - name: Note the overview of the running service, and what it showed root
      ansible.builtin.set_fact:
        __node_deploy_test_running: "{{ podman_overview_services }}"
        __node_deploy_test_report: "{{ __podman_overview_report }}"

    - name: Stop the service
      ansible.builtin.command:
        argv: "{{ __node_deploy_test_systemctl + ['stop', 'deploy-test-app.service'] }}"
        chdir: /
      changed_when: true

    - name: Run podman_overview with the service stopped
      ansible.builtin.include_role:
        name: aslib.infra.podman_overview

    - name: Start the service again
      ansible.builtin.command:
        argv: "{{ __node_deploy_test_systemctl + ['start', 'deploy-test-app.service'] }}"
        chdir: /
      changed_when: true

    - name: Wait until the service answers again
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_back
      until: __node_deploy_test_back is succeeded
      retries: 30
      delay: 2

    - name: Check the overview showed both services, then the Node.js one's state and log once stopped
      vars:
        __node_deploy_test_node: "{{ __node_deploy_test_running | selectattr('name', 'equalto', 'deploy-test-app') | first }}"
        __node_deploy_test_claude: "{{ __node_deploy_test_running | selectattr('name', 'equalto', 'claude-code') | first }}"
        __node_deploy_test_stopped: "{{ podman_overview_services | selectattr('name', 'equalto', 'deploy-test-app') | first }}"
        __node_deploy_test_still: "{{ podman_overview_services | selectattr('name', 'equalto', 'claude-code') | first }}"
      ansible.builtin.assert:
        that:
          - __node_deploy_test_running | map(attribute='name') | sort == ['claude-code', 'deploy-test-app']
          - __node_deploy_test_node.account == 'deploy-test-app'
          - __node_deploy_test_node.uid == '3001'
          - __node_deploy_test_node.state == 'active'
          - __node_deploy_test_node.substate == 'running'
          - __node_deploy_test_node.image == 'localhost/deploy-test-app:1.0.0'
          - __node_deploy_test_node.ports == ['127.0.0.1:3009:3000']
          - __node_deploy_test_node.log == []
          - __node_deploy_test_node.log_command == 'sudo journalctl _SYSTEMD_USER_UNIT=deploy-test-app.service -f'
          - "__node_deploy_test_report is contains('  log: sudo journalctl _SYSTEMD_USER_UNIT=claude-code.service -f')"
          - __node_deploy_test_claude.account == 'claude-code'
          - __node_deploy_test_claude.state == 'active'
          - __node_deploy_test_claude.image == 'localhost/claude-code:0.0.1'
          - __node_deploy_test_claude.ports == []
          - __node_deploy_test_stopped.state != 'active'
          - __node_deploy_test_stopped.log is search('deploy-test-app 1.0.0 listens')
          - __node_deploy_test_still.state == 'active'
        success_msg: >-
          PASSED podman_overview: it showed deploy-test-app running as its account (UID 3001), with its image,
          port and log command, and claude-code without a port; then deploy-test-app {{ __node_deploy_test_stopped.state }} once
          stopped, with the app's log lines, and claude-code still running.

- name: Build a new version of the test project, as a developer would
  hosts: localhost
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Raise the version in package.json to 1.0.1
      ansible.builtin.replace:
        path: "{{ node_deploy_test_project }}/package.json"
        regexp: '"version": "1\.0\.0"'
        replace: '"version": "1.0.1"'

    - name: Change a config file
      ansible.builtin.copy:
        content: '{ "source": "config/production, changed" }'
        dest: "{{ node_deploy_test_project }}/config/production/app.json"
        mode: "0644"

    - name: Remove a config file
      ansible.builtin.file:
        path: "{{ node_deploy_test_project }}/config/production/old.json"
        state: absent

    - name: Run node_image
      ansible.builtin.include_role:
        name: aslib.infra.node_image
      vars:
        node_image_source: "{{ node_deploy_test_project }}"
        node_image_output_dir: "{{ node_deploy_test_project }}/ansible/images"
        node_image_npmrc: ""

    - name: List the project's images on the build machine
      ansible.builtin.command:
        argv: [podman, images, --filter=label=org.opencontainers.image.title=deploy-test-app, "--format={% raw %}{{.Repository}}:{{.Tag}}{% endraw %}"]
      register: __node_deploy_test_built
      changed_when: false

    - name: Check the build machine keeps only the new image and its build stage
      ansible.builtin.assert:
        that: __node_deploy_test_built.stdout_lines | sort == ['localhost/deploy-test-app:1.0.1', 'localhost/deploy-test-app:build']
        success_msg: PASSED node_image keeps deploy-test-app:1.0.1 and its build stage, and removed the images of 1.0.0.

- name: Check a deploy of the new version replaces the old one and keeps the data
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Query the service before the update
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_old

    - name: Note when Claude Code's container started, before the update
      ansible.builtin.command:
        argv: &node_deploy_test_claude_inspect
          - runuser
          - --user=claude-code
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_test_claude_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __node_deploy_test_claude_uid }}/bus
          - podman
          - inspect
          - --format=json
          - claude-code
        chdir: /
      register: __node_deploy_test_claude_before
      changed_when: false

    - name: Run node_deploy with the new version
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy

    - name: Query the updated service
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_new

    - name: Find the service's image archives
      ansible.builtin.find:
        paths: /opt/containers/images/deploy-test-app
      register: __node_deploy_test_archives

    - name: Find the service's config files
      ansible.builtin.find:
        paths: /opt/deploy-test-app/config
      register: __node_deploy_test_config

    - name: List the account's images
      ansible.builtin.command:
        argv:
          - runuser
          - --user=deploy-test-app
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/3001
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/3001/bus
          - podman
          - images
          - --format={% raw %}{{.Repository}}:{{.Tag}}{% endraw %}
        chdir: /
      register: __node_deploy_test_images
      changed_when: false

    - name: Note when Claude Code's container started, after the update
      ansible.builtin.command:
        argv: *node_deploy_test_claude_inspect
        chdir: /
      register: __node_deploy_test_claude_after
      changed_when: false

    - name: Check the new version runs with the old data and the new config, and only the new version is left
      ansible.builtin.assert:
        that:
          - (__node_deploy_test_claude_after.stdout | from_json)[0].State.StartedAt
            == (__node_deploy_test_claude_before.stdout | from_json)[0].State.StartedAt
          - __node_deploy_test_new.json.version == '1.0.1'
          - __node_deploy_test_new.json.config == 'config/production, changed'
          - __node_deploy_test_config.files | map(attribute='path') | list == ['/opt/deploy-test-app/config/app.json']
          - __node_deploy_test_new.json.starts > __node_deploy_test_old.json.starts
          - __node_deploy_test_archives.files | map(attribute='path') | list == ['/opt/containers/images/deploy-test-app/deploy-test-app-1.0.1.tar']
          - __node_deploy_test_images.stdout_lines == ['localhost/deploy-test-app:1.0.1']
        success_msg: >-
          PASSED node_deploy update: version 1.0.1 answers with the data of 1.0.0 (start count
          {{ __node_deploy_test_new.json.starts }}) and the changed config file; the removed config file,
          the archive and the image of 1.0.0 are gone; Claude Code's container kept running throughout.

- name: Check the restart of both services, which waits until each is ready
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Query the Node.js service before the restart
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_before_restart

    - name: Note when Claude Code's container started, before the restart
      ansible.builtin.command:
        argv: *node_deploy_test_claude_inspect
        chdir: /
      register: __node_deploy_test_claude_started
      changed_when: false

    - name: Restart the Node.js service, as restart.yml does
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
        tasks_from: restart

    - name: Restart Claude Code, as its restart.yml does
      ansible.builtin.include_role:
        name: aslib.infra.claude_code_podman
        tasks_from: restart

    # Right away: the restart only returns once the service answers.
    - name: Query the Node.js service after the restart
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_after_restart

    - name: Note when Claude Code's container started, after the restart
      ansible.builtin.command:
        argv: *node_deploy_test_claude_inspect
        chdir: /
      register: __node_deploy_test_claude_restarted
      changed_when: false

    - name: Check both services started again, and the Node.js one answered once its restart returned
      ansible.builtin.assert:
        that:
          - __node_deploy_test_after_restart.json.starts == __node_deploy_test_before_restart.json.starts + 1
          - (__node_deploy_test_claude_restarted.stdout | from_json)[0].State.StartedAt
            != (__node_deploy_test_claude_started.stdout | from_json)[0].State.StartedAt
          - (__node_deploy_test_claude_restarted.stdout | from_json)[0].State.Running
        success_msg: >-
          PASSED restart: node_deploy's restarted the Node.js service and returned once it answered (start count
          {{ __node_deploy_test_after_restart.json.starts }}); claude_code_podman's started a new container that runs.

- name: Check the services keep what their deploy promised, and Podman restarts an unhealthy one
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  vars:
    __node_deploy_test_unhealthy: /opt/deploy-test-app/data/unhealthy
    __node_deploy_test_systemctl:
      - runuser
      - --user=deploy-test-app
      - --
      - env
      - XDG_RUNTIME_DIR=/run/user/3001
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/3001/bus
      - systemctl
      - --user
  tasks:
    - name: Check the Node.js service, as podman_service's entry point verify does
      ansible.builtin.include_role:
        name: aslib.infra.podman_service
        tasks_from: verify
      vars:
        podman_service_name: deploy-test-app

    - name: Check Claude Code's service, which has no port
      ansible.builtin.include_role:
        name: aslib.infra.podman_service
        tasks_from: verify
      vars:
        podman_service_name: claude-code
        podman_service_port: 0

    - name: Look up Claude Code's account
      ansible.builtin.getent:
        database: passwd
        key: claude-code

    - name: Read both Quadlet files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/containers/systemd/users/3001/deploy-test-app.container
        - /etc/containers/systemd/users/{{ ansible_facts.getent_passwd['claude-code'][1] }}/claude-code.container
      register: __node_deploy_test_quadlets

    # As the kernel enforces it: Claude Code's at most 4g (claude_code_podman_memory's
    # default), the Node.js service's unlimited (node_deploy_memory's).
    - name: Read each container's memory limit
      ansible.builtin.command:
        argv:
          - runuser
          - --user={{ item.account }}
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/{{ item.uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ item.uid }}/bus
          - podman
          - exec
          - "{{ item.account }}"
          - cat
          - /sys/fs/cgroup/memory.max
        chdir: /
      loop:
        - { account: deploy-test-app, uid: 3001 }
        - { account: claude-code, uid: "{{ ansible_facts.getent_passwd['claude-code'][1] }}" }
      register: __node_deploy_test_memory
      changed_when: false
      failed_when: false

    - name: Count systemd's restarts of the Node.js service so far
      ansible.builtin.command:
        argv: "{{ __node_deploy_test_systemctl + ['show', '--property=NRestarts', '--value', 'deploy-test-app.service'] }}"
        chdir: /
      register: __node_deploy_test_restarts_before
      changed_when: false

    - name: Query the Node.js service before it turns unhealthy
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_healthy

    - name: Make the app answer with a server error, as a broken app would
      ansible.builtin.copy:
        content: ""
        dest: "{{ __node_deploy_test_unhealthy }}"
        mode: "0644"

    # 3 failed checks, one every 30 seconds, then systemd's 10 seconds.
    - name: Wait until Podman stopped it and systemd started it again
      ansible.builtin.slurp:
        src: /opt/deploy-test-app/data/starts
      register: __node_deploy_test_starts
      until: (__node_deploy_test_starts.content | b64decode | int) > __node_deploy_test_healthy.json.starts
      retries: 60
      delay: 5

    - name: Count systemd's restarts again
      ansible.builtin.command:
        argv: "{{ __node_deploy_test_systemctl + ['show', '--property=NRestarts', '--value', 'deploy-test-app.service'] }}"
        chdir: /
      register: __node_deploy_test_restarts_after
      changed_when: false

    - name: Read the service's log
      ansible.builtin.command: journalctl --no-pager _SYSTEMD_USER_UNIT=deploy-test-app.service
      register: __node_deploy_test_health_log
      changed_when: false

    - name: Let the app answer normally again
      ansible.builtin.file:
        path: "{{ __node_deploy_test_unhealthy }}"
        state: absent

    # systemd counts it as started once its health check passed again.
    - name: Wait until systemd counts the service as started again
      ansible.builtin.command:
        argv: "{{ __node_deploy_test_systemctl + ['is-active', 'deploy-test-app.service'] }}"
        chdir: /
      register: __node_deploy_test_active
      until: __node_deploy_test_active.stdout == 'active'
      retries: 30
      delay: 2
      changed_when: false
      failed_when: false

    - name: Query the service again
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_recovered

    - name: Check the Node.js service is healthy again
      ansible.builtin.include_role:
        name: aslib.infra.podman_service
        tasks_from: verify
      vars:
        podman_service_name: deploy-test-app

    - name: Check the Node.js service has a health check that restarted it, and Claude Code none
      vars:
        __node_deploy_test_node_quadlet: "{{ __node_deploy_test_quadlets.results[0].content | b64decode }}"
        __node_deploy_test_claude_quadlet: "{{ __node_deploy_test_quadlets.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - __node_deploy_test_node_quadlet is search('^HealthCmd=node -e ', multiline=True)
          - __node_deploy_test_node_quadlet is search('^Notify=healthy$', multiline=True)
          - __node_deploy_test_node_quadlet is search('^HealthOnFailure=kill$', multiline=True)
          - __node_deploy_test_claude_quadlet is not search('^HealthCmd=', multiline=True)
          - __node_deploy_test_restarts_after.stdout | int > __node_deploy_test_restarts_before.stdout | int
          - __node_deploy_test_recovered.json.starts > __node_deploy_test_healthy.json.starts
        fail_msg: "The service's log: {{ __node_deploy_test_health_log.stdout_lines[-15:] }}"
        success_msg: >-
          PASSED health checks: both services passed podman_service's verify; once the Node.js app answered with a
          server error, Podman stopped it and systemd started it again ({{ __node_deploy_test_restarts_after.stdout }}
          restarts, start count
          {{ __node_deploy_test_healthy.json.starts }} to {{ __node_deploy_test_recovered.json.starts }}), healthy
          again once the app was; Claude Code has no health check.

    - name: Check Claude Code's container has at most 4g of memory, and the Node.js service's no limit
      vars:
        __node_deploy_test_node_quadlet: "{{ __node_deploy_test_quadlets.results[0].content | b64decode }}"
        __node_deploy_test_claude_quadlet: "{{ __node_deploy_test_quadlets.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - __node_deploy_test_node_quadlet is not search('--memory', multiline=True)
          - __node_deploy_test_claude_quadlet is search('^PodmanArgs=--memory=4g$', multiline=True)
          - __node_deploy_test_memory.results | map(attribute='stdout') | list == ['max', '4294967296']
        fail_msg: >-
          memory.max of the Node.js service and of Claude Code:
          {{ __node_deploy_test_memory.results | map(attribute='stdout') | list }}
          {{ __node_deploy_test_memory.results | map(attribute='stderr') | list }}
        success_msg: >-
          PASSED memory limits: the kernel holds Claude Code's container to 4 GiB (claude_code_podman_memory's default), and
          the Node.js service's container has no limit (node_deploy_memory's default).

- name: Check the removal takes away the service and keeps its directory as it is
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Remove the service
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
        tasks_from: remove

    - name: Remove it again, which must work on a clean server too
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
        tasks_from: remove

    - name: Run podman_overview after the removal
      ansible.builtin.include_role:
        name: aslib.infra.podman_overview

    - name: Look up the service's account
      ansible.builtin.getent:
        database: passwd
        key: deploy-test-app
        fail_key: false

    - name: Look for what the deploy created
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/containers/systemd/users/3001
        - /opt/containers/images/deploy-test-app
        - /home/deploy-test-app
        - /var/lib/systemd/linger/deploy-test-app
      register: __node_deploy_test_leftovers

    # What the app wrote, in data/ and at the top (like a .db file), and its config.
    - name: Look for what the service's directory holds
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/deploy-test-app/data/starts
        - /opt/deploy-test-app/app.state
        - /opt/deploy-test-app/config/app.json
      register: __node_deploy_test_kept

    - name: Query the service's port
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_gone
      failed_when: false

    - name: Check the account, the files and the service are gone, and the data is not
      ansible.builtin.assert:
        that:
          - podman_overview_services | map(attribute='name') | list == ['claude-code']
          - (podman_overview_services | first).state == 'active'
          - ansible_facts.getent_passwd['deploy-test-app'] is none
          - __node_deploy_test_leftovers.results | selectattr('stat.exists') | map(attribute='item') | list == []
          - __node_deploy_test_kept.results | rejectattr('stat.exists') | map(attribute='item') | list == []
          - __node_deploy_test_gone.status == -1
        success_msg: >-
          PASSED node_deploy remove: the account, its home directory, Quadlet directory, image archive and
          lingering are gone, nothing answers on port 3009 and podman_overview lists only claude-code, still
          running; /opt/deploy-test-app is as it was (data/, app.state, config/), and a second run works.

- name: Check a new deploy, as an account with another UID, takes over the data
  # Not 3002: claude-code, created after the account with 3001, took that one.
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    # Without the shared zone first, as a service deployed before it existed.
    - name: Run node_deploy with UID 3005, without the shared zone
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
      vars:
        podman_service_uid: "3005"
        podman_service_shared: false

    - name: Run node_deploy again with the shared zone, as an update would
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
      vars:
        podman_service_uid: "3005"

    - name: Query the service
      ansible.builtin.uri:
        url: http://127.0.0.1:3009/
      register: __node_deploy_test_again
      until: __node_deploy_test_again is succeeded
      retries: 30
      delay: 2

    - name: Write into the shared zone from the service's container
      ansible.builtin.command:
        argv:
          - runuser
          - --user=deploy-test-app
          - --
          - env
          - XDG_RUNTIME_DIR=/run/user/3005
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/3005/bus
          - podman
          - exec
          - deploy-test-app
          - touch
          - /opt/containers/shared/from-node/later.txt
        chdir: /
      changed_when: true

    - name: Inspect the data the earlier account wrote
      ansible.builtin.stat:
        path: /opt/deploy-test-app/data/starts
      register: __node_deploy_test_taken

    - name: Check the service continues with the data, now owned by the new account
      ansible.builtin.assert:
        that:
          - __node_deploy_test_again.json.starts > __node_deploy_test_new.json.starts
          - __node_deploy_test_taken.stat.uid == 3005
        success_msg: >-
          PASSED node_deploy took over the data of the removed account as UID 3005 (start count
          {{ __node_deploy_test_again.json.starts }}), and a running service that got the shared zone later can
          write to it.

- name: Check the removal with podman_service_remove_workdir takes the service's directory as well
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Remove the service with the setting's earlier name, podman_service_remove_data
      block:
        - name: Run node_deploy's removal with podman_service_remove_data
          ansible.builtin.include_role:
            name: aslib.infra.node_deploy
            tasks_from: remove
          vars:
            podman_service_remove_data: "true"

        - name: Fail, as the removal accepted the earlier name
          ansible.builtin.fail:
            msg: the removal accepted podman_service_remove_data
      rescue:
        - name: Note the message of the removal that stopped
          ansible.builtin.set_fact:
            __node_deploy_test_old_name: "{{ ansible_failed_result.msg }}"

    - name: Look for the service's directory after the removal that stopped
      ansible.builtin.stat:
        path: /opt/deploy-test-app
      register: __node_deploy_test_dir_kept

    - name: Remove the service and its directory
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy
        tasks_from: remove
      vars:
        podman_service_remove_workdir: "true"   # as -e podman_service_remove_workdir=true passes it

    - name: Look for the service's directory
      ansible.builtin.stat:
        path: /opt/deploy-test-app
      register: __node_deploy_test_dir

    - name: Check the earlier name stopped the removal, and the current one removed the directory
      ansible.builtin.assert:
        that:
          - __node_deploy_test_old_name is search('called podman_service_remove_workdir now')
          - __node_deploy_test_dir_kept.stat.exists
          - not __node_deploy_test_dir.stat.exists
        success_msg: >-
          PASSED podman_service remove stopped at podman_service_remove_data, naming podman_service_remove_workdir,
          which then removed /opt/deploy-test-app too.

- name: Check the deploy stops when the project still uses a setting's name from before 0.1.0
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Deploy with node_deploy_port, the earlier name of podman_service_port
      block:
        - name: Run node_deploy with node_deploy_port
          ansible.builtin.include_role:
            name: aslib.infra.node_deploy
          vars:
            node_deploy_port: 3009

        - name: Fail, as node_deploy accepted the earlier name
          ansible.builtin.fail:
            msg: node_deploy accepted node_deploy_port
      rescue:
        - name: Check it stopped and named the new setting
          ansible.builtin.assert:
            that: ansible_failed_result.msg is search('rename node_deploy_port to podman_service_port')
            success_msg: PASSED node_deploy stopped at node_deploy_port and named podman_service_port instead.

- name: Check the overview playbooks show this machine without an inventory, and every server with one
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create a directory for the inventories
      ansible.builtin.tempfile:
        state: directory
      register: __node_deploy_test_inventories

    - name: Write an empty inventory, as on a server without one, and one with two servers
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ __node_deploy_test_inventories.path }}/{{ item.name }}"
        mode: "0644"
      loop:
        - { name: empty.yml, content: "" }
        - { name: servers.yml, content: "all:\n  hosts:\n    web1:\n    web2:\n" }
      loop_control:
        label: "{{ item.name }}"

    - name: List the hosts the overview playbooks run on
      ansible.builtin.command:
        argv: [ansible-playbook, "{{ item.0 }}", --list-hosts, "--inventory={{ __node_deploy_test_inventories.path }}/{{ item.1 }}"]
      loop: "{{ ['aslib.infra.overview', 'aslib.infra.podman_overview'] | product(['empty.yml', 'servers.yml']) | list }}"
      register: __node_deploy_test_overview_hosts
      changed_when: false

    - name: Remove the inventories
      ansible.builtin.file:
        path: "{{ __node_deploy_test_inventories.path }}"
        state: absent

    - name: Check each overview runs on this machine without servers, and on the servers otherwise
      vars:
        __node_deploy_test_without: "{{ __node_deploy_test_overview_hosts.results[item * 2].stdout_lines | map('trim') | list }}"
        __node_deploy_test_with: "{{ __node_deploy_test_overview_hosts.results[item * 2 + 1].stdout_lines | map('trim') | list }}"
      ansible.builtin.assert:
        that:
          - __node_deploy_test_without is superset(['hosts (1):', 'localhost'])
          - __node_deploy_test_with is superset(['hosts (2):', 'web1', 'web2'])
          - "'localhost' not in __node_deploy_test_with"
        success_msg: >-
          PASSED {{ __node_deploy_test_overview_hosts.results[item * 2].item.0 }} shows this machine without an
          inventory, and only the servers with one.
      loop: [0, 1]

- name: Check the removal of Claude Code takes its service, account and command, and keeps its directory as it is
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Remove Claude Code
      ansible.builtin.include_role:
        name: aslib.infra.claude_code_podman
        tasks_from: remove

    - name: Look up Claude Code's account
      ansible.builtin.getent:
        database: passwd
        key: claude-code
        fail_key: false

    - name: Look for what the deploy created, and what must stay
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/sbin/claude-code
        - /opt/containers/images/claude-code
        - /opt/claude-code/config
        - /opt/claude-code
        - /opt/containers/shared/test.txt
      register: __node_deploy_test_claude_left

    - name: Check the service, account, archive and command are gone, and its directory and the shared zone stay
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd['claude-code'] is none
          - __node_deploy_test_claude_left.results | map(attribute='stat.exists') | list == [false, false, true, true, true]
        success_msg: >-
          PASSED claude_code_podman remove: the service, its account, archive and command are gone; /opt/claude-code,
          its config/ included, and the shared zone's files stay.
