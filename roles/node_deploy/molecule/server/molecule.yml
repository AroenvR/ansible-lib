---
# Sets up, builds and deploys a small test app (app/) the way a project would,
# on the RHEL 9 test server, together with a Claude Code project (with a stand-in
# for Claude Code), then restarts the server and checks both came back by
# themselves, with their data, side by side. This also tests podman_service and
# podman_overview. The services' own containers run inside the test server, hence
# the extra settings below.
scenario:
  name: server
platforms:
  - name: rhel9
    image: localhost/aslib-test/rhel9:latest
    pre_build_image: true
    command: /sbin/init
    systemd: always
    privileged: true
    # Rootless Podman cannot keep its storage on the test server's own overlay
    # filesystem, so /home lives on a volume.
    volumes: [/home]
