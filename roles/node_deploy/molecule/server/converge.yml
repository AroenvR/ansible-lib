---
- name: Deploy both test projects to the RHEL 9 test server at once, the Node.js one on port 3009 with a fixed UID
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Run node_deploy
      ansible.builtin.include_role:
        name: aslib.infra.node_deploy

    # The account takes the next free UID, as without a setting. With the qa
    # skill, qa-budget and loop-to-delivery (which needs qa-budget), so that the
    # idempotence step covers their files too, and other limits for the loop than
    # the defaults, which verify.yml expects in the installed hooks.
    - name: Deploy Claude Code next to it, with the qa skill, qa-budget and loop-to-delivery
      ansible.builtin.include_role:
        name: aslib.infra.claude_code_podman
      vars:
        podman_service_uid: ""
        claude_code_skills_qa: true
        claude_code_settings_qa_budget: true
        claude_code_skills_loop_to_delivery: true
        claude_code_skills_loop_to_delivery_max_wakes: 7
        claude_code_skills_loop_to_delivery_max_hours: 48
