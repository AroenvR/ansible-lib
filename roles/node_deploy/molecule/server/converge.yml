---
- name: Deploy the test project to the RHEL 9 test server, on port 3009 and with a fixed UID
  hosts: all
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Run node_deploy
      ansible.builtin.include_role:
        name: acme.infra.node_deploy
      vars:
        node_deploy_ansible_dir: "{{ node_deploy_test_project }}/ansible"
        node_deploy_port: 3009
        node_deploy_uid: "3001"
