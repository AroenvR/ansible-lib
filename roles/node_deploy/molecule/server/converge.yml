---
- name: Deploy the test project to the RHEL 9 test server as the user "app"
  hosts: all
  remote_user: app
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Run node_deploy
      ansible.builtin.include_role:
        name: acme.infra.node_deploy
      vars:
        node_deploy_project: "{{ node_deploy_test_project }}"
