---
# They run in this order, after the tasks that changed something notify them,
# and act as the service's account, as the conventions in tasks/main.yml describe.
- name: Load the image
  ansible.builtin.command:
    argv:
      - runuser
      - --user={{ __node_deploy_user }}
      - --
      - env
      - XDG_RUNTIME_DIR=/run/user/{{ __node_deploy_account.uid }}
      - podman
      - load
      - --input=/opt/containers/images/{{ __node_deploy_archive }}
  changed_when: true

- name: Make systemd read the Quadlet file
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv: [systemctl, --user, --machine, "{{ __node_deploy_user }}@", daemon-reload]
  changed_when: true

- name: Restart the service
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv: [systemctl, --user, --machine, "{{ __node_deploy_user }}@", restart, "{{ __node_deploy_service }}.service"]
  changed_when: true
