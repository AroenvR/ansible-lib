---
# Entry point "remove": removes the project's service with aslib.infra.podman_service,
# keeping its directory, with the app's data, unless podman_service_remove_workdir is true.
- name: Work out the service from package.json
  ansible.builtin.import_tasks: service.yml

- name: Remove the service
  ansible.builtin.import_role:
    name: aslib.infra.podman_service
    tasks_from: remove
  vars:
    podman_service_name: "{{ __node_deploy_service }}"
