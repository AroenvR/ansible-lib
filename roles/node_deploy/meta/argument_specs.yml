---
argument_specs:
  main:
    short_description: Deploy a Node.js project's image as a rootless Podman service
    description:
      - Deploys the image that aslib.infra.node_image built, using the settings in the project's
        ansible/ directory (see aslib.infra.node_setup). Runs from that directory.
      - The service is named after package.json (C(@acme/orders-api) becomes C(acme-orders-api)) and runs the image
        of the version in package.json, from ansible/images/. Its environment variables come from
        ansible/container.env, its config files from I(node_deploy_config_files), and its Quadlet file from the
        project's ansible/templates/service.container.j2 (written by aslib.infra.node_setup, for the project to
        tune) or, without one, from aslib.infra.podman_service.
      - aslib.infra.podman_service does the work on the server and has the service's settings, such as
        podman_service_port and podman_service_dir. Its conventions apply; see C(ansible-doc -t role
        aslib.infra.podman_service).
    options:
      node_deploy_ansible_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description:
          - The project's ansible/ directory, on the Ansible machine. Defaults to the current directory.
          - Its parent holds package.json, which names the service; images/ holds the image (from
            aslib.infra.node_image) and container.env the container's environment variables.
      node_deploy_config_files:
        type: str
        default: config/production/*.json
        description:
          - The project's config files for the server, a pattern relative to the project's root. The deploy copies
            them into config/ in the service's directory, removes files the project no longer has, and restarts the
            service when they change.
          - The app finds them read-only in config/ in its working directory.
      node_deploy_health_check:
        type: bool
        default: true
        description:
          - Give the service a health check (podman_service_health_cmd), run with the image's Node.js - healthy while the
            app answers HTTP on its port inside the container (podman_service_container_port) with anything but a
            server error (5xx). systemd counts the service as started once it is healthy, and Podman restarts it after
            3 failed checks in a row (one every 30 seconds once it started).
          - False runs the service without one.
  restart:
    short_description: Restart a Node.js project's service and wait until it answers
    description:
      - Restarts the service with aslib.infra.podman_service (entry point restart) and waits until it answers on
        its port, as the deploy does. For a restart without a change the deploy would see.
      - Runs from the project's ansible/ directory, as root on the server, like the deploy.
    options:
      node_deploy_ansible_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description: The project's ansible/ directory, on the Ansible machine. Its parent holds package.json,
          which names the service.
  remove:
    short_description: Remove a Node.js project's service, keeping its directory unless asked
    description:
      - Removes what the deploy created, with aslib.infra.podman_service (entry point remove). The service's
        directory, with everything the app wrote, stays unless podman_service_remove_workdir is true, as in
        C(ansible-playbook remove.yml -e podman_service_remove_workdir=true).
      - Runs from the project's ansible/ directory, as root on the server, like the deploy.
    options:
      node_deploy_ansible_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description: The project's ansible/ directory, on the Ansible machine. Its parent holds package.json,
          which names the service.
