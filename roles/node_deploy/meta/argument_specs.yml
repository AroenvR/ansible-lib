---
argument_specs:
  main:
    short_description: Deploy a Node.js project's image as a rootless Podman service
    description:
      - Deploys the image that acme.infra.node_image built, using the settings in the project's
        ansible/ directory (see acme.infra.node_setup). Runs from that directory.
      - Works as root on the server and follows these conventions. Each service runs rootless as an
        account of its own, which may run services while nobody is logged in (lingering).
        Image archives are kept in /opt/containers/images/ and loaded into that account's Podman.
        The Quadlet file and the container's environment file are in
        /etc/containers/systemd/users/<the account's UID>/, managed by root.
      - The service's directory (/opt/<service> by default) belongs to the app and is its working directory, at the
        same path in the container, so relative paths such as data/ or prod.db end up there. The deploy creates it and
        data/ in it when missing, manages only config/ in it, and hands it to the account when it belongs to another
        UID (a new account after a removal). The code stays read-only in the image.
      - The Quadlet file comes from the project's ansible/templates/service.container.j2 (written by
        acme.infra.node_setup, for the project to tune) or, without one, from this role.
      - Starts the service, or restarts it when the image, the settings, the config files or the Quadlet file
        changed, then waits until it answers HTTP requests. If it does not, the deploy fails and shows its log.
        A deploy of a new version removes the archives and images of the previous ones.
      - The container runs with a read-only root filesystem (/tmp stays writable), no capabilities and
        no privilege escalation, and starts again after a reboot.
      - Servers need RHEL 9.2 or newer with Podman 4.4 or newer (Quadlet) installed. No network access is needed.
    options:
      node_deploy_ansible_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description:
          - The project's ansible/ directory, on the Ansible machine. Defaults to the current directory.
          - Its parent holds package.json, which names the service; images/ holds the image (from
            acme.infra.node_image) and container.env the container's environment variables.
      node_deploy_user:
        type: str
        default: ""
        description: The account the service runs as. Empty means the service's name, e.g. acme-orders-api for @acme/orders-api.
      node_deploy_uid:
        type: str
        default: ""
        description: The account's UID when the deploy creates it, e.g. to have the same UID on every server. Empty lets the
          server pick a free one.
      node_deploy_dir:
        type: str
        default: ""
        description: The service's own directory on the server and the app's working directory, at the same path in the
          container. The app may create anything in it. Empty means /opt/<service>.
      node_deploy_port:
        type: int
        default: 3000
        description: The service's port on the server.
      node_deploy_bind_address:
        type: str
        default: 127.0.0.1
        description: The address the port is published on. 127.0.0.1 keeps it for this server, e.g. for a reverse proxy;
          0.0.0.0 makes it reachable from other machines (if the firewall allows).
      node_deploy_container_port:
        type: int
        default: 3000
        description: The port the app listens on inside the container, node_image_port of acme.infra.node_image.
      node_deploy_config_files:
        type: str
        default: config/production/*.json
        description:
          - The project's config files for the server, a pattern relative to the project's root. The deploy copies
            them into config/ in the service's directory, removes files the project no longer has, and restarts the
            service when they change.
          - The app finds them read-only in config/ in its working directory.
      node_deploy_tmp_size:
        type: str
        default: 512m
        description: Size limit of the app's /tmp (os.tmpdir()), which is in memory and emptied on every restart,
          e.g. C(2g). For large temporary files on disk, the app makes a directory of its own in its working directory.
  remove:
    short_description: Remove a service that acme.infra.node_deploy deployed, keeping its data unless asked
    description:
      - Stops the service and removes its account (with the account's home directory, Podman storage and
        images), its Quadlet and environment files, its image archives in /opt/containers/images/ and its config
        files. The service's directory, with the app's data, stays unless I(node_deploy_remove_data) is true; a later
        deploy uses it again. Running it again changes nothing.
      - Runs from the project's ansible/ directory, as root on the server, like the deploy.
    options:
      node_deploy_ansible_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description: The project's ansible/ directory, on the Ansible machine. Its parent holds package.json,
          which names the service.
      node_deploy_user:
        type: str
        default: ""
        description: The service's account. Empty means the service's name.
      node_deploy_dir:
        type: str
        default: ""
        description: The service's own directory on the server. Empty means /opt/<service>.
      node_deploy_remove_data:
        type: bool
        default: false
        description: Also remove the service's directory, B(with the app's data), as in
          C(ansible-playbook remove.yml -e node_deploy_remove_data=true).
