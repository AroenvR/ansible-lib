---
- name: Converge
  hosts: all
  tasks:
    - name: Apply the role with one rule to add and one to remove
      ansible.builtin.include_role:
        name: acme.infra.sudoers
      vars:
        sudoers_rules:
          - name: deploy_restart_app
            who: deploy
            commands:
              - /usr/bin/systemctl restart myapp
            nopasswd: true
          - name: old_rule
            state: absent
