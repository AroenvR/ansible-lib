---
# Shared by the entry points main and verify: checks that Ansible acts as root,
# completes each job with its defaults, checks its fields and looks up the
# jobs' accounts. Changes nothing.
- name: Look up which account Ansible acts as on the server
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", user]

- name: Check that Ansible acts as root
  ansible.builtin.assert:
    that: ansible_facts.user_uid == 0
    fail_msg: >-
      Scheduled jobs are systemd units of root and of accounts, which takes root on
      {{ inventory_hostname }}. Connect as root or with sudo; with sudo asking for a password,
      add --ask-become-pass.
    quiet: true

# Argument validation documents the fields' defaults but does not apply them.
- name: Complete each job with the defaults of its fields
  ansible.builtin.set_fact:
    __systemd_timer_jobs: >-
      {{ [{'command': '', 'schedule': '', 'user': 'root', 'container': '', 'state': 'present'}]
         | product(systemd_timer_jobs) | map('combine') | list }}

# The name ends up in file names, the command and the schedule in unit files.
# A control character would end a line there (a newline would add one), and
# systemd joins a line that ends in a backslash with the next one. A container's
# name must not start with '-', which would make it an option of podman exec.
- name: Check each job's fields, before anything changes
  ansible.builtin.assert:
    that: __systemd_timer_wrong | length == 0
    fail_msg: "Job {{ __systemd_timer_job.name }} ({{ __systemd_timer_job.user }}): {{ __systemd_timer_wrong }}."
    quiet: true
  loop: "{{ __systemd_timer_jobs }}"
  loop_control:
    loop_var: __systemd_timer_job
    label: "{{ __systemd_timer_job.name }} ({{ __systemd_timer_job.user }})"
  vars:
    __systemd_timer_line_break: '[\x00-\x1f\x7f]|[\\]$'
    __systemd_timer_installs: "{{ __systemd_timer_job.state == 'present' }}"
    __systemd_timer_rules:
      - ok: >-
          {{ __systemd_timer_job.name is string and __systemd_timer_job.name is match('^[a-z0-9][a-z0-9-]*$')
             and __systemd_timer_job.name | length <= 64 }}
        msg: its name may hold lowercase letters, digits and '-', begins with a letter or a digit and has 64 characters at most
      - ok: >-
          {{ __systemd_timer_jobs | selectattr('name', 'eq', __systemd_timer_job.name)
             | selectattr('user', 'eq', __systemd_timer_job.user) | list | length == 1 }}
        msg: it is listed more than once
      - ok: "{{ __systemd_timer_job.user is string and __systemd_timer_job.user | length > 0 }}"
        msg: its user must be root or an account
      - ok: "{{ __systemd_timer_job.state in ['present', 'absent'] }}"
        msg: its state must be present or absent
      - ok: >-
          {{ __systemd_timer_job.container is string
             and (__systemd_timer_job.container == '' or __systemd_timer_job.container is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')) }}
        msg: its container must be a container's name, of letters, digits, '_', '.' and '-', beginning with a letter or a digit
      - ok: "{{ __systemd_timer_job.user != 'root' or __systemd_timer_job.container == '' }}"
        msg: a job of root runs on the host, as container is for the jobs of an account
      - ok: >-
          {{ not __systemd_timer_installs
             or (__systemd_timer_job.command is string and __systemd_timer_job.command | trim | length > 0
                 and __systemd_timer_job.command is not search(__systemd_timer_line_break)) }}
        msg: a job to install needs a command on one line, without control characters and not ending in a backslash
      - ok: >-
          {{ not __systemd_timer_installs
             or (__systemd_timer_job.schedule is string and __systemd_timer_job.schedule | trim | length > 0
                 and __systemd_timer_job.schedule is not search(__systemd_timer_line_break)) }}
        msg: a job to install needs a schedule on one line, without control characters and not ending in a backslash
    __systemd_timer_wrong: "{{ __systemd_timer_rules | rejectattr('ok') | map(attribute='msg') | join('; ') }}"

- name: Look up the jobs' accounts
  ansible.builtin.getent:
    database: passwd
    key: "{{ __systemd_timer_user }}"
    fail_key: false
  loop: "{{ __systemd_timer_jobs | map(attribute='user') | reject('eq', 'root') | unique | list }}"
  loop_control:
    loop_var: __systemd_timer_user
  register: __systemd_timer_getent

# Each lookup replaces ansible_facts.getent_passwd, so the results are kept by
# account: its passwd entry (password, UID, GID, comment, home, shell), for the
# accounts that exist.
- name: Note each account's UID and home directory
  ansible.builtin.set_fact:
    __systemd_timer_accounts: >-
      {{ __systemd_timer_getent.results | map(attribute='ansible_facts.getent_passwd') | combine
         | dict2items | rejectattr('value', 'none') | items2dict }}

- name: Check that no job's account is root under another name
  ansible.builtin.assert:
    that: __systemd_timer_accounts[__systemd_timer_job.user][1] | int != 0
    fail_msg: >-
      Job {{ __systemd_timer_job.name }} ({{ __systemd_timer_job.user }}): {{ __systemd_timer_job.user }} has
      UID 0, which makes it root. Give the job the user root.
    quiet: true
  loop: "{{ __systemd_timer_jobs | rejectattr('user', 'eq', 'root') | selectattr('user', 'in', __systemd_timer_accounts) | list }}"
  loop_control:
    loop_var: __systemd_timer_job
    label: "{{ __systemd_timer_job.name }} ({{ __systemd_timer_job.user }})"

# Commands as an account, as podman_service runs them (see AGENTS.md's Known
# pitfalls): runuser with the account's runtime directory, where systemctl
# --user finds the account's systemd instance, and the account's own bus
# address, as runuser keeps the caller's. Such commands run from / (chdir),
# which every account may enter.
- name: Forget the account commands of an earlier run in this play
  ansible.builtin.set_fact:
    __systemd_timer_as: {}

- name: Prepare running commands as each account
  ansible.builtin.set_fact:
    __systemd_timer_as: >-
      {{ __systemd_timer_as | combine({__systemd_timer_account.key: [
           'runuser', '--user=' ~ __systemd_timer_account.key, '--', 'env',
           'XDG_RUNTIME_DIR=/run/user/' ~ __systemd_timer_account.value[1],
           'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/' ~ __systemd_timer_account.value[1] ~ '/bus']}) }}
  loop: "{{ __systemd_timer_accounts | dict2items }}"
  loop_control:
    loop_var: __systemd_timer_account
    label: "{{ __systemd_timer_account.key }}"
