---
- name: Create the node_setup test project
  hosts: localhost
  gather_facts: false
  vars_files: [vars/project.yml]
  tasks:
    - name: Create the project directory
      ansible.builtin.file:
        path: "{{ node_setup_test_project }}"
        state: directory
        mode: "0755"

    - name: Write its package.json, with a scoped name
      ansible.builtin.copy:
        content: '{ "name": "@acme/invoice-service", "version": "1.4.0" }'
        dest: "{{ node_setup_test_project }}/package.json"
        mode: "0644"

    - name: Write its .env.production, in dotenv's format
      ansible.builtin.copy:
        content: |
          # Production settings
          DATABASE_CONFIG="config/db_config.json"
          GREETING='hello, world'
          PLAIN=as it is
        dest: "{{ node_setup_test_project }}/.env.production"
        mode: "0600"
