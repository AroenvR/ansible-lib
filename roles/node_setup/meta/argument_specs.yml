---
argument_specs:
  main:
    short_description: Prepare a Node.js project for building and deploying with acme.infra
    description:
      - Writes an ansible/ directory into the project, for the project's git repository.
        Every later step (building the image, deploying it) runs from that directory.
      - It holds ansible.cfg, an inventory of the servers, the project's settings
        (group_vars/all.yml), the playbooks image.yml and deploy.yml, an environment
        file for the container's settings and secrets (kept out of git) and a guide, README.md.
      - Run it again after updating acme.infra. It replaces README.md and never touches
        the other files, which belong to the project.
      - Runs on any machine with ansible-core. Needs no network access.
    options:
      node_setup_project:
        type: str
        default: "{{ lookup('env', 'PWD') }}"
        description: The project's root directory, which holds package.json. Defaults to the current directory.
