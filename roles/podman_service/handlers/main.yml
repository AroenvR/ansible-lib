---
# They run in this order, after the tasks that changed something notify them,
# as the service's account (see "Prepare running commands as the account").
- name: Make systemd read the Quadlet file
  ansible.builtin.command:
    argv: "{{ __podman_service_as_account + ['systemctl', '--user', 'daemon-reload'] }}"
    chdir: /
  changed_when: true

- name: Restart the service
  ansible.builtin.command:
    argv: "{{ __podman_service_as_account + ['systemctl', '--user', 'restart', podman_service_name ~ '.service'] }}"
    chdir: /
  changed_when: true
