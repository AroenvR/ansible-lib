---
# What a deployed service promises, as checks that change nothing: shared by the
# deploy, the restart and the entry point verify, once the service is ready. With
# the shared zone, that includes the zone's README being aslib.infra's. Needs
# the account's commands (__podman_service_as_account) and its UID
# (__podman_service_uid_number).
- name: Look up the service's Quadlet file, and whether its account may run it at boot
  ansible.builtin.stat:
    path: "{{ __podman_service_check_path }}"
  loop:
    - /etc/containers/systemd/users/{{ __podman_service_uid_number }}/{{ podman_service_name }}.container
    - /var/lib/systemd/linger/{{ __podman_service_user }}
  loop_control:
    loop_var: __podman_service_check_path
  register: __podman_service_check_files

- name: Look up the service's state and its container, as the account
  ansible.builtin.command:
    argv: "{{ __podman_service_as_account + __podman_service_check_command }}"
    chdir: /
  loop:
    - [systemctl, --user, is-active, "{{ podman_service_name }}.service"]
    - [podman, container, inspect, "{{ podman_service_name }}"]
  loop_control:
    loop_var: __podman_service_check_command
    label: "{{ __podman_service_check_command[:3] | join(' ') }}"
  register: __podman_service_check_state
  changed_when: false
  failed_when: false

- name: Query the service on port {{ podman_service_port }}
  ansible.builtin.uri:
    url: "http://{{ '127.0.0.1' if podman_service_bind_address in ['0.0.0.0', '::'] else podman_service_bind_address }}:{{ podman_service_port }}/"
  register: __podman_service_check_answer
  failed_when: false
  when: podman_service_port | int > 0

# Another service may have removed or replaced it (see shared.yml). No service
# can remove the checksum; a server deployed before 0.4.0 has none until its next deploy.
- name: Check the shared zone's README.md against its checksum
  ansible.builtin.command:
    argv: [sha256sum, --check, --status, /opt/containers/shared-checksums/README.md.sha256]
    removes: /opt/containers/shared-checksums/README.md.sha256
  register: __podman_service_check_readme
  changed_when: false
  failed_when: false
  when: podman_service_shared | bool

# A container with a health check must have passed its latest one.
- name: Check the service starts at boot, runs, is healthy and answers on its port, and the shared zone's README is intact
  vars:
    __podman_service_container: "{{ (__podman_service_check_state.results[1].stdout | default('[{}]', true) | from_json)[0] }}"
    __podman_service_health_test: "{{ __podman_service_container.Config.Healthcheck.Test | default([]) }}"
    __podman_service_health: "{{ __podman_service_container.State.Health.Status | default('none') }}"
  ansible.builtin.assert:
    that:
      - __podman_service_check_files.results[0].stat.exists
      - __podman_service_check_files.results[1].stat.exists
      - __podman_service_check_state.results[0].stdout == 'active'
      - __podman_service_check_state.results[1].rc == 0
      - __podman_service_health_test | length == 0 or __podman_service_health == 'healthy'
      - podman_service_port | int == 0 or __podman_service_check_answer.status | default(-1) > 0
      - __podman_service_check_readme.rc | default(0) == 0
    fail_msg: >-
      {{ podman_service_name }} on {{ inventory_hostname }} -
      Quadlet file: {{ __podman_service_check_files.results[0].stat.exists }},
      starts at boot (lingering): {{ __podman_service_check_files.results[1].stat.exists }},
      state: {{ __podman_service_check_state.results[0].stdout | default('unknown', true) }},
      health: {{ __podman_service_health if __podman_service_health_test | length > 0 else 'no health check' }},
      HTTP answer on port {{ podman_service_port }}: {{ __podman_service_check_answer.status | default('none') }}.
      Its log: sudo journalctl _SYSTEMD_USER_UNIT={{ podman_service_name }}.service
      {{- '. README.md in the shared zone was changed or replaced since the last deploy, which writes it again: a service broke its rules'
          if __podman_service_check_readme.rc | default(0) != 0 else '' }}
    success_msg: >-
      {{ podman_service_name }} runs as {{ __podman_service_user }} and starts at boot;
      {{ 'it is healthy' if __podman_service_health_test | length > 0 else 'it has no health check' }}{{
      ' and answers on port ' ~ podman_service_port if podman_service_port | int > 0 else '' }}.
