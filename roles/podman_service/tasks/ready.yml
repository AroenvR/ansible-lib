---
# Shared by the deploy (main.yml) and the restart (restart.yml), once the service
# was started: waits until it is ready, as the account (__podman_service_as_account).
# A service with a port is ready once it answers HTTP there (any answer will do:
# it shows the app started and listens); one without, once it runs.
- name: Wait until the service is ready, showing its log if it is not
  block:
    - name: Wait until the service answers on port {{ podman_service_port }}
      ansible.builtin.uri:
        url: "http://{{ '127.0.0.1' if podman_service_bind_address in ['0.0.0.0', '::'] else podman_service_bind_address }}:{{ podman_service_port }}/"
      register: __podman_service_answer
      until: __podman_service_answer.status | default(-1) > 0
      retries: 30
      delay: 2
      failed_when: __podman_service_answer.status | default(-1) <= 0  # any HTTP status will do
      when: podman_service_port | int > 0

    - name: Wait until the service runs, as it has no port
      ansible.builtin.command:
        argv: "{{ __podman_service_as_account + ['systemctl', '--user', 'is-active', podman_service_name ~ '.service'] }}"
        chdir: /
      register: __podman_service_running
      until: __podman_service_running.rc == 0
      retries: 30
      delay: 2
      changed_when: false
      when: podman_service_port | int == 0
  rescue:
    - name: Read the service's log
      ansible.builtin.command: journalctl --no-pager --lines=50 _SYSTEMD_USER_UNIT={{ podman_service_name }}.service
      register: __podman_service_log
      changed_when: false

    - name: Show the service's log
      ansible.builtin.debug:
        var: __podman_service_log.stdout_lines

    - name: Stop, as the service is not ready
      ansible.builtin.fail:
        msg: >-
          {{ podman_service_name }} did not {{ 'answer on port ' ~ podman_service_port if podman_service_port | int > 0 else 'start' }}
          within a minute; its log is above. All of it: sudo journalctl _SYSTEMD_USER_UNIT={{ podman_service_name }}.service
