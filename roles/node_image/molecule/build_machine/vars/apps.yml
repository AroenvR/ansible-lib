---
# The apps the node_image tests build, run and query. Each entry is one test case:
# covering another version means adding an entry, not code.
#   source       a directory next to this file, or
#   nestjs_ref   a commit or branch of github.com/nestjs/nest; its REST sample
#                (sample/01-cats-app, no lockfile, no .nvmrc) is used
#   nvmrc        written to .nvmrc; leave out to test the role's default version
#   request      path to GET (default /cats)
#   expect       text the response must contain (default [], an empty cat list)
node_image_test_apps:
  - name: native-addon          # a native (C) module compiles and loads
    source: app
    request: /
    expect: native addon works
  - name: nestjs-10             # last commit of the sample on NestJS 10
    nestjs_ref: fb20d462f72c2061a735056ca7d45f14e7b77082
    nvmrc: "22"
  - name: nestjs-11             # last commit on NestJS 11
    nestjs_ref: e4258105daabf26203e2580ccafb96dfba749a92
    nvmrc: v24.11.0
  - name: nestjs-12             # NestJS 12, pinned
    nestjs_ref: a24bb137b5371956c35369e4c6646334d64b70be
  - name: nestjs-master         # follows NestJS's default branch, so it can break when they change things
    nestjs_ref: master

node_image_test_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') | default('/tmp/node-image-test', true) }}/apps"
