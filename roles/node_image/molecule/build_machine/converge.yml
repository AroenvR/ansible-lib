---
- name: Build an image of every node_image test app
  hosts: localhost
  gather_facts: false
  vars_files: [vars/apps.yml]
  tasks:
    - name: Run node_image for each test app
      ansible.builtin.include_role:
        name: acme.infra.node_image
      vars:
        node_image_source: "{{ node_image_test_dir }}/{{ node_image_test_app.name }}"
        node_image_output_dir: "{{ node_image_test_dir }}/{{ node_image_test_app.name }}/ansible/images"
      loop: "{{ node_image_test_apps }}"
      loop_control:
        loop_var: node_image_test_app
        label: "{{ node_image_test_app.name }}"
