---
- name: Check every node_image test app's image works as a backend would use it
  hosts: localhost
  gather_facts: false
  vars_files: [vars/apps.yml]
  tasks:
    - name: Check each test app
      ansible.builtin.include_tasks: tasks/verify_app.yml
      loop: "{{ node_image_test_apps }}"
      loop_control:
        loop_var: node_image_test_app
        label: "{{ node_image_test_app.name }}"
