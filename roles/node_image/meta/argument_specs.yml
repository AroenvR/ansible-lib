---
argument_specs:
  main:
    short_description: Build a production container image of a Node.js project with Podman.
    description:
      - Runs on the machine where Ansible runs (the build machine) and needs Podman 3.4 or newer there.
      - Needs package.json with C(name), C(version) and the scripts C(build) and C(start:prod) (the NestJS convention),
        and no package in both C(dependencies) and C(devDependencies) (npm would leave it out of the image).
        The image is tagged C(name):C(version) and starts with C(npm run start:prod).
      - Takes the Node.js major version from .nvmrc, or I(node_image_node_version) when there is none.
        .nvmrc may hold a version (C(24), C(v24.3.0)) or an LTS line (C(lts/*), C(lts/jod), C(lts/krypton));
        C(lts/*) means I(node_image_node_version).
      - Builds in two stages on Red Hat UBI 9. The build stage (ubi9/nodejs-<major>) has gcc, g++, make and Python 3,
        so native npm modules compile; it installs dependencies (C(npm ci) with package-lock.json, otherwise
        C(npm install)), runs C(npm run build) and removes dev dependencies. The runtime stage
        (ubi9/nodejs-<major>-minimal) has no compilers and runs as user 1001, which cannot change the app's files.
      - Runs from the project's ansible/ directory (see acme.infra.node_setup); the project is its parent directory.
        The ansible/ directory never goes into the image.
      - Writes the generated Containerfile and the image archive (C(podman save), OCI format) to I(node_image_output_dir).
        The image carries the labels org.opencontainers.image.version (from package.json) and
        org.opencontainers.image.revision (the project's git commit, if it is a git checkout).
      - Downloads, each from a source you can point at a mirror. The base images from I(node_image_registry).
        npm packages from the registry in the project's .npmrc (npm's default without one); npm takes all its
        settings from there. The Node.js headers for native modules from I(node_image_node_dist_url).
        The RPMs in I(node_image_build_packages) and I(node_image_runtime_packages), if any, from the UBI
        repositories the base images are set up with.
    options:
      node_image_source:
        type: str
        default: "{{ lookup('env', 'PWD') | dirname }}"
        description: Project directory with package.json, package-lock.json and .nvmrc. Defaults to the parent of the
          current directory, which is the project's ansible/ directory.
      node_image_output_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}/images"
        description: Where the generated Containerfile and the image archive are written. Never part of the image.
      node_image_node_version:
        type: str
        default: "24"
        description: Node.js major version used when the project has no .nvmrc, or one saying C(lts/*). Follows the
          newest LTS release that Red Hat publishes images for.
      node_image_port:
        type: int
        default: 3000
        description: Port the app listens on. Set as the PORT environment variable and exposed by the image.
      node_image_build_packages:
        type: list
        elements: str
        default: []
        description: Extra RPM packages for the build stage, e.g. C(libpq-devel) when a native module needs it.
      node_image_runtime_packages:
        type: list
        elements: str
        default: []
        description: Extra RPM packages for the runtime stage, e.g. C(libpq) for a native module built against it.
      node_image_ignore:
        type: list
        elements: str
        default: []
        description: Extra patterns kept out of the image, in .containerignore syntax. .git, node_modules, .env files,
          the ansible/ directory and config/ (which acme.infra.node_deploy provides on the server) are always excluded.
      node_image_registry:
        type: str
        default: registry.access.redhat.com
        description: Registry, with an optional path, holding Red Hat's ubi9/nodejs-<major> and ubi9/nodejs-<major>-minimal
          images, e.g. a mirror such as C(mirror.example.com/redhat).
      node_image_node_dist_url:
        type: str
        default: https://nodejs.org/dist
        description: Where node-gyp downloads the Node.js headers to compile native modules, laid out like
          nodejs.org/dist (C(v24.3.0/node-v24.3.0-headers.tar.gz)). Point it at a mirror if needed.
  node_modules:
    short_description: Install a Node.js project's dependencies into node_modules in a throwaway container
    description:
      - Installs the dependencies, devDependencies included, without running npm or the packages' install scripts on
        this machine. They run in a container of the builder image the image build uses (ubi9/nodejs-<major>, the
        major version from .nvmrc), which gets package.json, package-lock.json and .npmrc and nothing else of this
        machine, has no capabilities, and is removed afterwards. C(npm ci) with package-lock.json, otherwise
        C(npm install); npm takes its registry and other settings from the project's .npmrc.
      - Only once the install has succeeded, the current node_modules is saved as
        node_modules.<UTC yyyymmddHHMMSS>.bak.tgz in the project and replaced by the new one.
      - The result is for this machine if it runs Linux with glibc 2.34 or newer (RHEL 9, Ubuntu 22.04) and the
        same Node.js major version, as native modules are compiled in the container.
      - Runs from the project's ansible/ directory, like the image build, and needs Podman 3.4 or newer.
    options:
      node_image_source:
        type: str
        default: "{{ lookup('env', 'PWD') | dirname }}"
        description: Project directory with package.json. Defaults to the parent of the current directory.
      node_image_node_version:
        type: str
        default: "24"
        description: Node.js major version used when the project has no .nvmrc, or one saying C(lts/*).
      node_image_registry:
        type: str
        default: registry.access.redhat.com
        description: Registry, with an optional path, holding Red Hat's ubi9/nodejs-<major> images.
      node_image_node_dist_url:
        type: str
        default: https://nodejs.org/dist
        description: Where node-gyp downloads the Node.js headers to compile native modules.
