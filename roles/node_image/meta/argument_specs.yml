---
argument_specs:
  main:
    short_description: Build a production container image of a Node.js project with Podman.
    description:
      - Runs on the machine where Ansible runs (the build machine) and needs Podman 3.4 or newer there.
      - Needs package.json with C(name), C(version) and the scripts C(build) and C(start:prod) (the NestJS convention).
        The image is tagged C(name):C(version) and starts with C(npm run start:prod).
      - Takes the Node.js major version from .nvmrc, or I(node_image_node_version) when there is none.
      - Builds in two stages on Red Hat UBI 9. The build stage (ubi9/nodejs-<major>) has gcc, g++, make and Python 3,
        so native npm modules compile; it installs dependencies (C(npm ci) with package-lock.json, otherwise
        C(npm install)), runs C(npm run build) and removes dev dependencies. The runtime stage
        (ubi9/nodejs-<major>-minimal) has no compilers and runs as user 1001, which cannot change the app's files.
      - Runs from the project's ansible/ directory (see acme.infra.node_setup); the project is its parent directory.
        The ansible/ directory never goes into the image.
      - Writes the generated Containerfile and the image archive (C(podman save), OCI format) to I(node_image_output_dir).
        The image carries the labels org.opencontainers.image.version (from package.json) and
        org.opencontainers.image.revision (the project's git commit, if it is a git checkout).
      - Needs network access during the build to I(node_image_registry), I(node_image_npm_registry) and,
        for native modules, nodejs.org (node-gyp downloads the Node.js headers).
    options:
      node_image_source:
        type: str
        default: "{{ lookup('env', 'PWD') | dirname }}"
        description: Project directory with package.json, package-lock.json and .nvmrc. Defaults to the parent of the
          current directory, which is the project's ansible/ directory.
      node_image_output_dir:
        type: str
        default: "{{ lookup('env', 'PWD') }}/images"
        description: Where the generated Containerfile and the image archive are written. Never part of the image.
      node_image_node_version:
        type: str
        default: "24"
        description: Node.js major version used when the project has no .nvmrc. Follows the current LTS release that Red Hat publishes images for.
      node_image_port:
        type: int
        default: 3000
        description: Port the app listens on. Set as the PORT environment variable and exposed by the image.
      node_image_build_packages:
        type: list
        elements: str
        default: []
        description: Extra RPM packages for the build stage, e.g. C(libpq-devel) when a native module needs it.
      node_image_runtime_packages:
        type: list
        elements: str
        default: []
        description: Extra RPM packages for the runtime stage, e.g. C(libpq) for a native module built against it.
      node_image_ignore:
        type: list
        elements: str
        default: []
        description: Extra patterns kept out of the image, in .containerignore syntax. .git, node_modules, .env files
          and the ansible/ directory are always excluded.
      node_image_registry:
        type: str
        default: registry.access.redhat.com
        description: Registry holding the ubi9/nodejs-<major> images. Point it at an internal mirror if needed.
      node_image_npm_registry:
        type: str
        default: https://registry.npmjs.org/
        description: npm registry used during the build. Point it at an internal proxy if needed.
