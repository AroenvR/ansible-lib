---
# Entry point "node_modules": installs the project's dependencies (devDependencies
# included) into its node_modules directory, without running npm, or the install
# scripts of the packages, on this machine. They run in a throwaway container of
# the builder image the image build uses. The container gets copies of
# package.json, package-lock.json and .npmrc, no mounts, so it sees nothing else
# of this machine. Only after a successful install is the current node_modules
# saved as node_modules.<UTC time>.bak.tgz and replaced.
- name: Check the project and work out the builder image
  ansible.builtin.import_tasks: project.yml

- name: Pull the latest builder image
  ansible.builtin.import_tasks: pull.yml
  vars:
    __node_image_pull_images: ["{{ __node_image_builder }}"]

- name: Create a temporary directory for the new node_modules
  ansible.builtin.tempfile:
    state: directory
    prefix: node_modules.
  register: __node_image_tmp

# Files go in and out with podman cp: Podman 3.4 (Ubuntu 22.04) can cut a
# container's output short. --pull=never: the step above is the only download.
- name: Install the dependencies, then replace node_modules
  vars:
    __node_image_inputs: >-
      {{ ['package.json']
         + (['package-lock.json'] if __node_image_has_lockfile | bool else [])
         + (['.npmrc'] if (node_image_source ~ '/.npmrc') is file else []) }}
    __node_image_new: "{{ __node_image_tmp.path }}/node_modules.tar"
  block:
    - name: Create a throwaway container for the install
      ansible.builtin.command:
        argv:
          - podman
          - create
          - --pull=never
          - --cap-drop=all
          - --security-opt=no-new-privileges
          - --env=npm_package_config_node_gyp_dist_url={{ node_image_node_dist_url }}
          - "{{ __node_image_builder }}"
          - bash
          - -c
          - "{{ 'npm ci' if __node_image_has_lockfile | bool else 'npm install' }} --include=dev --no-audit --no-fund && mkdir -p node_modules"
      register: __node_image_container
      changed_when: false

    # podman cp gives the files to the image's user (1001), so npm can read a private .npmrc.
    - name: Copy the project's files into the container, {{ __node_image_inputs | join(', ') }}
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          tar --create --file=- --directory={{ node_image_source | quote }} {{ __node_image_inputs | map('quote') | join(' ') }}
          | podman cp - {{ __node_image_container.stdout | quote }}:/opt/app-root/src
        executable: /bin/bash
      changed_when: false

    - name: Install the dependencies in the container
      ansible.builtin.command:
        argv: [podman, start, "{{ __node_image_container.stdout }}"]
      changed_when: false

    - name: Wait for npm to finish
      ansible.builtin.command:
        argv: [podman, wait, "{{ __node_image_container.stdout }}"]
      register: __node_image_exit
      changed_when: false

    - name: Show npm's output, as the install failed
      ansible.builtin.command:
        argv: [podman, logs, "{{ __node_image_container.stdout }}"]
      when: __node_image_exit.stdout | trim != '0'
      changed_when: false
      failed_when: true

    - name: Copy the new node_modules out of the container
      ansible.builtin.shell:
        cmd: podman cp {{ __node_image_container.stdout | quote }}:/opt/app-root/src/node_modules - > {{ __node_image_new | quote }}
      changed_when: false

    - name: Note the name of the backup
      ansible.builtin.set_fact:
        __node_image_backup: "node_modules.{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}.bak.tgz"
        __node_image_had_node_modules: "{{ (node_image_source ~ '/node_modules') is directory }}"

    - name: Back up the current node_modules as {{ __node_image_backup }}
      ansible.builtin.command:
        argv: [tar, --create, --gzip, "--file={{ __node_image_backup }}", node_modules]
        chdir: "{{ node_image_source }}"
      when: __node_image_had_node_modules | bool
      changed_when: true

    - name: Remove the current node_modules
      ansible.builtin.file:
        path: "{{ node_image_source }}/node_modules"
        state: absent

    # --no-same-owner: the files belong to whoever runs this, also as root.
    - name: Put the new node_modules in its place
      ansible.builtin.command:
        argv: [tar, --extract, --no-same-owner, "--file={{ __node_image_new }}", "--directory={{ node_image_source }}"]
      changed_when: true
  always:
    - name: Remove the throwaway container
      ansible.builtin.command:
        argv: [podman, rm, --force, "{{ __node_image_container.stdout }}"]
      when: __node_image_container.stdout | default('') | length > 0
      changed_when: false

    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ __node_image_tmp.path }}"
        state: absent

- name: Show how to go back to the previous node_modules
  ansible.builtin.debug:
    msg: >-
      Installed node_modules in {{ node_image_source }}. The previous one is in {{ __node_image_backup }};
      to go back: rm -rf node_modules && tar -xzf {{ __node_image_backup }}
  when: __node_image_had_node_modules | bool
