---
- name: Look up the Podman version on the build machine
  ansible.builtin.command: podman --version
  register: __node_image_podman
  changed_when: false
  failed_when: false

- name: Check that Podman 3.4 or newer is installed
  ansible.builtin.assert:
    that:
      - __node_image_podman.rc == 0
      - __node_image_podman.stdout.split()[-1] is version('3.4', '>=')
    fail_msg: >-
      The build needs Podman 3.4 or newer on this machine (found: {{ __node_image_podman.stdout | default('none', true) }}).
      On RHEL 9: dnf install podman. On Ubuntu 22.04: apt install podman.
    quiet: true

- name: Check the project has a package.json
  ansible.builtin.assert:
    that: (node_image_source ~ '/package.json') is file
    fail_msg: "No package.json in {{ node_image_source }}. Run the build from the project's ansible/ directory."
    quiet: true

# .nvmrc and package-lock.json are optional. .nvmrc holds a version (24, v24.3.0)
# or an LTS line (lts/*, lts/krypton), see vars/main.yml.
- name: Read package.json, and .nvmrc if there is one
  vars:
    __node_image_nvmrc: >-
      {{ (lookup('file', node_image_source ~ '/.nvmrc') if (node_image_source ~ '/.nvmrc') is file else node_image_node_version)
      | string | trim | lower }}
  ansible.builtin.set_fact:
    __node_image_package: "{{ lookup('file', node_image_source ~ '/package.json') | from_json }}"
    __node_image_has_lockfile: "{{ (node_image_source ~ '/package-lock.json') is file }}"
    __node_image_node_version: "{{ __node_image_lts_lines.get(__node_image_nvmrc, __node_image_nvmrc) | regex_replace('^v', '') }}"

- name: Check package.json and the Node.js version
  ansible.builtin.assert:
    that:
      - __node_image_package.name is defined
      - __node_image_package.version is defined
      - "'build' in __node_image_package.scripts | default({})"
      - "'start:prod' in __node_image_package.scripts | default({})"
      - __node_image_node_version is match('^[0-9]+(\.|$)')
    fail_msg: >-
      package.json needs "name", "version" and the scripts "build" and "start:prod"
      (the NestJS convention), and .nvmrc a Node.js version such as 24 or v24.3.0, or one of
      {{ __node_image_lts_lines.keys() | join(', ') }} (found '{{ __node_image_node_version }}').
    quiet: true

- name: Warn that builds without package-lock.json are not reproducible
  ansible.builtin.debug:
    msg: >-
      No package-lock.json, so dependencies are resolved anew on every build (npm install)
      and two builds of the same code can differ. Commit package-lock.json to avoid that.
  when: not __node_image_has_lockfile | bool

- name: Work out the base images, image tag and archive path
  ansible.builtin.set_fact:
    __node_image_builder: "{{ node_image_registry }}/ubi9/nodejs-{{ __node_image_node_version.split('.')[0] }}"
    __node_image_runtime: "{{ node_image_registry }}/ubi9/nodejs-{{ __node_image_node_version.split('.')[0] }}-minimal"
    __node_image_tag: "{{ __node_image_package.name | regex_replace('^@', '') }}:{{ __node_image_package.version }}"
    __node_image_archive: >-
      {{ node_image_output_dir }}/{{ __node_image_package.name | regex_replace('^@', '') | replace('/', '-') }}-{{ __node_image_package.version }}.tar

# Recorded in the image (org.opencontainers.image.revision); empty outside git.
- name: Look up the project's git commit
  ansible.builtin.command:
    argv: [git, -C, "{{ node_image_source }}", rev-parse, HEAD]
  register: __node_image_commit
  changed_when: false
  failed_when: false

- name: Create the output directory
  ansible.builtin.file:
    path: "{{ node_image_output_dir }}"
    state: directory
    mode: "0755"

# The output directory ignores itself, so the project's .gitignore needs no entry.
- name: Keep the output directory out of git
  ansible.builtin.copy:
    content: "*\n"
    dest: "{{ node_image_output_dir }}/.gitignore"
    mode: "0644"

# Loops in this role use their own loop variable names, so the role can be
# called from a loop (which uses "item") without the two clashing.
- name: Write the Containerfile and the list of files kept out of the image
  ansible.builtin.template:
    src: "{{ __node_image_file }}.j2"
    dest: "{{ node_image_output_dir }}/{{ __node_image_file }}"
    mode: "0644"
  loop: [Containerfile, containerignore]
  loop_control:
    loop_var: __node_image_file

# Pulling refreshes the base images (security fixes). Without registry access
# the build falls back to the cached copies, so a failed pull is only a warning.
- name: Pull the latest base images
  ansible.builtin.command:
    argv: [podman, pull, "{{ __node_image_base }}"]
  loop: ["{{ __node_image_builder }}", "{{ __node_image_runtime }}"]
  loop_control:
    loop_var: __node_image_base
  register: __node_image_pull
  changed_when: false
  failed_when: false

- name: Warn about base images that could not be pulled
  ansible.builtin.debug:
    msg: "Could not pull {{ __node_image_failed.__node_image_base }}; the build uses the cached copy if there is one."
  loop: "{{ __node_image_pull.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    loop_var: __node_image_failed
    label: "{{ __node_image_failed.__node_image_base }}"

- name: Look up the current image {{ __node_image_tag }}
  ansible.builtin.command:
    argv: [podman, images, --quiet, --no-trunc, "{{ __node_image_tag }}"]
  register: __node_image_before
  changed_when: false

- name: Build the image {{ __node_image_tag }}
  ansible.builtin.command:
    argv:
      - podman
      - build
      - --file={{ node_image_output_dir }}/Containerfile
      - --ignorefile={{ node_image_output_dir }}/containerignore
      - --tag={{ __node_image_tag }}
      - "{{ node_image_source }}"
  changed_when: false  # The next task decides whether the image changed.

- name: Look up the image after building {{ __node_image_tag }}
  ansible.builtin.command:
    argv: [podman, images, --quiet, --no-trunc, "{{ __node_image_tag }}"]
  register: __node_image_after
  changed_when: __node_image_after.stdout != __node_image_before.stdout

- name: Save the image as an archive {{ __node_image_archive | basename }}
  ansible.builtin.command:
    argv: [podman, save, --format=oci-archive, "--output={{ __node_image_archive }}", "{{ __node_image_tag }}"]
  when: __node_image_after is changed or __node_image_archive is not file
  changed_when: true

- name: Show where the image is
  ansible.builtin.debug:
    msg: "Built {{ __node_image_tag }} into {{ __node_image_archive }}. Load it with: podman load --input {{ __node_image_archive | basename }}"
