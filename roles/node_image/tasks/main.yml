---
- name: Check the project and work out the base images
  ansible.builtin.import_tasks: project.yml

- name: Check package.json has what the image needs
  ansible.builtin.assert:
    that:
      - __node_image_package.name is defined
      - __node_image_package.version is defined
      - "'build' in __node_image_package.scripts | default({})"
      - "'start:prod' in __node_image_package.scripts | default({})"
    fail_msg: package.json needs "name", "version" and the scripts "build" and "start:prod" (the NestJS convention).
    quiet: true

# npm counts a package in both lists as a devDependency, so the build would leave
# it out of the image and the app would fail with "Cannot find module".
- name: Check no package is in both dependencies and devDependencies
  vars:
    __node_image_in_both: >-
      {{ __node_image_package.dependencies | default({}) | list
         | intersect(__node_image_package.devDependencies | default({}) | list) }}
  ansible.builtin.assert:
    that: __node_image_in_both | length == 0
    fail_msg: >-
      {{ __node_image_in_both | join(', ') }} in both "dependencies" and "devDependencies" of package.json.
      npm counts it as a devDependency and would leave it out of the image ("Cannot find module").
      Remove it from devDependencies, then update package-lock.json: npm install --package-lock-only
    quiet: true

- name: Work out the image tag and archive path
  ansible.builtin.set_fact:
    __node_image_tag: "{{ __node_image_package.name | regex_replace('^@', '') }}:{{ __node_image_package.version }}"
    __node_image_archive: >-
      {{ node_image_output_dir }}/{{ __node_image_package.name | regex_replace('^@', '') | replace('/', '-') }}-{{ __node_image_package.version }}.tar

# Recorded in the image (org.opencontainers.image.revision); empty outside git.
- name: Look up the project's git commit
  ansible.builtin.command:
    argv: [git, -C, "{{ node_image_source }}", rev-parse, HEAD]
  register: __node_image_commit
  changed_when: false
  failed_when: false

- name: Create the output directory
  ansible.builtin.file:
    path: "{{ node_image_output_dir }}"
    state: directory
    mode: "0755"

# The output directory ignores itself, so the project's .gitignore needs no entry.
- name: Keep the output directory out of git
  ansible.builtin.copy:
    content: "*\n"
    dest: "{{ node_image_output_dir }}/.gitignore"
    mode: "0644"

# Loops in this role use their own loop variable names, so the role can be
# called from a loop (which uses "item") without the two clashing.
- name: Write the Containerfile and the list of files kept out of the image
  ansible.builtin.template:
    src: "{{ __node_image_file }}.j2"
    dest: "{{ node_image_output_dir }}/{{ __node_image_file }}"
    mode: "0644"
  loop: [Containerfile, containerignore]
  loop_control:
    loop_var: __node_image_file

- name: Pull the latest base images
  ansible.builtin.import_tasks: pull.yml
  vars:
    __node_image_pull_images: ["{{ __node_image_builder }}", "{{ __node_image_runtime }}"]

- name: Look up the current image {{ __node_image_tag }}
  ansible.builtin.command:
    argv: [podman, images, --quiet, --no-trunc, "{{ __node_image_tag }}"]
  register: __node_image_before
  changed_when: false

- name: Build the image {{ __node_image_tag }}
  ansible.builtin.command:
    argv:
      - podman
      - build
      - --file={{ node_image_output_dir }}/Containerfile
      - --ignorefile={{ node_image_output_dir }}/containerignore
      - --tag={{ __node_image_tag }}
      - "{{ node_image_source }}"
  changed_when: false  # The next task decides whether the image changed.

- name: Look up the image after building {{ __node_image_tag }}
  ansible.builtin.command:
    argv: [podman, images, --quiet, --no-trunc, "{{ __node_image_tag }}"]
  register: __node_image_after
  changed_when: __node_image_after.stdout != __node_image_before.stdout

- name: Save the image as an archive {{ __node_image_archive | basename }}
  ansible.builtin.command:
    argv: [podman, save, --format=oci-archive, "--output={{ __node_image_archive }}", "{{ __node_image_tag }}"]
  when: __node_image_after is changed or __node_image_archive is not file
  changed_when: true

- name: Show where the image is
  ansible.builtin.debug:
    msg: "Built {{ __node_image_tag }} into {{ __node_image_archive }}. Load it with: podman load --input {{ __node_image_archive | basename }}"
