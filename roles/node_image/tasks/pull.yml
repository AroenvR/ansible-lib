---
# Pulling refreshes the images (security fixes). Without access to the registry
# the cached copies are used, so a failed pull is only a warning.
- name: Pull the latest images from {{ node_image_registry }}
  ansible.builtin.command:
    argv: [podman, pull, "{{ __node_image_image }}"]
  loop: "{{ __node_image_pull_images }}"
  loop_control:
    loop_var: __node_image_image
  register: __node_image_pull
  changed_when: false
  failed_when: false

- name: Warn about images that could not be pulled
  ansible.builtin.debug:
    msg: "Could not pull {{ __node_image_failed.__node_image_image }}; using the cached copy if there is one."
  loop: "{{ __node_image_pull.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    loop_var: __node_image_failed
    label: "{{ __node_image_failed.__node_image_image }}"
