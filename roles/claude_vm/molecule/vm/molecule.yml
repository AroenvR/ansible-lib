---
# Creates claude-dev on this machine, which needs KVM, and checks it as a person
# would use it: logged in as claude with sudo, with Podman, Python 3.10 and Claude
# Code, reaching the internet but neither a machine on the local network (a
# stand-in in a network namespace) nor the host's own services. Not part of
# `make test`: run it with `sudo make test-vm-2.14` on a machine with KVM.
scenario:
  name: vm
  test_sequence: [cleanup, syntax, converge, idempotence, verify, cleanup]
driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: localhost
