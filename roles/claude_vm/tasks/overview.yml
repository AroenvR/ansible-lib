---
# Entry point "overview": shows the host and claude-dev, for finding out why the
# VM does not come up. Only looks things up: changes nothing.
- name: Look up the host's distribution, kernel and architecture
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", distribution, platform]

# The model: a board's device tree (a Raspberry Pi's) or a PC's firmware tables.
- name: Read the host's model and memory
  ansible.builtin.slurp:
    src: "{{ __claude_vm_overview_file }}"
  loop: [/proc/device-tree/model, /sys/class/dmi/id/product_name, /proc/meminfo]
  loop_control:
    loop_var: __claude_vm_overview_file
  register: __claude_vm_overview_files
  failed_when: false

- name: Look up KVM
  ansible.builtin.stat:
    path: /dev/kvm
  register: __claude_vm_overview_kvm

- name: Look up the installed packages
  ansible.builtin.package_facts:
  failed_when: false

- name: Look up the VM
  ansible.builtin.include_tasks: describe.yml

- name: Show the host and the VM
  vars:
    __claude_vm_meminfo: "{{ (__claude_vm_overview_files.results[2].content | default('') | b64decode).splitlines() }}"
    __claude_vm_installed: >-
      {{ ansible_facts.packages | default({}) | dict2items | selectattr('key', 'in', __claude_vm_overview_packages)
         | map(attribute='value') | map('first') | list }}
    __claude_vm_console_tail: >-
      {{ __claude_vm_console[(claude_vm_overview_console_lines | int) * -1 :] if claude_vm_overview_console_lines | int > 0 else [] }}
  ansible.builtin.debug:
    msg: >-
      {{ ['Host: ' ~ (__claude_vm_overview_files.results[:2] | selectattr('content', 'defined') | map(attribute='content')
                      | map('b64decode') | map('regex_replace', '[^ -~]', '') | first | default('unknown model')),
          'System: %s %s, kernel %s, %s' | format(ansible_facts.distribution, ansible_facts.distribution_version,
                                                  ansible_facts.kernel, ansible_facts.architecture),
          'KVM: ' ~ ('yes' if __claude_vm_overview_kvm.stat.exists else 'no, /dev/kvm is missing'),
          'Memory: ' ~ (__claude_vm_meminfo | select('match', 'Mem(Total|Available):') | map('regex_replace', ' +', ' ') | join(', ')),
          'Packages:']
         + (__claude_vm_installed | map(attribute='name') | zip(__claude_vm_installed | map(attribute='version'))
            | map('join', ' ') | map('regex_replace', '^', '  ') | list)
         + __claude_vm_description
         + ((['Console, last lines (all of it: sudo cat ' ~ __claude_vm_console_log ~ '):']
             + __claude_vm_console_tail | map('regex_replace', '^', '  ') | list)
            if __claude_vm_console else
            ['Console: no log yet; a boot trial (aslib.infra.claude_vm_boot_trial) records it in ' ~ __claude_vm_console_log]) }}
