---
argument_specs:
  main:
    short_description: The index of aslib.infra's Claude Code roles, which names the role for each job
    description:
      - The Claude Code roles of aslib.infra, one family. Runs nothing; run one of the roles below.
      - aslib.infra.claude_code_podman - Claude Code as an always-on agent in a container on a server, for root
        (entry points setup, image, main, restart, remove; playbook aslib.infra.claude_code_podman_setup).
      - aslib.infra.claude_code_vm - a VM where Claude Code may have root, for development (playbooks
        aslib.infra.claude_code_vm, claude_code_vm_remove, claude_code_vm_overview, claude_code_vm_boot_trial).
      - aslib.infra.claude_code_settings - how a new session starts, the same in both, which both include
        (claude_code_settings_* settings).
      - aslib.infra.claude_code_skills - the skills Claude Code gets, the same in both, which both include (the qa
        skill with its five expert subagents, and loop-to-delivery; claude_code_skills_* settings).
      - Before 0.7.0 this name was the container's role, now claude_code_podman. Its entry point main stops with
        this list, so that a project's deploy.yml of then does not silently do nothing.
    options: {}
