---
# Entry point "main": the index runs nothing. A project from before 0.7.0 calls
# this name for its container, so it learns where to go instead.
- name: Name the Claude Code role to run instead
  ansible.builtin.fail:
    msg: >-
      aslib.infra.claude_code is the index of the Claude Code roles and runs nothing. Claude Code in a container
      on a server is aslib.infra.claude_code_podman; the VM is aslib.infra.claude_code_vm; the settings both
      start sessions with are aslib.infra.claude_code_settings's, and the skills both install
      aslib.infra.claude_code_skills's. A Claude Code project from before 0.7.0: run
      ansible-playbook aslib.infra.claude_code_podman_setup in its root directory, which brings its playbooks up
      to date, and rename its settings in ansible/group_vars/all/project.yml as the CHANGELOG's upgrade notes for
      0.7.0 say.
