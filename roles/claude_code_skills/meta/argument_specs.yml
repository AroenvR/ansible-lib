---
argument_specs:
  main:
    short_description: Compute the skills that every target of aslib.infra installs, loop-to-delivery for now
    description:
      - The skills Claude Code gets wherever aslib.infra installs it, in its container (claude_code_podman) and in its
        VM (claude_code_vm), which include this role after aslib.infra.claude_code_settings and install what it
        hands over, each where its Claude Code reads it. Changes nothing itself.
      - Hands over three facts. C(claude_code_skills_files), the files of the skills that are on, for Claude Code's
        managed settings directory (/etc/claude-code), each with its path there (C(name)) and its file on the
        Ansible machine (C(src)). C(claude_code_skills_absent), the paths there of the skills that are off, for a
        target to remove where an earlier run installed them. C(claude_code_skills_policy), a part of the policy
        managed-settings.json, which a target merges into claude_code_settings' base; empty unless
        loop-to-delivery is on.
      - loop-to-delivery needs qa-budget (C(claude_code_settings_qa_budget) of aslib.infra.claude_code_settings,
        which this role reads and does not declare). A run with loop-to-delivery on and qa-budget off stops, naming
        both settings.
    options:
      claude_code_skills_loop_to_delivery:
        type: bool
        default: false
        description:
          - The skill loop-to-delivery, its hook program and the hooks that run it (UserPromptSubmit, Stop and
            StopFailure in the policy). Claude then sets up a loop by itself for work that outlasts a turn, such as a
            change request or waiting on CI, with a wake-up job every 30 minutes and notes on disk to continue from;
            the hooks let a wake-up through only in the conversation that started the loop and within its limits.
          - Needs C(claude_code_settings_qa_budget) on. The guard of qa-budget is what keeps the loop's wake-ups
            inside the subscription's budget, as it blocks them, as automatic prompts, at its ceilings; the loop ends
            when the guard blocks one. The run stops when this is on and qa-budget is off.
          - A loop ends when Claude marks the work delivered, the person stops it, after
            C(claude_code_skills_loop_to_delivery_max_wakes) wake-ups, after
            C(claude_code_skills_loop_to_delivery_max_hours) hours, after 6 wake-ups in a row without progress, or
            when qa-budget's guard blocks a wake-up because a ceiling of the subscription is reached.
      claude_code_skills_loop_to_delivery_max_wakes:
        type: int
        default: 5
        description: The most wake-ups a loop of loop-to-delivery gets, a whole number above 0. Wake-ups whose turn
          failed on a rate or credit limit, an overload or a server error do not count.
      claude_code_skills_loop_to_delivery_max_hours:
        type: int
        default: 24
        description: The most hours a loop of loop-to-delivery runs, from its start, a whole number from 1 to 168 (7
          days; a recurring job expires after 7 days).
