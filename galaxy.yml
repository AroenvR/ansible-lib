---
# Collection metadata: identity, version and what ends up in the release tarball.
namespace: aslib
name: infra
# Releases are made by CI from main, as this version. Every merge into accept
# raises it, with its CHANGELOG.md section (see CONTRIBUTING.md, Releases); should
# it lag behind the latest v* tag, the release gets one patch above that tag.
version: 0.6.0
readme: README.md
description: Tested building blocks for RHEL 9.6 and Ubuntu 24.04 servers.
authors:
  - AroenvR
license_file: LICENSE
tags:
  - linux
  - infrastructure

# Deliberately empty: the library only uses ansible.builtin, so consumers need
# nothing beyond the ansible-core package their OS ships. Adding an entry here
# makes every consumer (including offline ones) ship that collection too.
dependencies: {}

# No repository URL: where aslib.infra is hosted keeps changing, so neither this
# file nor the documentation names it. A checkout's git remote is its source.

# Development-only files never ship to consumers, nor what .gitignore keeps out
# of git (ansible-galaxy does not read it), such as private files in tmp/.
build_ignore:
  - AGENTS.md
  - build.yml
  - CLAUDE.md
  - .config
  - .env.example
  - .tools
  - libs
  - .github
  - .gitignore
  - .gitlab-ci.yml
  - .ansible-lint
  - .venv
  - CONTRIBUTING.md
  - Makefile
  - dev
  - dist
  - roles/*/molecule
  - tmp
  - "*.tgz"
  - "*.zip"
  - "*.gpg"
  - "*.bak"
