---
# Lint, test and publish aslib.infra. Every job runs a make target, so a
# pipeline does exactly what `make` does locally (see CONTRIBUTING.md).
#
# The test jobs start Podman containers inside the job, which the runner must
# allow. The runner-check job reports what the runner offers; the test jobs
# only run once it passes.

variables:
  # Job images. Override them in Settings > CI/CD > Variables, e.g. to use an
  # internal registry mirror. Pin them to a tag or digest once the pipeline is green.
  PYTHON_IMAGE: docker.io/library/python:3.12
  PODMAN_IMAGE: quay.io/podman/stable:latest

workflow:
  rules:
    # Experimental phase: every branch, on every push, schedule or manual run.
    # main and accept get pipelines of their own later.
    - if: $CI_COMMIT_BRANCH

stages: [check, test, publish]

.with-podman:
  image: $PODMAN_IMAGE
  needs: [runner-check]
  before_script:
    # The Podman image is Fedora; the test venvs need Python 3.11 (2.14) and 3.12 (2.16).
    - dnf install --assumeyes --quiet make python3.11 python3.12

lint:
  stage: check
  image: $PYTHON_IMAGE
  script:
    - make lint PYTHON_LINT=python3
    - make test-scripts

# A branch on its way to accept raises the version: galaxy.yml's must be higher
# than accept's, with its CHANGELOG.md section. Not for main and accept themselves.
version-raised:
  stage: check
  image: $PYTHON_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH != "accept"
  script:
    - git fetch --quiet --depth=1 origin +refs/heads/accept:refs/remotes/origin/accept
    - make version-raised

# A commit that reaches develop and ends with "Closes #N" lines closes those
# issues: GitLab closes them by itself only on the default branch. Needs the
# CI/CD variable GITLAB_TOKEN, a project access token (role Reporter, scope api),
# masked and protected, with develop a protected branch so that no other
# branch's pipeline sees it. Without it the job says so and passes.
close-issues:
  stage: check
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  variables:
    GITLAB_HOST: $CI_SERVER_URL
  script:
    - printf '%s\n' "$CI_COMMIT_MESSAGE" | sh dev/ci/close-issues.sh gitlab "$CI_COMMIT_SHA"

runner-check:
  stage: check
  image: $PODMAN_IMAGE
  script:
    - sh dev/ci/runner-check.sh

servers:
  stage: test
  extends: .with-podman
  parallel:
    matrix:
      - ANSIBLE: ["2.14", "2.16"]
  script:
    - make images test-servers-$ANSIBLE

build-machine:
  stage: test
  extends: .with-podman
  parallel:
    matrix:
      - ANSIBLE: ["2.14", "2.16"]
  script:
    - make test-build-machine-$ANSIBLE
    - make test-dist-$ANSIBLE

gitlab:
  stage: test
  extends: .with-podman
  parallel:
    matrix:
      - ANSIBLE: ["2.14", "2.16"]
  script:
    - make image-rhel9 test-gitlab-$ANSIBLE

native:
  stage: test
  extends: .with-podman
  script:
    - make test-native PYTHON_LINT=python3

# Every other branch: a build kept for 7 days. GitLab keeps each pipeline's
# build until it expires; download one from the job's artifacts.
branch-build:
  stage: publish
  image: $PYTHON_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  script:
    - make dist BRANCH="$CI_COMMIT_BRANCH" PYTHON_LINT=python3
  artifacts:
    paths: ["dist/aslib-infra.*.tgz"]
    expire_in: 7 days

# The default branch (main): the next version, uploaded to the package registry
# and published as a release, which also creates its tag.
publish:
  stage: publish
  image: $PYTHON_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: release  # two pushes in a row must not claim the same version
  script:
    - make dist-release PYTHON_LINT=python3
    - VERSION=$(make --silent version)
    - |
      for file in "aslib-infra-$VERSION.tar.gz" "aslib-infra-$VERSION.tar.gz.sha256"; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "dist/$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aslib-infra/$VERSION/$file"
      done
    - echo "VERSION=$VERSION" > release.env
  artifacts:
    reports:
      dotenv: release.env

release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [publish]
  script:
    - echo "Creating release v$VERSION"
  release:
    tag_name: v$VERSION
    ref: $CI_COMMIT_SHA
    name: v$VERSION
    description: See CHANGELOG.md for what changed.
    assets:
      links:
        - name: aslib-infra-$VERSION.tar.gz
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aslib-infra/$VERSION/aslib-infra-$VERSION.tar.gz
          link_type: package
        - name: aslib-infra-$VERSION.tar.gz.sha256
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aslib-infra/$VERSION/aslib-infra-$VERSION.tar.gz.sha256
          link_type: other
