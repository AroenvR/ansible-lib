---
# Lint, test and publish aslib.infra. Every step runs a make target, so a
# pipeline does exactly what `make` does locally (see CONTRIBUTING.md).
name: CI

"on":
  # Experimental phase: every push to every branch. main and accept get
  # pipelines of their own later.
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # TODO: Set dynamically (per branch?)
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Ansible loads the collection from this path (see CONTRIBUTING.md).
    working-directory: ansible_collections/aslib/infra

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ansible_collections/aslib/infra
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: make lint

  servers:
    name: server roles · ansible-core ${{ matrix.ansible }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ansible: ["2.14", "2.16"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ansible_collections/aslib/infra
      # ansible-core 2.14 runs on Python 3.11 (as on RHEL 9.6), 2.16 on 3.12 (as on Ubuntu 24.04).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: |
            3.11
            3.12
      # Rootful Podman (sudo) runs the systemd test containers reliably on hosted runners.
      # sudo's PATH lacks setup-python's, hence the full paths.
      - run: >-
          sudo make images test-servers-${{ matrix.ansible }}
          PYTHON_2.14="$(command -v python3.11)" PYTHON_2.16="$(command -v python3.12)"

  build-machine:
    name: build-machine roles · ansible-core ${{ matrix.ansible }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ansible: ["2.14", "2.16"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ansible_collections/aslib/infra
      # ansible-core 2.14 runs on Python 3.11 (as on RHEL 9.6), 2.16 on 3.12 (as on Ubuntu 24.04).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: |
            3.11
            3.12
      # Roles such as node_image run on the build machine itself (here: the runner).
      - run: >-
          sudo make test-build-machine-${{ matrix.ansible }}
          PYTHON_2.14="$(command -v python3.11)" PYTHON_2.16="$(command -v python3.12)"
      # build.yml, which builds the tarballs, also runs where Ansible runs.
      - run: >-
          sudo make test-dist-${{ matrix.ansible }}
          PYTHON_2.14="$(command -v python3.11)" PYTHON_2.16="$(command -v python3.12)"

  native:
    name: Ubuntu 24.04's own ansible-core and Podman
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ansible_collections/aslib/infra
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: sudo make test-native PYTHON_LINT="$(command -v python3.12)"

  # Every other branch: a build kept for 7 days, only the newest one per branch.
  branch-build:
    name: branch build (kept 7 days)
    if: github.event_name == 'push' && github.ref_name != github.event.repository.default_branch
    needs: [lint, servers, build-machine, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write  # to delete this branch's older builds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ansible_collections/aslib/infra
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - id: build
        run: |
          make dist BRANCH="$GITHUB_REF_NAME" PYTHON_LINT="$(command -v python3.12)"
          echo "file=$(ls dist/aslib-infra.*.tgz)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          path: ansible_collections/aslib/infra/${{ steps.build.outputs.file }}
          archive: false  # download the .tgz itself, not a zip around it
          retention-days: 7
      - run: sh dev/ci/github-prune-builds.sh "${{ steps.upload.outputs.artifact-id }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # The default branch (main): the next version, tagged and published as a release.
  release:
    name: release (next version)
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [lint, servers, build-machine, native]
    runs-on: ubuntu-24.04
    concurrency: release  # two pushes in a row must not claim the same version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ansible_collections/aslib/infra
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: make dist-release PYTHON_LINT="$(command -v python3.12)"
      - name: Tag the commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(make --silent version)
          gh release create "v$version" "dist/aslib-infra-$version.tar.gz" "dist/aslib-infra-$version.tar.gz.sha256" \
            --target "$GITHUB_SHA" --title "v$version" --notes "See CHANGELOG.md for what changed."
