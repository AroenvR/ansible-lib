---
# Shows the rootless Podman services on every server in the inventory: their
# accounts, states, images and ports, and the latest log lines of those that do
# not run. Changes nothing. Run it from any directory with an inventory, such as
# a project's ansible/ directory:
#   ansible-playbook aslib.infra.podman_overview
#   ansible-playbook aslib.infra.podman_overview --limit <server>
# It works as root on the servers, through sudo. Options: ansible-doc -t role aslib.infra.podman_overview
- name: Show the rootless Podman services
  hosts: all
  become: true
  gather_facts: false
  roles:
    - role: aslib.infra.podman_overview
