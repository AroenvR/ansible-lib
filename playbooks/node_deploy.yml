---
# Deploys the Node.js project to every server in the inventory, as a rootless
# Podman service that starts at boot. Run it from the project's ansible/
# directory (see acme.infra.node_setup), after acme.infra.node_image:
#   ansible-playbook acme.infra.node_deploy
# It works as root on the servers, through sudo. Options: ansible-doc -t role acme.infra.node_deploy
- name: Deploy the Node.js project as a rootless Podman service
  hosts: all
  become: true
  gather_facts: false
  roles:
    - role: acme.infra.node_deploy
