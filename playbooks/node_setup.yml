---
# Prepares the Node.js project in the current directory for building and
# deploying with aslib.infra. Run it from the project root:
#   ansible-playbook aslib.infra.node_setup
# Options: ansible-doc -t role aslib.infra.node_setup
- name: Prepare the Node.js project for building and deploying
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: aslib.infra.node_setup
